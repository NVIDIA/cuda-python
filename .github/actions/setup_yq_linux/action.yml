name: Set up yq on Linux

description: >
  Install mikefarah/yq where the runner image does not provide it (the Linux GPU
  jobs run in a plain ubuntu container). ci/tools/env-vars reads ci/versions.yml
  with yq. A no-op when yq is already on PATH. Needs wget.

inputs:
  arch:
    description: The yq release architecture, amd64 or arm64.
    required: true

runs:
  using: composite
  steps:
    - name: Install yq
      shell: bash --noprofile --norc -xeuo pipefail {0}
      env:
        YQ_VERSION: v4.52.5
        YQ_ARCH: ${{ inputs.arch }}
      run: |
        if command -v yq >/dev/null 2>&1; then
          yq --version
          exit 0
        fi
        case "${YQ_ARCH}" in
          amd64) YQ_SHA256=75d893a0d5940d1019cb7cdc60001d9e876623852c31cfc6267047bc31149fa9 ;;
          arm64) YQ_SHA256=90fa510c50ee8ca75544dbfffed10c88ed59b36834df35916520cddc623d9aaa ;;
          *) echo "Error: unsupported yq architecture: ${YQ_ARCH}" >&2; exit 1 ;;
        esac
        YQ_DIR="${RUNNER_TEMP}/yq"
        mkdir -p "${YQ_DIR}"
        wget -nv -O "${YQ_DIR}/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${YQ_ARCH}"
        echo "${YQ_SHA256}  ${YQ_DIR}/yq" | sha256sum -c -
        chmod +x "${YQ_DIR}/yq"
        echo "${YQ_DIR}" >> "${GITHUB_PATH}"
        "${YQ_DIR}/yq" --version
