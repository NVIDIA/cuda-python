name: Set up hardened Python
description: >-
  Install CPython with a pinned uv, create a venv from it, and put the venv
  first on PATH. setup-uv verifies the uv binary and uv verifies the
  python-build-standalone archive against embedded checksums, so the
  interpreter's integrity does not depend on TLS. The job then fails unless
  the interpreter's ssl module rejects the compromised eMudhra/emSign CA keys
  (CVE-2026-115557; first fixed releases: 3.11.18, 3.12.16, 3.13.18, 3.14.10,
  3.15.2), and pip is updated through that ssl module. Unlike setup-python,
  this provides patched Windows builds of maintenance series, for which
  python.org publishes no installers. See
  https://github.com/NVIDIA/cuda-python/issues/3195 and
  https://discuss.python.org/t/109678.

inputs:
  python-version:
    description: >-
      uv Python request, e.g. "3.12", "3.14t" (free-threaded), or "3.16"
      (resolves to a prerelease while no final release exists). The newest
      patch known to the pinned uv is installed.
    required: true
  venv:
    description: Directory for the venv. Defaults to a new directory under RUNNER_TEMP.
    default: ""

outputs:
  python-path:
    description: Absolute path of the venv's interpreter.
    value: ${{ steps.venv.outputs.python-path }}
  python-version:
    description: Full version of the interpreter, e.g. "3.14.10".
    value: ${{ steps.venv.outputs.python-version }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        # The uv release fixes the newest available patch of each series;
        # 0.13.6 is the first with the eMudhra-fixed CPython builds.
        version: "0.13.6"
        enable-cache: false
        # Some callers (e.g. release verification) have no checkout.
        ignore-empty-workdir: true

    - name: Install Python and create venv
      id: venv
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        PY_REQUEST: ${{ inputs.python-version }}
        VENV_DIR: ${{ inputs.venv }}
        # A per-job install directory ensures the newest patch known to the
        # pinned uv is used, never an older interpreter left on a persistent
        # self-hosted runner.
        UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/setup-hardened-python/interpreters
        UV_NO_CONFIG: "1"
      run: |
        uv python install --no-bin --no-registry "${PY_REQUEST}"
        base="$(uv python find --managed-python --no-project "${PY_REQUEST}")"
        venv="${VENV_DIR}"
        if [[ -z "${venv}" ]]; then
          # A fresh directory per call, so a second call in the same job
          # (e.g. build-wheel.yml) leaves the first venv intact.
          venv="$("${base}" -c 'import sys, tempfile; print(tempfile.mkdtemp(prefix="venv-", dir=sys.argv[1]))' "${RUNNER_TEMP}")"
        fi
        # The stdlib venv seeds pip from the interpreter's bundled wheel, so
        # nothing is downloaded before the ssl check below.
        "${base}" -m venv --clear "${venv}"
        if [[ "${RUNNER_OS}" == Windows ]]; then
          py="${venv}/Scripts/python.exe"
        else
          py="${venv}/bin/python"
        fi
        # Let the interpreter report native absolute paths (Windows included).
        python_path="$("${py}" -c 'import sys; print(sys.executable)')"
        "${py}" -c 'import os, sys; print(os.path.dirname(sys.executable))' >> "${GITHUB_PATH}"
        {
          echo "python-path=${python_path}"
          echo "python-version=$("${py}" -c 'import platform; print(platform.python_version())')"
        } >> "${GITHUB_OUTPUT}"

    - name: Check Python interpreter is patched (CVE-2026-115557)
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        PYTHON: ${{ steps.venv.outputs.python-path }}
      run: |
        "${PYTHON}" -c '
        import platform
        import sys

        FIXED = {(3, 11): 18, (3, 12): 16, (3, 13): 18, (3, 14): 10, (3, 15): 2}
        v = sys.version_info
        series = (v.major, v.minor)
        name = f"{v.major}.{v.minor}"
        full = platform.python_version()
        print("sys.version:", sys.version)
        if series in FIXED:
            floor = f"{name}.{FIXED[series]}"
            if v.micro < FIXED[series]:
                print(f"::error::Python {full} is older than {floor}, the first {name} release whose ssl module rejects the compromised eMudhra CA keys (CVE-2026-115557).")
                sys.exit(1)
            print(f"Python {full}: ssl module carries the fix (first fixed: {floor}).")
        elif series > max(FIXED):
            print(f"::warning::Python {full}: no fixed {name} release is known yet.")
        else:
            print(f"::error::Python {name} has no release whose ssl module rejects the compromised eMudhra CA keys (CVE-2026-115557).")
            sys.exit(1)
        '

    - name: Update pip
      shell: bash --noprofile --norc -xeuo pipefail {0}
      env:
        PYTHON: ${{ steps.venv.outputs.python-path }}
      run: |
        "${PYTHON}" -m pip install -U pip
