name: Download artifact (with retry)

description: >-
  Wrapper around actions/download-artifact that retries once after a short
  delay when the first attempt fails.  Designed to absorb transient
  infrastructure flakes such as "other side closed" without failing the job.

inputs:
  name:
    description: "Name of the artifact to download"
    required: true
  path:
    description: "Destination path for the downloaded artifact"
    required: true
  run-id:
    description: "The run ID of the workflow run that uploaded the artifact"
    required: false
    default: ${{ github.run_id }}
  github-token:
    description: "Token used to download the artifact"
    required: false
    default: ${{ github.token }}
  retry-delay-seconds:
    description: "Seconds to wait between the first failure and the retry"
    required: false
    default: "15"

runs:
  using: composite
  steps:
    - name: Download artifact (attempt 1)
      id: attempt1
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Wait before retry
      if: ${{ steps.attempt1.outcome == 'failure' }}
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        echo "::warning::Artifact download failed (attempt 1); retrying in ${{ inputs.retry-delay-seconds }}s"
        sleep "${{ inputs.retry-delay-seconds }}"

    - name: Download artifact (attempt 2)
      if: ${{ steps.attempt1.outcome == 'failure' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
