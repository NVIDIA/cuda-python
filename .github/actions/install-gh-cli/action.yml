name: Install GitHub CLI
description: Install gh from the cli.github.com apt repo, trusting only the pinned signing key checked in next to this action

runs:
  using: composite
  steps:
    - name: Install gh
      shell: bash --noprofile --norc -xeuo pipefail {0}
      run: |
        if command -v gh >/dev/null 2>&1; then
          exit 0
        fi
        # See .github/actions/install-gh-cli/README.md for key update instructions.
        install -D -m 644 "$GITHUB_ACTION_PATH/githubcli-archive-keyring.asc" \
          /etc/apt/keyrings/githubcli-archive-keyring.asc
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.asc] https://cli.github.com/packages stable main" \
          > /etc/apt/sources.list.d/github-cli.list
        apt-get update -q
        apt-get install -y gh
