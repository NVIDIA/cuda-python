name: Harden pip
description: >-
  Install the security-fixed pip (26.2.2) from a hash-pinned wheel so that later
  pip invocations do not fall back on the vendored certifi bundle that trusts the
  compromised eMudhra/emSign intermediate CAs. The sha256 fragment guarantees the
  bootstrap download's integrity even if the bootstrapping pip's trust store is
  compromised. See https://github.com/NVIDIA/cuda-python/issues/3195 and
  https://discuss.python.org/t/109576.

inputs:
  python:
    description: Python interpreter whose pip should be hardened (e.g. a venv's python).
    default: python

runs:
  using: composite
  steps:
    - name: Install hash-pinned pip 26.2.2
      shell: bash --noprofile --norc -xeuo pipefail {0}
      env:
        HARDEN_PIP_PYTHON: ${{ inputs.python }}
      run: |
        "${HARDEN_PIP_PYTHON}" -m pip install \
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
