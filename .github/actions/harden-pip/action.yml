name: Harden pip
description: >-
  Update pip. Call sites must use setup-python with a floor spec that ensures
  the interpreter's ssl module rejects the compromised eMudhra/emSign CA keys
  (CVE-2026-115557; first fixed releases: 3.11.18, 3.12.16, 3.13.18, 3.14.10,
  3.15.2). With a patched ssl module, pip install -U pip is safe and picks up
  the latest pip, which uses truststore (the OS certificate store) by default.
  See https://github.com/NVIDIA/cuda-python/issues/3195 and
  https://discuss.python.org/t/109678.

inputs:
  python:
    description: Python interpreter whose pip should be hardened (e.g. a venv's python).
    default: python

runs:
  using: composite
  steps:
    - name: Check Python interpreter is patched (CVE-2026-115557)
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        HARDEN_PIP_PYTHON: ${{ inputs.python }}
      run: |
        "${HARDEN_PIP_PYTHON}" -c '
        import sys
        v = sys.version_info
        print("sys.version:", sys.version)
        FIXED = {(3,11):18,(3,12):16,(3,13):18,(3,14):10,(3,15):2}
        s = (v.major, v.minor)
        p = str(v.major)+"."+str(v.minor)+"."+str(v.micro)
        if s in FIXED:
            fl = str(v.major)+"."+str(v.minor)+"."+str(FIXED[s])
            if v.micro < FIXED[s]:
                print("::error::Python "+p+" is older than "+fl+", the first "+str(v.major)+"."+str(v.minor)+" release that rejects the compromised eMudhra CA keys (CVE-2026-115557).")
                sys.exit(1)
            print("Python "+p+": ssl module carries the fix (first fixed: "+fl+").")
        elif s > max(FIXED):
            print("::warning::Python "+p+": no fixed release known for "+str(v.major)+"."+str(v.minor)+" yet.")
        else:
            print("::error::Python "+str(v.major)+"."+str(v.minor)+" has no release that rejects the compromised eMudhra CA keys (CVE-2026-115557).")
            sys.exit(1)
        '

    - name: Update pip
      shell: bash --noprofile --norc -xeuo pipefail {0}
      env:
        HARDEN_PIP_PYTHON: ${{ inputs.python }}
      run: |
        "${HARDEN_PIP_PYTHON}" -m pip install -U pip
