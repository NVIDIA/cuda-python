name: Harden pip
description: >-
  Verify the CPython interpreter carries the eMudhra/emSign CA fix in its ssl
  module (3.11.18+, 3.12.16+, 3.13.18+, 3.14.10+, 3.15.2+; CVE-2026-115557),
  then update pip. The version check guarantees pip's TLS connections use the
  patched ssl module, so a hash-pinned bootstrap is no longer necessary.
  See https://github.com/NVIDIA/cuda-python/issues/3195 and
  https://discuss.python.org/t/109678.

inputs:
  python:
    description: Python interpreter whose pip should be hardened (e.g. a venv's python).
    default: python

runs:
  using: composite
  steps:
    - name: Check Python interpreter is patched
      shell: bash --noprofile --norc -xeuo pipefail {0}
      env:
        HARDEN_PIP_PYTHON: ${{ inputs.python }}
      # The script lives next to this action so that it matches the action's
      # commit even when the action is referenced from another checkout.
      run: |
        "${HARDEN_PIP_PYTHON}" "${GITHUB_ACTION_PATH}/check_python_patched.py"

    - name: Update pip
      shell: bash --noprofile --norc -xeuo pipefail {0}
      env:
        HARDEN_PIP_PYTHON: ${{ inputs.python }}
      run: |
        "${HARDEN_PIP_PYTHON}" -m pip install -U pip
