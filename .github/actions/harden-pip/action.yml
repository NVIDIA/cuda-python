name: Harden pip
description: >-
  Update pip. Call sites must use setup-python with a floor spec that ensures
  the interpreter's ssl module rejects the compromised eMudhra/emSign CA keys
  (CVE-2026-115557; first fixed releases: 3.11.18, 3.12.16, 3.13.18, 3.14.10,
  3.15.2). With a patched ssl module, pip install -U pip is safe and picks up
  the latest pip, which uses truststore (the OS certificate store) by default.
  See https://github.com/NVIDIA/cuda-python/issues/3195 and
  https://discuss.python.org/t/109678.

inputs:
  python:
    description: Python interpreter whose pip should be hardened (e.g. a venv's python).
    default: python

runs:
  using: composite
  steps:
    - name: Update pip
      shell: bash --noprofile --norc -xeuo pipefail {0}
      env:
        HARDEN_PIP_PYTHON: ${{ inputs.python }}
      run: |
        "${HARDEN_PIP_PYTHON}" -m pip install -U pip
