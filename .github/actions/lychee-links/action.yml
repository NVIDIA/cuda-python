name: Check documentation links
description: Run a configured Lychee pre-commit hook with the shared URL cache and retained reports

inputs:
  kind:
    description: "Which hook to run: authored or rendered"
    required: true
  policy:
    description: >-
      check accepts up to 10 rate-limited URLs; cache-warm warns for any unresolved
      link; allow-429 accepts only HTTP 429 failures under the maintainer override
    default: check
  refresh:
    description: "Check links afresh and publish the successful results as the new baseline"
    default: "false"
  pr-number:
    description: "PR whose current maintainer override label should be read; empty skips the lookup"
    default: ""

outputs:
  allow-429:
    description: "Whether the current PR label explicitly enables the HTTP 429 override"
    value: ${{ steps.lychee-policy.outputs.allow-429 }}

# Callers provide Python through setup-hardened-python and the checked-out
# repository; the build of any rendered documentation must already be complete.
runs:
  using: composite
  steps:
    - name: Read the PR's Lychee rate-limit override
      id: lychee-policy
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        allow_429=false
        if [[ -n "$PR_NUMBER" ]]; then
          # Reruns keep the original event's labels, so query the current decision.
          # Only an exact boolean response can enable the maintainer override.
          lookup_ok=false
          for attempt in 1 2 3; do
            if result="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels | any(.name == "ci: lychee-non-blocking")')"; then
              case "$result" in
                true|false) allow_429="$result"; lookup_ok=true; break ;;
              esac
            fi
            if (( attempt < 3 )); then
              sleep $((attempt * 5))
            fi
          done
          if [[ "$lookup_ok" != true ]]; then
            echo "::warning::Could not read a valid PR label decision; using the default link policy. Rerun to apply ci: lychee-non-blocking."
          elif [[ "$allow_429" == true ]]; then
            echo "::notice::ci: lychee-non-blocking permits only HTTP 429 failures after retries."
          fi
        fi
        echo "allow-429=$allow_429" >> "$GITHUB_OUTPUT"

    - name: Describe the link cache
      id: cache
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        KIND: ${{ inputs.kind }}
        # Anything that can change a check result or the cache's meaning. The
        # hook configuration carries the native wheel pin and every hook option.
        POLICY_HASH: ${{ hashFiles('.pre-commit-config.yaml', 'lychee.toml', 'ci/tools/run_lychee.py', 'ci/tools/run_lychee_precommit.py', 'ci/tools/retry_lychee.py', 'ci/tools/checkout_source_links.py') }}
      run: |
        # Authored and rendered results stay apart: only rendered checks validate
        # fragments, and Lychee's cache does not record which validation ran.
        case "${KIND}" in
          authored) path=.lycheecache ;;
          rendered) path=.lychee-rendered/.lycheecache ;;
          *) echo "::error::Unknown link-check kind: ${KIND}"; exit 1 ;;
        esac
        prefix="lychee-v1-${KIND}-${POLICY_HASH}-baseline-"
        echo "path=${path}" >> "${GITHUB_OUTPUT}"
        echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"
        echo "key=${prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

    - name: Restore successful link checks
      id: cache-restore
      # Refresh mode deliberately skips earlier URL results.
      if: ${{ inputs.refresh != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.cache.outputs.path }}
        key: ${{ steps.cache.outputs.key }}
        restore-keys: ${{ steps.cache.outputs.prefix }}
        enableCrossOsArchive: true

    - name: Explain a missing shared Lychee cache
      # Prefix restores are normal; cache-hit only identifies exact key matches.
      if: ${{ inputs.refresh != 'true' && steps.cache-restore.outputs.cache-matched-key == '' }}
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        KIND: ${{ inputs.kind }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/lychee.yml
      run: |
        message="No shared Lychee ${KIND} cache was restored for this checker configuration. Checking links without this baseline may take longer and make more network requests."
        context="This is expected after checker changes in a PR; a refresh on ${DEFAULT_BRANCH} cannot seed settings that exist only in a PR."
        hint="For an unexpected miss on ${DEFAULT_BRANCH}, maintainers can run CI: Lychee checks and caches (lychee.yml) on ${DEFAULT_BRANCH} with refresh-cache enabled."
        echo "::notice title=Lychee ${KIND} cache::${message} ${context} ${hint} ${WORKFLOW_URL}"
        {
          printf '### Lychee %s cache\n\n' "$KIND"
          printf '%s\n\n%s\n\n%s\n\n' "$message" "$context" "$hint"
          printf '[Open the cache refresh workflow](%s).\n' "$WORKFLOW_URL"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Check links through the configured pre-commit hook
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        KIND: ${{ inputs.kind }}
        POLICY: ${{ steps.lychee-policy.outputs.allow-429 == 'true' && 'allow-429' || inputs.policy }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # Install into the interpreter that runs the driver, whatever shell
        # profile the caller's other steps use.
        python -m pip install pre-commit
        python ci/tools/run_lychee_precommit.py "${KIND}" --policy "${POLICY}" --max-attempts 3 \
          --report "${RUNNER_TEMP}/lychee-reports/lychee-${KIND}.json"

    - name: Publish fresh successful link checks
      # Only refresh runs publish, so every pull request restores the same
      # baseline. Saving keeps original timestamps and never caches failures.
      if: ${{ !cancelled() && inputs.refresh == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.cache.outputs.path }}
        key: ${{ steps.cache.outputs.key }}
        enableCrossOsArchive: true

    - name: Upload link-check reports
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: lychee-${{ inputs.kind }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/lychee-reports/
        if-no-files-found: ignore
        retention-days: 7
