name: "Inspect: PR Preview Documentation Cleanup"

on:
  workflow_dispatch: {}

# This workflow intentionally cannot modify gh-pages or PR comments. Keeping
# manual inspection separate prevents a selected stale ref from inheriting the
# scheduled cleanup workflow's write permissions.
permissions:
  contents: read
  pull-requests: read

jobs:
  inspect:
    name: Find stale PR preview folders
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'NVIDIA' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - name: Checkout trusted cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Inspect PR previews
        id: inspect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/cleanup-pr-previews --dry-run

      - name: Summary
        if: always()
        run: |
          echo "### PR Preview Cleanup Inspection" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.inspect.outcome }}" != "success" ]]; then
            echo "❌ Inspection failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Dry-run completed successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "No changes were made to the gh-pages branch or PR comments" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
