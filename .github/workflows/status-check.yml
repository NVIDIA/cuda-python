name: "CI: Summary"

on:
  workflow_call:

jobs:
  checks:
    name: Check job status
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Checks
        uses: poseidon/wait-for-status-checks@e7e24423722c5b8e97a6dd5848827d2a412f812d  # v0.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          match_pattern: "CI*"
          ignore_pattern: ".*Check job status.*"  # ignore self
