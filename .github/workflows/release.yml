name: "CI: Release"

# Disposable PR 2737 validation harness. This revision can validate the CUDA
# 12 release path, but it cannot create a GitHub release, publish packages, or
# deploy documentation. Delete the upstream branch after preserving evidence.

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to validate"
        required: true
        type: choice
        options:
          - cuda-bindings
      release-action:
        description: "Only dry-run is available on this validation branch"
        required: true
        type: choice
        options:
          - dry-run
      git-tag:
        description: "Synthetic local-only release tag"
        required: true
        type: choice
        options:
          - v12.9.99
      run-id:
        description: "Successful synthetic-tag CI workflow_dispatch run ID"
        required: true
        type: string
      dry-run-source-sha:
        description: "Exact 40-character harness commit SHA used by the CI run"
        required: true
        type: string

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

jobs:
  check-tag:
    name: Validate isolated dry-run context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout validation control plane without push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Reject any non-harness invocation
        env:
          DRY_RUN_SOURCE_SHA: ${{ inputs.dry-run-source-sha }}
          EXPECTED_BRANCH: rwgk/pr2737-cuda12-release-dry-run
          EXPECTED_REPOSITORY: NVIDIA/cuda-python
          EXPECTED_TAG: v12.9.99
          RELEASE_ACTION: ${{ inputs.release-action }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_GIT_TAG: ${{ inputs.git-tag }}
          REQUESTED_RUN_ID: ${{ inputs.run-id }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ||
                "$GITHUB_EVENT_NAME" != "workflow_dispatch" ||
                "$GITHUB_REF_TYPE" != "branch" ||
                "$GITHUB_REF_NAME" != "$EXPECTED_BRANCH" ||
                "$RELEASE_ACTION" != "dry-run" ||
                "$RELEASE_COMPONENT" != "cuda-bindings" ||
                "$RELEASE_GIT_TAG" != "$EXPECTED_TAG" ]]; then
            echo "error: this workflow revision is restricted to the PR 2737 CUDA 12 dry-run harness" >&2
            exit 1
          fi
          if [[ ! "$DRY_RUN_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ||
                "$DRY_RUN_SOURCE_SHA" != "$GITHUB_SHA" ||
                "$(git rev-parse HEAD)" != "$DRY_RUN_SOURCE_SHA" ]]; then
            echo "error: dry-run-source-sha must be the exact dispatched harness commit" >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "error: run-id must be an explicit positive integer" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_GIT_TAG"

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_GIT_TAG" >/dev/null
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "error: refusing to shadow existing remote tag $RELEASE_GIT_TAG" >&2
            exit 1
          fi
          if [[ "$status" -ne 2 ]]; then
            echo "error: could not prove that remote tag $RELEASE_GIT_TAG is absent" >&2
            exit "$status"
          fi

  resolve-bindings-package:
    name: Resolve CUDA bindings package
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bindings-package: ${{ steps.resolve.outputs.bindings-package }}
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.dry-run-source-sha }}
          path: release-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CI tool dependencies
        run: python -m pip install -e ./ci

      - name: Resolve bindings release package
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.git-tag }}
        run: |
          bindings_package=$(python -m ci.tools.bindings_config \
            --release-tag "$RELEASE_TAG" \
            --release-source-root release-source \
            --control-config ci/versions.yml)
          echo "bindings-package=${bindings_package}" >> "$GITHUB_OUTPUT"

  determine-run-id:
    name: Validate prerequisite CI run
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.validate-run.outputs.run-id }}
    steps:
      - name: Validate exact workflow run
        id: validate-run
        env:
          DRY_RUN_SOURCE_SHA: ${{ inputs.dry-run-source-sha }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          REQUESTED_RUN_ID: ${{ inputs.run-id }}
        run: |
          run=$(gh run view "$REQUESTED_RUN_ID" \
            --repo "$RELEASE_REPOSITORY" \
            --json conclusion,databaseId,event,headBranch,headSha,status,url,workflowName)
          jq -e \
            --arg branch "$EXPECTED_BRANCH" \
            --arg sha "$DRY_RUN_SOURCE_SHA" \
            --argjson run_id "$REQUESTED_RUN_ID" '
              .databaseId == $run_id
              and .workflowName == "CI"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .headBranch == $branch
              and .headSha == $sha
            ' <<< "$run"
          echo "run-id=$REQUESTED_RUN_ID" >> "$GITHUB_OUTPUT"
          jq -r '"Validated prerequisite CI run: " + .url' <<< "$run" >> "$GITHUB_STEP_SUMMARY"

  check-release-notes:
    name: Check synthetic release notes
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    needs:
      - check-tag
      - resolve-bindings-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.dry-run-source-sha }}
          path: release-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CI tool dependencies
        run: python -m pip install -e ./ci

      - name: Check versioned release notes exist
        env:
          BINDINGS_PACKAGE: ${{ needs.resolve-bindings-package.outputs.bindings-package }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_TAG: ${{ inputs.git-tag }}
        run: |
          python -m ci.tools.check_release_notes \
            --git-tag "$RELEASE_TAG" \
            --component "$RELEASE_COMPONENT" \
            --repo-root release-source \
            --bindings-package "$BINDINGS_PACKAGE"

  doc:
    name: Build release docs without deployment
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    permissions:
      actions: read
      contents: read
    needs:
      - check-tag
      - check-release-notes
      - determine-run-id
      - resolve-bindings-package
    uses: ./.github/workflows/build-docs.yml
    with:
      bindings-package: ${{ needs.resolve-bindings-package.outputs.bindings-package }}
      checkout-ref: ${{ inputs.dry-run-source-sha }}
      component: ${{ inputs.component }}
      deploy-docs: false
      git-tag: ${{ inputs.git-tag }}
      is-release: true
      run-id: ${{ needs.determine-run-id.outputs.run-id }}

  upload-archive:
    name: Validate release artifacts without publication
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    permissions:
      actions: read
      contents: read
    needs:
      - check-tag
      - check-release-notes
      - determine-run-id
      - doc
      - resolve-bindings-package
    uses: ./.github/workflows/release-upload.yml
    with:
      bindings-package: ${{ needs.resolve-bindings-package.outputs.bindings-package }}
      component: ${{ inputs.component }}
      git-tag: ${{ inputs.git-tag }}
      release-source-sha: ${{ inputs.dry-run-source-sha }}
      run-id: ${{ needs.determine-run-id.outputs.run-id }}

  # There are intentionally no GitHub Release, TestPyPI, PyPI, or Pages jobs in
  # this disposable workflow revision.
