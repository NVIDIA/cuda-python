name: "CI: Release"

# Manually-triggered release workflow. Creates a release draft if one doesn't exist
# for the given tag, or uses an existing draft, then publishes the selected wheels
# to TestPyPI followed by PyPI. The dry-run mode validates the release path
# without publishing to external release surfaces.
#
# Maintenance note: validate non-trivial changes with dry-run workflow_dispatch
# runs for tags from both the maintenance and current bindings packages. Leave
# run-id blank so automatic tag-run discovery, artifact filtering, and version
# validation are exercised.

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to release"
        required: true
        type: choice
        options:
          - cuda-core
          - cuda-bindings
          - cuda-pathfinder
          - cuda-python
      release-action:
        description: "What to run"
        required: true
        type: choice
        options:
          - dry-run
          - full-release
        default: dry-run
      git-tag:
        description: "The release git tag"
        required: true
        type: string
      run-id:
        description: "The GHA run ID that generated validated artifacts (optional - auto-detects successful tag-triggered CI run for git-tag)"
        required: false
        type: string
        default: ""
      dry-run-docs-branch:
        description: "Dry-run only: optional gh-pages-* branch to receive generated docs, for example gh-pages-dry-run"
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

jobs:
  resolve-bindings-package:
    if: ${{ github.repository_owner == 'nvidia' }}
    runs-on: ubuntu-latest
    outputs:
      bindings-package: ${{ steps.resolve.outputs.bindings-package }}
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.git-tag }}
          path: release-source

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install CI tool dependencies
        run: python -m pip install -r ci/tools/requirements.txt

      - name: Resolve bindings release package
        id: resolve
        env:
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_TAG: ${{ inputs.git-tag }}
        run: |
          if [[ "$RELEASE_COMPONENT" == "cuda-bindings" || "$RELEASE_COMPONENT" == "cuda-python" ]]; then
            bindings_package=$(python -m ci.tools.bindings_config \
              --release-tag "$RELEASE_TAG" \
              --release-source-root release-source \
              --control-config ci/versions.yml)
            echo "bindings-package=${bindings_package}" >> "$GITHUB_OUTPUT"
          else
            echo "bindings-package=" >> "$GITHUB_OUTPUT"
          fi

  determine-run-id:
    if: ${{ github.repository_owner == 'nvidia' }}
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.lookup-run-id.outputs.run-id }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # lookup-run-id resolves the git tag to a SHA; we need tags but not history.
          fetch-depth: 1
          fetch-tags: true

      - name: Determine Run ID
        id: lookup-run-id
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GIT_TAG: ${{ inputs.git-tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          REQUESTED_RUN_ID: ${{ inputs.run-id }}
        run: |
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            echo "Validating provided run ID: $REQUESTED_RUN_ID"
            RUN_ID=$(./ci/tools/lookup-run-id \
              --tag "$RELEASE_GIT_TAG" \
              --run-id "$REQUESTED_RUN_ID" \
              "$RELEASE_REPOSITORY")
          else
            echo "Auto-detecting successful tag-triggered run ID for tag: $RELEASE_GIT_TAG"
            RUN_ID=$(./ci/tools/lookup-run-id --tag "$RELEASE_GIT_TAG" "$RELEASE_REPOSITORY")
            echo "Auto-detected run ID: $RUN_ID"
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  check-tag:
    if: ${{ github.repository_owner == 'nvidia' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Dry-run validation resolves the requested tag locally; we need tags but not history.
          fetch-depth: 1
          fetch-tags: true

      - name: Check release tag and draft state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ inputs.release-action }}
          RELEASE_GIT_TAG: ${{ inputs.git-tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          DRY_RUN_DOCS_BRANCH: ${{ inputs.dry-run-docs-branch }}
        run: |
          if [[ "$RELEASE_ACTION" == "full-release" && -n "$DRY_RUN_DOCS_BRANCH" ]]; then
            echo "error: dry-run-docs-branch is only valid with release-action=dry-run" >&2
            exit 1
          fi
          if [[ "$RELEASE_ACTION" == "dry-run" && -n "$DRY_RUN_DOCS_BRANCH" && ! "$DRY_RUN_DOCS_BRANCH" =~ ^gh-pages-[[:alnum:]._/-]+$ ]]; then
            echo "error: dry-run-docs-branch must be a non-production gh-pages-* branch" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_GIT_TAG"
          git rev-parse --verify "refs/tags/${RELEASE_GIT_TAG}^{commit}"

          if [[ "$RELEASE_ACTION" == "dry-run" ]]; then
            echo "Dry-run selected; not checking or creating a GitHub release draft."
            exit 0
          fi

          mapfile -t tags < <(gh release list -R "$RELEASE_REPOSITORY" --json tagName --jq '.[] | .tagName')
          mapfile -t is_draft < <(gh release list -R "$RELEASE_REPOSITORY" --json isDraft --jq '.[] | .isDraft')

          found=0
          for idx in "${!tags[@]}"; do
            if [[ "${tags[$idx]}" == "$RELEASE_GIT_TAG" ]]; then
              echo "found existing release for $RELEASE_GIT_TAG"
              found=1
              if [[ "${is_draft[$idx]}" != "true" ]]; then
                echo "the release note is not in draft state"
                exit 1
              fi
              break
            fi
          done
          if [[ "$found" == 0 ]]; then
            echo "no release found for $RELEASE_GIT_TAG, creating draft release"
            gh release create "$RELEASE_GIT_TAG" \
              --verify-tag \
              --draft \
              --repo "$RELEASE_REPOSITORY" \
              --title "Release $RELEASE_GIT_TAG" \
              --notes "Release $RELEASE_GIT_TAG"
          fi

  check-release-notes:
    if: ${{ github.repository_owner == 'nvidia' }}
    runs-on: ubuntu-latest
    needs: resolve-bindings-package
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.git-tag }}
          path: release-source

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install CI tool dependencies
        run: python -m pip install -r ci/tools/requirements.txt

      - name: Check versioned release notes exist
        env:
          BINDINGS_PACKAGE: ${{ needs.resolve-bindings-package.outputs.bindings-package }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_TAG: ${{ inputs.git-tag }}
        run: |
          python -m ci.tools.check_release_notes \
            --git-tag "$RELEASE_TAG" \
            --component "$RELEASE_COMPONENT" \
            --repo-root release-source \
            --bindings-package "$BINDINGS_PACKAGE"

  doc:
    name: Build release docs
    if: ${{ github.repository_owner == 'nvidia' }}
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    needs:
      - check-tag
      - check-release-notes
      - determine-run-id
      - resolve-bindings-package
    secrets: inherit
    uses: ./.github/workflows/build-docs.yml
    with:
      component: ${{ inputs.component }}
      git-tag: ${{ inputs.git-tag }}
      run-id: ${{ needs.determine-run-id.outputs.run-id }}
      is-release: true
      deploy-docs: ${{ inputs.release-action == 'full-release' || inputs.dry-run-docs-branch != '' }}
      docs-branch: ${{ (inputs.release-action == 'dry-run' && inputs.dry-run-docs-branch) || 'gh-pages' }}
      bindings-package: ${{ needs.resolve-bindings-package.outputs.bindings-package }}

  upload-archive:
    name: Validate release artifacts
    permissions:
      contents: write
    needs:
      - check-tag
      - check-release-notes
      - determine-run-id
      - doc
      - resolve-bindings-package
    secrets: inherit
    uses: ./.github/workflows/release-upload.yml
    with:
      git-tag: ${{ inputs.git-tag }}
      run-id: ${{ needs.determine-run-id.outputs.run-id }}
      component: ${{ inputs.component }}
      dry-run: ${{ inputs.release-action == 'dry-run' }}
      bindings-package: ${{ needs.resolve-bindings-package.outputs.bindings-package }}

  publish-testpypi:
    name: Publish wheels to TestPyPI
    if: ${{ inputs.release-action == 'full-release' }}
    runs-on: ubuntu-latest
    needs:
      - check-tag
      - check-release-notes
      - determine-run-id
      - doc
      - resolve-bindings-package
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ inputs.component }}/
    permissions:
      id-token: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install CI tool dependencies
        run: python -m pip install -r ci/tools/requirements.txt

      - name: Download component wheels
        env:
          BINDINGS_PACKAGE: ${{ needs.resolve-bindings-package.outputs.bindings-package }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ needs.determine-run-id.outputs.run-id }}
          RELEASE_TAG: ${{ inputs.git-tag }}
        run: |
          ./ci/tools/download-wheels \
            "$RELEASE_RUN_ID" \
            "$RELEASE_COMPONENT" \
            "$RELEASE_REPOSITORY" \
            "dist" \
            "$RELEASE_TAG" \
            "$BINDINGS_PACKAGE"

      - name: Validate wheel versions for release tag
        env:
          BINDINGS_PACKAGE: ${{ needs.resolve-bindings-package.outputs.bindings-package }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_TAG: ${{ inputs.git-tag }}
        run: |
          python -m ci.tools.validate_release_wheels \
            "$RELEASE_TAG" \
            "$RELEASE_COMPONENT" \
            "dist" \
            --bindings-package "$BINDINGS_PACKAGE"

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish wheels to PyPI
    if: ${{ inputs.release-action == 'full-release' }}
    runs-on: ubuntu-latest
    needs:
      - determine-run-id
      - publish-testpypi
      - resolve-bindings-package
    environment:
      name: pypi
      url: https://pypi.org/p/${{ inputs.component }}/
    permissions:
      id-token: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install CI tool dependencies
        run: python -m pip install -r ci/tools/requirements.txt

      - name: Download component wheels
        env:
          BINDINGS_PACKAGE: ${{ needs.resolve-bindings-package.outputs.bindings-package }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ needs.determine-run-id.outputs.run-id }}
          RELEASE_TAG: ${{ inputs.git-tag }}
        run: |
          ./ci/tools/download-wheels \
            "$RELEASE_RUN_ID" \
            "$RELEASE_COMPONENT" \
            "$RELEASE_REPOSITORY" \
            "dist" \
            "$RELEASE_TAG" \
            "$BINDINGS_PACKAGE"

      - name: Validate wheel versions for release tag
        env:
          BINDINGS_PACKAGE: ${{ needs.resolve-bindings-package.outputs.bindings-package }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_TAG: ${{ inputs.git-tag }}
        run: |
          python -m ci.tools.validate_release_wheels \
            "$RELEASE_TAG" \
            "$RELEASE_COMPONENT" \
            "dist" \
            --bindings-package "$BINDINGS_PACKAGE"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0

  # TODO: add another job to make the release leave the draft state?
