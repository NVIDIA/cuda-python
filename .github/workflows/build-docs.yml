name: "CI: Build and update docs"

on:
  workflow_call:
    inputs:
      component:
        description: "Component(s) to build docs for"
        required: false
        default: "all"
        type: string
        # below are the acceptable options:
        #   - cuda-core
        #   - cuda-bindings
        #   - cuda-python
        #   - cuda-pathfinder
        #   - all
      targets:
        description: "JSON array of exact Moon docs targets. Empty derives targets from component."
        required: false
        default: ""
        type: string
      git-tag:
        description: "Target git tag to build docs for"
        required: false
        default: ""
        type: string
      run-id:
        description: "The GHA run ID that generated validated artifacts"
        required: false
        default: ${{ github.run_id }}
        type: string
      is-release:
        description: "Are we building release docs?"
        required: false
        default: false
        type: boolean
      deploy-docs:
        description: "Deploy generated docs to GitHub Pages or preview branches"
        required: false
        default: true
        type: boolean
      docs-branch:
        description: "Branch that receives deployed docs"
        required: false
        default: "gh-pages"
        type: string

jobs:
  build:
    name: Build docs
    # The build stage could fail but we want the CI to keep moving.
    if: ${{ github.repository_owner == 'nvidia' && !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.git-tag }}

      - name: Resolve Moon docs targets
        env:
          REQUESTED_TARGETS: ${{ inputs.targets }}
          COMPONENT: ${{ inputs.component }}
        run: |
          if [[ -n "$REQUESTED_TARGETS" ]]; then
            targets="$REQUESTED_TARGETS"
          else
            case "$COMPONENT" in
              all) targets='["root:docs"]' ;;
              cuda-pathfinder) targets='["pathfinder:docs"]' ;;
              cuda-bindings) targets='["bindings:docs"]' ;;
              cuda-core) targets='["core:docs"]' ;;
              cuda-python) targets='["metapackage:docs"]' ;;
              *) echo "error: unsupported docs component: $COMPONENT" >&2; exit 1 ;;
            esac
          fi
          jq -e '
            type == "array" and length > 0 and
            all(.[];
              . == "root:docs" or
              . == "pathfinder:docs" or
              . == "bindings:docs" or
              . == "core:docs" or
              . == "metapackage:docs")
          ' <<< "$targets" >/dev/null
          echo "DOCS_TARGETS=$(jq -c . <<< "$targets")" >> "$GITHUB_ENV"
          if [[ -f .moon/workspace.yml && -f moon.yml ]]; then
            echo "DOCS_USE_MOON=true" >> "$GITHUB_ENV"
          else
            echo "DOCS_USE_MOON=false" >> "$GITHUB_ENV"
          fi

      - name: Read build CTK version
        run: |
          if [[ -f ci/versions.yml ]]; then
            BUILD_CTK_VER=$(yq '.cuda.build.version' ci/versions.yml)
          elif [[ -f ci/versions.json ]]; then
            BUILD_CTK_VER=$(jq -r '.cuda.build.version' ci/versions.json)
          else
            echo "error: cannot find ci/versions.yml or ci/versions.json" >&2
            exit 1
          fi
          if [[ ! "${BUILD_CTK_VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: derived CTK build version ${BUILD_CTK_VER} does not match MAJOR.MINOR.MICRO" >&2
            exit 1
          fi
          echo "BUILD_CTK_VER=${BUILD_CTK_VER}" >> "$GITHUB_ENV"

      # TODO: This workflow runs on GH-hosted runner and cannot use the proxy cache

      - name: Set up miniforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
        with:
          activate-environment: cuda-python-docs
          environment-file: ./cuda_python/docs/environment-docs.yml
          miniforge-version: latest
          conda-remove-defaults: "true"
          python-version: 3.12

      - name: Check conda env
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show

      - name: Install Moon
        if: ${{ env.DOCS_USE_MOON == 'true' }}
        run: |
          curl -fsSL "https://github.com/moonrepo/moon/releases/download/v2.5.1/moon_cli-installer.sh" | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # WAR: Building the doc currently requires CTK installed (NVIDIA/cuda-python#326,327)
      - name: Set up mini CTK
        uses: ./.github/actions/fetch_ctk
        with:
          host-platform: linux-64
          cuda-version: ${{ env.BUILD_CTK_VER }}

      - name: Set environment variables
        run: |
          PYTHON_VERSION_FORMATTED="312"  # see above
          REPO_DIR=$(pwd)

          if [[ ${{ inputs.is-release }} == "true" ]]; then
            FILE_HASH="*"
            DOCS_GITHUB_REF="${{ inputs.git-tag }}"
            if [[ -z "${DOCS_GITHUB_REF}" ]]; then
              DOCS_GITHUB_REF="${GITHUB_REF_NAME}"
            fi
          else
            FILE_HASH="${{ github.sha }}"
            DOCS_GITHUB_REF="${{ github.sha }}"
          fi

          # make outputs from the previous job as env vars
          CUDA_CORE_ARTIFACT_BASENAME="cuda-core-python${PYTHON_VERSION_FORMATTED}-linux-64"
          echo "CUDA_PYTHON_DOCS_GITHUB_REF=${DOCS_GITHUB_REF}" >> $GITHUB_ENV
          echo "CUDA_CORE_ARTIFACT_BASENAME=${CUDA_CORE_ARTIFACT_BASENAME}" >> $GITHUB_ENV
          echo "CUDA_CORE_ARTIFACT_NAME=${CUDA_CORE_ARTIFACT_BASENAME}-${FILE_HASH}" >> $GITHUB_ENV
          echo "CUDA_CORE_ARTIFACTS_DIR=$(realpath "$REPO_DIR/cuda_core/dist")" >> $GITHUB_ENV
          CUDA_BINDINGS_ARTIFACT_BASENAME="cuda-bindings-python${PYTHON_VERSION_FORMATTED}-cuda${BUILD_CTK_VER}-linux-64"
          echo "CUDA_BINDINGS_ARTIFACT_BASENAME=${CUDA_BINDINGS_ARTIFACT_BASENAME}" >> $GITHUB_ENV
          echo "CUDA_BINDINGS_ARTIFACT_NAME=${CUDA_BINDINGS_ARTIFACT_BASENAME}-${FILE_HASH}" >> $GITHUB_ENV
          echo "CUDA_BINDINGS_ARTIFACTS_DIR=$(realpath "$REPO_DIR/cuda_bindings/dist")" >> $GITHUB_ENV

      - name: Download cuda-python build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cuda-python-wheel
          path: ./cuda_python/dist
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Display structure of downloaded cuda-python artifacts
        run: |
          pwd
          ls -lahR .

      - name: Download cuda-pathfinder build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cuda-pathfinder-wheel
          path: ./cuda_pathfinder/dist
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Display structure of downloaded cuda-pathfinder artifacts
        run: |
          pwd
          ls -lahR cuda_pathfinder

      - name: Download cuda.bindings build artifacts
        if: ${{ !inputs.is-release }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_BINDINGS_ARTIFACT_NAME }}
          path: ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}

      - name: Download cuda.bindings build artifacts
        if: ${{ inputs.is-release }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: ${{ env.CUDA_BINDINGS_ARTIFACT_NAME }}
          merge-multiple: true
          path: ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Display structure of downloaded cuda.bindings artifacts
        run: |
          pwd
          ls -lahR $CUDA_BINDINGS_ARTIFACTS_DIR

      - name: Download cuda.core build artifacts
        if: ${{ !inputs.is-release }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_NAME }}
          path: ${{ env.CUDA_CORE_ARTIFACTS_DIR }}

      - name: Download cuda.core build artifacts
        if: ${{ inputs.is-release }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: ${{ env.CUDA_CORE_ARTIFACT_NAME }}
          merge-multiple: true
          path: ${{ env.CUDA_CORE_ARTIFACTS_DIR }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Display structure of downloaded cuda.core build artifacts
        run: |
          pwd
          ls -lahR $CUDA_CORE_ARTIFACTS_DIR

      - name: Install all packages
        run: |
          pushd cuda_pathfinder/dist
          pip install *.whl
          popd

          pushd "${CUDA_BINDINGS_ARTIFACTS_DIR}"
          pip install *.whl
          popd

          pushd "${CUDA_CORE_ARTIFACTS_DIR}"
          pip install *.whl
          popd

          # Subpackages are already installed from CI artifacts above.
          # --no-deps avoids re-resolving cuda-core from PyPI during tag releases.
          pip install --no-deps cuda_python/dist/*.whl

      # This step sets the PR_NUMBER/BUILD_LATEST/BUILD_PREVIEW env vars.
      - name: Get PR number
        if: ${{ !inputs.is-release }}
        uses: ./.github/actions/get_pr_number

      - name: Set up artifact directories
        run: |
          mkdir -p artifacts/docs
          # create an empty folder for removal use
          mkdir -p artifacts/empty_docs

      - name: Build selected docs
        if: ${{ env.DOCS_USE_MOON == 'true' }}
        env:
          DOCS_BUILD_ARGS: ${{ !inputs.is-release && 'latest-only' || '' }}
        run: |
          mapfile -t targets < <(jq -r '.[]' <<< "$DOCS_TARGETS")
          moon run "${targets[@]}" --upstream deep --downstream none

      # Release workflows may check out tags created before Moon was added.
      - name: Build selected docs from a legacy tag
        if: ${{ env.DOCS_USE_MOON != 'true' }}
        run: |
          if [[ "${{ inputs.component }}" == "all" ]]; then
            pushd cuda_python/docs
            if [[ "${{ inputs.is-release }}" == "false" ]]; then
              ./build_all_docs.sh latest-only
            else
              ./build_all_docs.sh
              rm -rf build/html/latest
            fi
            popd
          else
            component="${{ inputs.component }}"
            component=${component//-/_}
            pushd "$component/docs"
            if [[ "${{ inputs.is-release }}" == "false" ]]; then
              ./build_docs.sh latest-only
            else
              ./build_docs.sh
              rm -rf build/html/latest
            fi
            popd
          fi

      - name: Assemble selected docs
        run: |
          if jq -e 'index("root:docs") != null' <<< "$DOCS_TARGETS" >/dev/null; then
            if [[ "${{ inputs.is-release }}" == "true" ]]; then
              rm -rf cuda_python/docs/build/html/latest
            fi
            ls -l cuda_python/docs/build
            mv cuda_python/docs/build/html/* artifacts/docs/
            exit 0
          fi

          while IFS= read -r target; do
            case "$target" in
              pathfinder:docs)
                component=cuda_pathfinder
                destination=cuda-pathfinder
                ;;
              bindings:docs)
                component=cuda_bindings
                destination=cuda-bindings
                ;;
              core:docs)
                component=cuda_core
                destination=cuda-core
                ;;
              metapackage:docs)
                component=cuda_python
                destination=
                ;;
            esac
            if [[ "${{ inputs.is-release }}" == "true" ]]; then
              rm -rf "$component/docs/build/html/latest"
            fi
            ls -l "$component/docs/build"
            if [[ -n "$destination" ]]; then
              mkdir -p "artifacts/docs/$destination"
            fi
            mv "$component"/docs/build/html/* "artifacts/docs/$destination"
          done < <(jq -r '.[]' <<< "$DOCS_TARGETS")

      - name: Write rendered docs file list
        if: ${{ !inputs.is-release && github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}
        run: |
          find "${GITHUB_WORKSPACE}/artifacts/docs" -type f -name '*.html' ! -path '*/_static/*' \
            | LC_ALL=C sort > lychee-rendered-html-files.txt
          if [[ ! -s lychee-rendered-html-files.txt ]]; then
            echo "error: no rendered HTML pages found for lychee" >&2
            exit 1
          fi
          wc -l lychee-rendered-html-files.txt

      - name: Restore lychee cache
        if: ${{ !inputs.is-release && github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}
        id: restore-lychee-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .lycheecache
          key: docs-rendered-lychee-${{ env.PR_NUMBER }}-${{ github.sha }}
          restore-keys: |
            docs-rendered-lychee-${{ env.PR_NUMBER }}-

      - name: Check rendered docs links
        if: ${{ !inputs.is-release && github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') }}
        uses: lycheeverse/lychee-action@6da1d14f3a43098a294b7696d93d938aa8d20fc0  # unreleased: supports v0.24.x archive layout
        with:
          # PR-preview canonical URLs are checked by the preview deployment workflow.
          # The cuda-bindings #id links are docutils "problematic" anchors from generated API docs.
          # TODO: Remove this exclusion after cybind stops emitting those problematic anchors.
          # Preferred Networks rejects hosted-runner GETs, but the URL is browser reachable.
          args: >-
            --files-from ${{ github.workspace }}/lychee-rendered-html-files.txt
            --include-fragments=full
            --cache
            --max-cache-age 1d
            --max-concurrency 16
            --host-concurrency 2
            --host-request-interval 250ms
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --no-progress
            --exclude '^https://nvidia\.github\.io/cuda-python/pr-preview/pr-[0-9]+/'
            --exclude '^file://.*/cuda-bindings/latest/module/(driver|runtime)\.html#id[0-9]+$'
            --exclude '^https://www\.preferred\.jp/en/?$'
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: false
          lycheeVersion: v0.24.2
          output: lychee-rendered-html.md
          token: ${{ github.token }}

      - name: Save lychee cache
        if: ${{ always() && !inputs.is-release && github.ref_name != 'main' && !startsWith(github.ref_name, 'release/') && steps.restore-lychee-cache.outputs.cache-hit != 'true' && steps.restore-lychee-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .lycheecache
          key: ${{ steps.restore-lychee-cache.outputs.cache-primary-key }}

      - name: Upload docs GitHub Pages artifact
        if: ${{ inputs.deploy-docs }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: artifacts/
          retention-days: 3

      - name: Upload dry-run docs artifact
        if: ${{ !inputs.deploy-docs || (inputs.is-release && inputs.docs-branch != 'gh-pages') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-docs-dry-run-${{ inputs.component }}-${{ inputs.git-tag }}
          path: artifacts/docs/
          retention-days: 3

      - name: Deploy or clean up doc preview
        if: ${{ inputs.deploy-docs && !inputs.is-release }}
        uses: ./.github/actions/doc_preview
        with:
          source-folder: ${{ (github.ref_name != 'main' && 'artifacts/docs') ||
                              'artifacts/empty_docs' }}
          pr-number: ${{ env.PR_NUMBER }}

      - name: Deploy doc update
        if: ${{ inputs.deploy-docs && (github.ref_name == 'main' || inputs.is-release) }}
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f  # v4.8.0
        with:
          git-config-name: cuda-python-bot
          git-config-email: cuda-python-bot@users.noreply.github.com
          branch: ${{ inputs.docs-branch }}
          folder: artifacts/docs/
          target-folder: docs/
          commit-message: "Deploy ${{ (inputs.is-release && 'release') || 'latest' }} docs: ${{ env.CUDA_PYTHON_DOCS_GITHUB_REF }}"
          clean: false
