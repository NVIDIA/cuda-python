# Temporary PR3436 root-cause workflow; remove after the diagnostic run.
name: "CI: PR3436 watermark diagnostic"

on:
  push:
    branches:
      - 'pull-request/3436'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  l4-watermark:
    if: ${{ github.repository_owner == 'nvidia' }}
    uses: ./.github/workflows/test-wheel-windows.yml
    with:
      build-type: pull-request
      host-platform: win-64
      build-ctk-ver: '13.5.0'
      run-id: '43307014352'
      sha: '1d9b2d746285fa0f958c61f8b93c5de5e09d7b26'
      source-ref: ${{ github.sha }}
      nruns: 1
      test-mode: diagnostic-watermark
      workplan: >-
        {"modules":{"pathfinder":{"needs_test":false},"bindings":{"needs_test":false},"core":{"needs_test":true},"python":{"needs_test":false}}}
      matrix_filter: >-
        map(select(.ARCH == "amd64" and .PY_VER == "3.14" and .CUDA_VER == "13.5.0" and .LOCAL_CTK == "1" and .GPU == "l4" and .GPU_COUNT == "1" and .DRIVER_MODE == "MCDM"))
        | map(. + {DRIVER: "596.36", DRIVER_SHA256: "99182c2fdf3f23c503c74608945d84be99f036b5ec969f2945062069a15acd2e", ENV: {SKIP_CYTHON_TEST: "1"}})
