# Build and check documentation nightly, publishing successful link checks for
# reuse by build-docs.yml in full PR CI. Ordinary PR updates run pre-commit
# without Lychee; they do not build documentation in this workflow.

name: "CI: Documentation links"

on:
  workflow_call:
    inputs:
      concurrency-suffix:
        description: "Keep a caller's test mode separate from its full run"
        type: string
        default: full
      refresh-cache:
        description: "Check links afresh and publish a new cache baseline"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      refresh-cache:
        description: "Check links afresh and publish a new cache baseline"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.refresh-cache || false }}-${{ inputs.concurrency-suffix || 'full' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PIXI_LOCKED: "true"

jobs:
  links:
    name: Lychee (${{ matrix.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [authored, rendered]
    steps:
      - name: Checkout checked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keep SCM history/tags without downloading historical source blobs.
          filter: blob:none
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup pixi
        if: ${{ matrix.kind == 'rendered' }}
        uses: ./.github/actions/setup-pixi

      - name: Build all documentation from sources
        if: ${{ matrix.kind == 'rendered' }}
        run: |
          CUDA_PYTHON_DOCS_GITHUB_REF=$(git rev-parse HEAD)
          export CUDA_PYTHON_DOCS_GITHUB_REF
          pixi run --manifest-path cuda_core/pixi.toml -e docs docs-build-all-latest

      - name: Check documentation links
        uses: ./.github/actions/check-doc-links
        with:
          kind: ${{ matrix.kind }}
          refresh-cache: ${{ inputs.refresh-cache || false }}
