# This name is used when resolving an exact trusted baseline run.
name: "CI"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "pull-request/[0-9]+"
      - "main"
    tags:
      # Build release artifacts from tag refs so setuptools-scm resolves exact
      # release versions instead of .dev+local variants.
      - "v*"
      - "cuda-core-v*"
      - "cuda-pathfinder-v*"
  schedule:
    # Every 24 hours at midnight UTC.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  # This is the only unconditional planning runner. Moon owns affected
  # detection and writes marker outputs before any expensive runner is started.
  gate:
    name: Plan affected CI lanes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      cuda-build-ver: ${{ steps.vars.outputs.cuda-build-ver }}
      cuda-prev-build-ver: ${{ steps.vars.outputs.cuda-prev-build-ver }}
      skip: ${{ steps.directives.outputs.skip }}
      doc-only: ${{ steps.directives.outputs.doc-only }}
      moon-base: ${{ steps.baseline.outputs.moon-base }}
      moon-head: ${{ steps.baseline.outputs.moon-head }}
      moon-base-run-id: ${{ steps.baseline.outputs.moon-base-run-id }}
      moon-base-sha: ${{ steps.baseline.outputs.moon-base-sha }}
      moon-force-all: ${{ steps.markers.outputs.force-all }}
      build-portable: ${{ steps.markers.outputs.build-portable }}
      build-linux-64: ${{ steps.markers.outputs.build-linux-64 }}
      build-linux-aarch64: ${{ steps.markers.outputs.build-linux-aarch64 }}
      build-windows: ${{ steps.markers.outputs.build-windows }}
      test-sdist-linux: ${{ steps.markers.outputs.test-sdist-linux }}
      test-sdist-windows: ${{ steps.markers.outputs.test-sdist-windows }}
      test-linux: ${{ steps.markers.outputs.test-linux }}
      test-windows: ${{ steps.markers.outputs.test-windows }}
      docs: ${{ steps.markers.outputs.docs }}
      core-api: ${{ steps.markers.outputs.core-api }}
      build-pathfinder: ${{ steps.markers.outputs.build-pathfinder }}
      build-bindings: ${{ steps.markers.outputs.build-bindings }}
      build-core: ${{ steps.markers.outputs.build-core }}
      build-metapackage: ${{ steps.markers.outputs.build-metapackage }}
      test-pathfinder: ${{ steps.markers.outputs.test-pathfinder }}
      test-bindings: ${{ steps.markers.outputs.test-bindings }}
      test-core: ${{ steps.markers.outputs.test-core }}
      test-metapackage: ${{ steps.markers.outputs.test-metapackage }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Moon needs the full commit graph for affected detection, but it
          # does not need historical blobs.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Read CI variables
        id: vars
        run: |
          echo "cuda-build-ver=$(yq '.cuda.build.version' ci/versions.yml)" >> "$GITHUB_OUTPUT"
          echo "cuda-prev-build-ver=$(yq '.cuda.prev_build.version' ci/versions.yml)" >> "$GITHUB_OUTPUT"

      - name: Read PR title directives
        id: directives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          doc_only=false
          base_ref=""
          if [[ "${GITHUB_REF_NAME}" =~ ^pull-request/([0-9]+)$ ]]; then
            pr="$(gh pr view "${BASH_REMATCH[1]}" --json baseRefName,title)"
            pr_title="$(jq -r '.title' <<< "${pr}")"
            base_ref="$(jq -r '.baseRefName' <<< "${pr}")"
            if [[ "${pr_title}" == *"[no-ci]"* ]]; then
              skip=true
            fi
            if [[ "${pr_title}" == *"[doc-only]"* ]]; then
              doc_only=true
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "doc-only=${doc_only}" >> "$GITHUB_OUTPUT"
          echo "base-ref=${base_ref}" >> "$GITHUB_OUTPUT"

      - name: Resolve exact trusted Moon baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PR: ${{ startsWith(github.ref_name, 'pull-request/') }}
          SKIP: ${{ steps.directives.outputs.skip }}
          BASE_REF: ${{ steps.directives.outputs.base-ref }}
          CUDA_BUILD_VER: ${{ steps.vars.outputs.cuda-build-ver }}
        run: |
          head="$(git rev-parse HEAD)"
          base="${head}"
          base_run_id=""
          force_all=true

          if [[ "${SKIP}" != "true" && "${IS_PR}" == "true" ]]; then
            if [[ -z "${BASE_REF}" ]]; then
              echo "::error::Could not resolve the PR base branch." >&2
              exit 1
            fi
            base="$(git merge-base HEAD "origin/${BASE_REF}")"

            # Only an exact successful push run on the PR's target branch is
            # trusted. PR-produced artifacts are never eligible as a baseline.
            runs="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --branch "${BASE_REF}" \
              --commit "${base}" \
              --event push \
              --status success \
              --limit 100 \
              --json databaseId,headSha,headBranch,event,conclusion,createdAt)"
            candidate="$(
              jq -r \
                --arg base "${base}" \
                --arg branch "${BASE_REF}" \
                '[.[] |
                  select(
                    .headSha == $base and
                    .headBranch == $branch and
                    .event == "push" and
                    .conclusion == "success"
                  )
                ] | sort_by(.createdAt) | reverse | .[0].databaseId // empty' \
                <<< "${runs}"
            )"

            if [[ -n "${candidate}" ]]; then
              artifacts="$(
                gh api --paginate --slurp \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100" \
                  | jq -c '[.[].artifacts[]]'
              )"

              expected=(
                cuda-pathfinder-wheel
                cuda-python-wheel
                moon-cache-build-portable
                moon-cache-sdist-linux-64
                moon-cache-sdist-win-64
              )
              python_versions=(3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t)
              host_platforms=(linux-64 linux-aarch64 win-64)
              for host_platform in "${host_platforms[@]}"; do
                for python_version in "${python_versions[@]}"; do
                  python_version_formatted="${python_version//./}"
                  bindings_artifact="cuda-bindings-python${python_version_formatted}-cuda${CUDA_BUILD_VER}-${host_platform}-${base}"
                  core_artifact="cuda-core-python${python_version_formatted}-${host_platform}-${base}"
                  expected+=(
                    "${bindings_artifact}"
                    "${bindings_artifact}-tests"
                    "${core_artifact}"
                    "${core_artifact}-tests"
                    "${core_artifact}-test-binaries"
                  )
                  expected+=("moon-cache-build-${host_platform}-py${python_version}")
                done
              done

              complete=true
              for artifact_name in "${expected[@]}"; do
                artifact_valid="$(
                  jq \
                    --arg name "${artifact_name}" \
                    '[.[] | select(.name == $name)] |
                    length == 1 and
                    (.[0].expired | not) and
                    .[0].size_in_bytes > 0 and
                    ((.[0].digest // "") |
                      test("^sha256:[0-9a-fA-F]{64}$"))' \
                    <<< "${artifacts}"
                )"
                if [[ "${artifact_valid}" != "true" ]]; then
                  echo "No unique valid ${artifact_name} in run ${candidate}; forcing all lanes."
                  complete=false
                fi
              done

              if [[ "${complete}" == "true" ]]; then
                base_run_id="${candidate}"
                force_all=false
              fi
            fi
          elif [[ "${SKIP}" != "true" ]]; then
            # Push, tag, schedule, and manual runs deliberately exercise the
            # full pipeline and publish a complete baseline for future PRs.
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          {
            echo "moon-base=${base}"
            echo "moon-head=${head}"
            echo "moon-base-run-id=${base_run_id}"
            echo "moon-base-sha=${base}"
            echo "moon-force-all=${force_all}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Moon
        if: ${{ steps.directives.outputs.skip != 'true' }}
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0.6.4
        with:
          moon-version: "2.5.1"
          auto-install: false
          auto-setup: false

      - name: Validate Moon CI contracts
        if: ${{ steps.directives.outputs.skip != 'true' }}
        run: python -m unittest ci.tools.tests.test_moon_ci ci.tools.tests.test_moon_workspace

      - name: Materialize affected CI markers with Moon
        if: ${{ steps.directives.outputs.skip != 'true' }}
        env:
          MOON_BASE: ${{ steps.baseline.outputs.moon-base }}
          MOON_HEAD: ${{ steps.baseline.outputs.moon-head }}
          MOON_FORCE_ALL: ${{ steps.baseline.outputs.moon-force-all }}
        run: |
          args=()
          if [[ "${MOON_FORCE_ALL}" == "true" ]]; then
            args+=(--force)
          fi
          moon ci ':#ci-gate' --downstream none "${args[@]}"

      - name: Publish lane and module markers
        id: markers
        if: ${{ always() }}
        env:
          SKIP: ${{ steps.directives.outputs.skip }}
          FORCE_ALL: ${{ steps.baseline.outputs.moon-force-all }}
        run: |
          force_all="${FORCE_ALL}"
          if [[ -f "ci/.moon-out/ci-gates/force-all" ||
                -f "ci/.moon-out/ci-gates/force-all-unowned" ]]; then
            force_all=true
          fi
          echo "force-all=${force_all}" >> "$GITHUB_OUTPUT"

          markers=(
            build-portable
            build-linux-64
            build-linux-aarch64
            build-windows
            test-sdist-linux
            test-sdist-windows
            test-linux
            test-windows
            docs
            core-api
            build-pathfinder
            build-bindings
            build-core
            build-metapackage
            test-pathfinder
            test-bindings
            test-core
            test-metapackage
          )
          for marker in "${markers[@]}"; do
            selected=false
            if [[ "${SKIP}" != "true" ]] &&
               { [[ "${force_all}" == "true" ]] ||
                 [[ -f "ci/.moon-out/ci-gates/${marker}" ]]; }; then
              selected=true
            fi
            echo "${marker}=${selected}" >> "$GITHUB_OUTPUT"
          done

  api-check-core-vs-release:
    name: API check (cuda_core vs. latest release)
    if: >-
      ${{ !fromJSON(needs.gate.outputs.skip) &&
          fromJSON(needs.gate.outputs.core-api) }}
    runs-on: ubuntu-latest
    needs:
      - gate
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Find latest release tag
        id: latest-tag
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate \
            --jq '.[] | select(.name | startswith("cuda-core-v")) | .name' \
            | sed -n '1p')"
          if [[ -z "${tag}" ]]; then
            echo "::error::No cuda-core-v* tag found in the repository." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Fetch release tag
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          git fetch --depth=1 --filter=blob:none origin \
            "refs/tags/${{ steps.latest-tag.outputs.tag }}:refs/tags/${{ steps.latest-tag.outputs.tag }}"

      - name: Check cuda_core public API
        uses: ./.github/actions/griffe-api-check
        with:
          package-name: cuda.core
          package-dir: cuda_core
          merge-base: ${{ steps.latest-tag.outputs.tag }}

  api-check-core-vs-base:
    name: API check (cuda_core vs. merge base)
    if: >-
      ${{ startsWith(github.ref_name, 'pull-request/') &&
          !fromJSON(needs.gate.outputs.skip) &&
          fromJSON(needs.gate.outputs.core-api) }}
    runs-on: ubuntu-latest
    needs:
      - gate
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Fetch merge base commit
        shell: bash --noprofile --norc -euo pipefail {0}
        run: git fetch --depth=1 --filter=blob:none origin "${{ needs.gate.outputs.moon-base }}"

      - name: Check cuda_core public API
        uses: ./.github/actions/griffe-api-check
        with:
          package-name: cuda.core
          package-dir: cuda_core
          merge-base: ${{ needs.gate.outputs.moon-base }}

  build-portable:
    name: Build portable wheels
    needs:
      - gate
    if: >-
      ${{ github.repository_owner == 'nvidia' &&
          !fromJSON(needs.gate.outputs.skip) &&
          fromJSON(needs.gate.outputs.build-portable) &&
          (!fromJSON(needs.gate.outputs.doc-only) ||
           fromJSON(needs.gate.outputs.moon-force-all)) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/build-pure-wheel.yml
    with:
      build-pathfinder: ${{ fromJSON(needs.gate.outputs.build-pathfinder) }}
      build-metapackage: ${{ fromJSON(needs.gate.outputs.build-metapackage) }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      baseline-run-id: ${{ needs.gate.outputs.moon-base-run-id }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  # Native builds remain split by platform so their tests can start as soon as
  # the corresponding platform finishes. Each reusable workflow owns its
  # eight-version Python matrix and per-row Moon cache artifact.
  build-linux-64:
    name: Build linux-64, CUDA ${{ needs.gate.outputs.cuda-build-ver }}
    needs:
      - gate
      - build-portable
    if: >-
      ${{ always() &&
          github.repository_owner == 'nvidia' &&
          needs.gate.result == 'success' &&
          (needs.build-portable.result == 'success' ||
           needs.build-portable.result == 'skipped') &&
          !fromJSON(needs.gate.outputs.skip) &&
          fromJSON(needs.gate.outputs.build-linux-64) &&
          (!fromJSON(needs.gate.outputs.doc-only) ||
           fromJSON(needs.gate.outputs.moon-force-all)) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: linux-64
      cuda-version: ${{ needs.gate.outputs.cuda-build-ver }}
      prev-cuda-version: ${{ needs.gate.outputs.cuda-prev-build-ver }}
      build-bindings: ${{ fromJSON(needs.gate.outputs.build-bindings) }}
      build-core: ${{ fromJSON(needs.gate.outputs.build-core) }}
      test-bindings: ${{ fromJSON(needs.gate.outputs.test-bindings) }}
      test-core: ${{ fromJSON(needs.gate.outputs.test-core) }}
      baseline-run-id: ${{ needs.gate.outputs.moon-base-run-id }}
      baseline-sha: ${{ needs.gate.outputs.moon-base-sha }}
      portable-run-id: ${{ needs.build-portable.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  build-linux-aarch64:
    name: Build linux-aarch64, CUDA ${{ needs.gate.outputs.cuda-build-ver }}
    needs:
      - gate
      - build-portable
    if: >-
      ${{ always() &&
          github.repository_owner == 'nvidia' &&
          needs.gate.result == 'success' &&
          (needs.build-portable.result == 'success' ||
           needs.build-portable.result == 'skipped') &&
          !fromJSON(needs.gate.outputs.skip) &&
          !fromJSON(needs.gate.outputs.doc-only) &&
          fromJSON(needs.gate.outputs.build-linux-aarch64) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: linux-aarch64
      cuda-version: ${{ needs.gate.outputs.cuda-build-ver }}
      prev-cuda-version: ${{ needs.gate.outputs.cuda-prev-build-ver }}
      build-bindings: ${{ fromJSON(needs.gate.outputs.build-bindings) }}
      build-core: ${{ fromJSON(needs.gate.outputs.build-core) }}
      test-bindings: ${{ fromJSON(needs.gate.outputs.test-bindings) }}
      test-core: ${{ fromJSON(needs.gate.outputs.test-core) }}
      baseline-run-id: ${{ needs.gate.outputs.moon-base-run-id }}
      baseline-sha: ${{ needs.gate.outputs.moon-base-sha }}
      portable-run-id: ${{ needs.build-portable.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  build-windows:
    name: Build win-64, CUDA ${{ needs.gate.outputs.cuda-build-ver }}
    needs:
      - gate
      - build-portable
    if: >-
      ${{ always() &&
          github.repository_owner == 'nvidia' &&
          needs.gate.result == 'success' &&
          (needs.build-portable.result == 'success' ||
           needs.build-portable.result == 'skipped') &&
          !fromJSON(needs.gate.outputs.skip) &&
          !fromJSON(needs.gate.outputs.doc-only) &&
          fromJSON(needs.gate.outputs.build-windows) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: win-64
      cuda-version: ${{ needs.gate.outputs.cuda-build-ver }}
      prev-cuda-version: ${{ needs.gate.outputs.cuda-prev-build-ver }}
      build-bindings: ${{ fromJSON(needs.gate.outputs.build-bindings) }}
      build-core: ${{ fromJSON(needs.gate.outputs.build-core) }}
      test-bindings: ${{ fromJSON(needs.gate.outputs.test-bindings) }}
      test-core: ${{ fromJSON(needs.gate.outputs.test-core) }}
      baseline-run-id: ${{ needs.gate.outputs.moon-base-run-id }}
      baseline-sha: ${{ needs.gate.outputs.moon-base-sha }}
      portable-run-id: ${{ needs.build-portable.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  # GitHub allocates each platform lane; Moon selects the affected sdist tasks
  # and their declared package dependencies inside the reusable workflow.
  test-sdist-linux:
    name: Test sdist linux-64
    needs:
      - gate
    if: >-
      ${{ github.repository_owner == 'nvidia' &&
          !fromJSON(needs.gate.outputs.skip) &&
          !fromJSON(needs.gate.outputs.doc-only) &&
          fromJSON(needs.gate.outputs.test-sdist-linux) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test-sdist-linux.yml
    with:
      host-platform: linux-64
      cuda-version: ${{ needs.gate.outputs.cuda-build-ver }}
      baseline-run-id: ${{ needs.gate.outputs.moon-base-run-id }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  test-sdist-windows:
    name: Test sdist win-64
    needs:
      - gate
    if: >-
      ${{ github.repository_owner == 'nvidia' &&
          !fromJSON(needs.gate.outputs.skip) &&
          !fromJSON(needs.gate.outputs.doc-only) &&
          fromJSON(needs.gate.outputs.test-sdist-windows) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test-sdist-windows.yml
    with:
      host-platform: win-64
      cuda-version: ${{ needs.gate.outputs.cuda-build-ver }}
      baseline-run-id: ${{ needs.gate.outputs.moon-base-run-id }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  test-linux-64:
    name: Test linux-64
    needs:
      - gate
      - build-portable
      - build-linux-64
    if: >-
      ${{ always() &&
          github.repository_owner == 'nvidia' &&
          needs.gate.result == 'success' &&
          (needs.build-portable.result == 'success' ||
           needs.build-portable.result == 'skipped') &&
          (needs.build-linux-64.result == 'success' ||
           needs.build-linux-64.result == 'skipped') &&
          !fromJSON(needs.gate.outputs.skip) &&
          !fromJSON(needs.gate.outputs.doc-only) &&
          fromJSON(needs.gate.outputs.test-linux) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test-wheel-linux.yml
    with:
      build-type: pull-request
      host-platform: linux-64
      build-ctk-ver: ${{ needs.gate.outputs.cuda-build-ver }}
      nruns: ${{ (github.event_name == 'schedule' && 5) || 1 }}
      test-pathfinder: ${{ fromJSON(needs.gate.outputs.test-pathfinder) }}
      test-bindings: ${{ fromJSON(needs.gate.outputs.test-bindings) }}
      test-core: ${{ fromJSON(needs.gate.outputs.test-core) }}
      test-python: ${{ fromJSON(needs.gate.outputs.test-metapackage) }}
      run-id: ${{ needs.build-linux-64.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      sha: ${{ needs.build-linux-64.result == 'success' && github.sha || needs.gate.outputs.moon-base-sha }}
      portable-run-id: ${{ needs.build-portable.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  test-linux-aarch64:
    name: Test linux-aarch64
    needs:
      - gate
      - build-portable
      - build-linux-aarch64
    if: >-
      ${{ always() &&
          github.repository_owner == 'nvidia' &&
          needs.gate.result == 'success' &&
          (needs.build-portable.result == 'success' ||
           needs.build-portable.result == 'skipped') &&
          (needs.build-linux-aarch64.result == 'success' ||
           needs.build-linux-aarch64.result == 'skipped') &&
          !fromJSON(needs.gate.outputs.skip) &&
          !fromJSON(needs.gate.outputs.doc-only) &&
          fromJSON(needs.gate.outputs.test-linux) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test-wheel-linux.yml
    with:
      build-type: pull-request
      host-platform: linux-aarch64
      build-ctk-ver: ${{ needs.gate.outputs.cuda-build-ver }}
      nruns: ${{ (github.event_name == 'schedule' && 5) || 1 }}
      test-pathfinder: ${{ fromJSON(needs.gate.outputs.test-pathfinder) }}
      test-bindings: ${{ fromJSON(needs.gate.outputs.test-bindings) }}
      test-core: ${{ fromJSON(needs.gate.outputs.test-core) }}
      test-python: ${{ fromJSON(needs.gate.outputs.test-metapackage) }}
      run-id: ${{ needs.build-linux-aarch64.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      sha: ${{ needs.build-linux-aarch64.result == 'success' && github.sha || needs.gate.outputs.moon-base-sha }}
      portable-run-id: ${{ needs.build-portable.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  test-windows:
    name: Test win-64
    needs:
      - gate
      - build-portable
      - build-windows
    if: >-
      ${{ always() &&
          github.repository_owner == 'nvidia' &&
          needs.gate.result == 'success' &&
          (needs.build-portable.result == 'success' ||
           needs.build-portable.result == 'skipped') &&
          (needs.build-windows.result == 'success' ||
           needs.build-windows.result == 'skipped') &&
          !fromJSON(needs.gate.outputs.skip) &&
          !fromJSON(needs.gate.outputs.doc-only) &&
          fromJSON(needs.gate.outputs.test-windows) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/test-wheel-windows.yml
    with:
      build-type: pull-request
      host-platform: win-64
      build-ctk-ver: ${{ needs.gate.outputs.cuda-build-ver }}
      nruns: ${{ (github.event_name == 'schedule' && 5) || 1 }}
      test-pathfinder: ${{ fromJSON(needs.gate.outputs.test-pathfinder) }}
      test-bindings: ${{ fromJSON(needs.gate.outputs.test-bindings) }}
      test-core: ${{ fromJSON(needs.gate.outputs.test-core) }}
      test-python: ${{ fromJSON(needs.gate.outputs.test-metapackage) }}
      run-id: ${{ needs.build-windows.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      sha: ${{ needs.build-windows.result == 'success' && github.sha || needs.gate.outputs.moon-base-sha }}
      portable-run-id: ${{ needs.build-portable.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  doc:
    name: Docs
    needs:
      - gate
      - build-portable
      - build-linux-64
    if: >-
      ${{ always() &&
          github.repository_owner == 'nvidia' &&
          needs.gate.result == 'success' &&
          (needs.build-portable.result == 'success' ||
           needs.build-portable.result == 'skipped') &&
          (needs.build-linux-64.result == 'success' ||
           needs.build-linux-64.result == 'skipped') &&
          !fromJSON(needs.gate.outputs.skip) &&
          fromJSON(needs.gate.outputs.docs) }}
    permissions:
      actions: read
      id-token: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/build-docs.yml
    with:
      is-release: ${{ github.ref_type == 'tag' }}
      run-id: ${{ needs.build-linux-64.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      sha: ${{ needs.build-linux-64.result == 'success' && github.sha || needs.gate.outputs.moon-base-sha }}
      portable-run-id: ${{ needs.build-portable.result == 'success' && github.run_id || needs.gate.outputs.moon-base-run-id }}
      moon-base: ${{ needs.gate.outputs.moon-base }}
      force-all: ${{ fromJSON(needs.gate.outputs.moon-force-all) }}

  precommit-windows:
    name: Pre-commit on Windows
    runs-on: windows-latest
    if: ${{ github.repository_owner == 'nvidia' && !fromJSON(needs.gate.outputs.skip) }}
    needs:
      - gate
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        shell: bash
        run: python -m pip install --upgrade pip pre-commit

      - name: Run pre-commit
        shell: bash
        run: SKIP=lychee pre-commit run --all-files

  checks:
    name: Check job status
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - gate
      - api-check-core-vs-release
      - api-check-core-vs-base
      - build-portable
      - build-linux-64
      - build-linux-aarch64
      - build-windows
      - test-sdist-linux
      - test-sdist-windows
      - test-linux-64
      - test-linux-aarch64
      - test-windows
      - doc
      - precommit-windows
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Verify selected jobs
        run: |
          status=success
          check_result() {
            local name=$1
            local expected=$2
            local result=$3
            echo "Checking ${name}: result='${result}' (expected '${expected}')"
            if [[ "${result}" != "${expected}" ]]; then
              echo "::error::${name} did not match its expected result"
              status=failed
            fi
          }
          expected_for() {
            if [[ "$1" == "true" ]]; then
              echo success
            else
              echo skipped
            fi
          }

          check_result gate success "${{ needs.gate.result }}"
          if [[ "${{ needs.gate.outputs.skip }}" == "true" ]]; then
            echo "[no-ci] - no downstream jobs were selected"
            [[ "${status}" == "success" ]]
            exit
          fi

          doc_only="${{ needs.gate.outputs.doc-only }}"
          force_all="${{ needs.gate.outputs.moon-force-all }}"

          portable=false
          linux_64=false
          linux_aarch64=false
          windows=false
          if [[ "${doc_only}" != "true" || "${force_all}" == "true" ]]; then
            portable="${{ needs.gate.outputs.build-portable }}"
            linux_64="${{ needs.gate.outputs.build-linux-64 }}"
          fi
          if [[ "${doc_only}" != "true" ]]; then
            linux_aarch64="${{ needs.gate.outputs.build-linux-aarch64 }}"
            windows="${{ needs.gate.outputs.build-windows }}"
          fi

          check_result build-portable "$(expected_for "${portable}")" "${{ needs.build-portable.result }}"
          check_result build-linux-64 "$(expected_for "${linux_64}")" "${{ needs.build-linux-64.result }}"
          check_result build-linux-aarch64 "$(expected_for "${linux_aarch64}")" "${{ needs.build-linux-aarch64.result }}"
          check_result build-windows "$(expected_for "${windows}")" "${{ needs.build-windows.result }}"

          sdist_linux=false
          sdist_windows=false
          test_linux=false
          test_windows=false
          if [[ "${doc_only}" != "true" ]]; then
            sdist_linux="${{ needs.gate.outputs.test-sdist-linux }}"
            sdist_windows="${{ needs.gate.outputs.test-sdist-windows }}"
            test_linux="${{ needs.gate.outputs.test-linux }}"
            test_windows="${{ needs.gate.outputs.test-windows }}"
          fi
          check_result test-sdist-linux "$(expected_for "${sdist_linux}")" "${{ needs.test-sdist-linux.result }}"
          check_result test-sdist-windows "$(expected_for "${sdist_windows}")" "${{ needs.test-sdist-windows.result }}"
          check_result test-linux-64 "$(expected_for "${test_linux}")" "${{ needs.test-linux-64.result }}"
          check_result test-linux-aarch64 "$(expected_for "${test_linux}")" "${{ needs.test-linux-aarch64.result }}"
          check_result test-windows "$(expected_for "${test_windows}")" "${{ needs.test-windows.result }}"

          core_api="${{ needs.gate.outputs.core-api }}"
          core_api_base=false
          if [[ "${GITHUB_REF_NAME}" == pull-request/* ]]; then
            core_api_base="${core_api}"
          fi
          check_result api-check-core-vs-release "$(expected_for "${core_api}")" "${{ needs.api-check-core-vs-release.result }}"
          check_result api-check-core-vs-base "$(expected_for "${core_api_base}")" "${{ needs.api-check-core-vs-base.result }}"
          check_result doc "$(expected_for "${{ needs.gate.outputs.docs }}")" "${{ needs.doc.result }}"
          check_result precommit-windows success "${{ needs.precommit-windows.result }}"

          [[ "${status}" == "success" ]]
