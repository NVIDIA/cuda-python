name: "CI: Windows wheels"

on:
  workflow_call:
    inputs:
      host-platform:
        description: Windows host platform (win-64 or win-arm64)
        required: true
        type: string

permissions:
  contents: read

env:
  GIT_VERSION: '2.55.0.3'
  PYTHON_VERSION: '3.13'

jobs:
  build-wheels:
    name: Build installed-test wheels
    if: ${{ github.repository_owner == 'nvidia-dev' }}
    runs-on: ${{ inputs.host-platform == 'win-arm64' && 'windows-arm64-1xgb10' || 'windows-amd64-cpu16-internal' }}
    timeout-minutes: ${{ inputs.host-platform == 'win-arm64' && 180 || 120 }}
    env:
      HOST_PLATFORM: ${{ inputs.host-platform }}
      EXPECTED_PROCESSOR_ARCHITECTURE: ${{ inputs.host-platform == 'win-arm64' && 'ARM64' || 'AMD64' }}
    steps:
      # Keep identical to the other "Set up Git for Windows ARM64" steps in .github/workflows.
      - name: Set up Git for Windows ARM64
        if: ${{ inputs.host-platform == 'win-arm64' }}
        timeout-minutes: 10
        shell: powershell
        run: |
          if (-not $env:RUNNER_TOOL_CACHE) {
            throw "RUNNER_TOOL_CACHE is not set."
          }

          $gitRoot = Join-Path $env:RUNNER_TOOL_CACHE "PortableGit\$env:GIT_VERSION\arm64"
          $git = Join-Path $gitRoot "cmd\git.exe"
          # `shell: bash` steps (e.g. setup-hardened-python) need Git's bash on PATH;
          # otherwise bash resolves to the WSL launcher in System32.
          $bash = Join-Path $gitRoot "bin\bash.exe"
          $complete = "$gitRoot.complete"
          if (-not ((Test-Path $git) -and (Test-Path $bash) -and (Test-Path $complete))) {
            $archive = Join-Path $env:RUNNER_TEMP "PortableGit-$env:GIT_VERSION-arm64.7z.exe"
            $archiveUrl = "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.3/PortableGit-2.55.0.3-arm64.7z.exe"
            $expectedHash = "3bf26b94d9399b16a890776e468334f501742861576cbcdea2d9134643c374bd"

            Invoke-WebRequest -UseBasicParsing -Uri $archiveUrl -OutFile $archive
            $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "PortableGit checksum mismatch: expected $expectedHash, got $actualHash."
            }

            if (Test-Path $gitRoot) {
              Remove-Item -Recurse -Force $gitRoot
            }
            New-Item -ItemType Directory -Force -Path $gitRoot | Out-Null
            # PortableGit is a 7-Zip self-extractor; -y suppresses its prompts.
            $process = Start-Process -FilePath $archive -ArgumentList @("-y", "-o`"$gitRoot`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "PortableGit extraction exited with code $($process.ExitCode)."
            }
            Remove-Item -Force $archive

            foreach ($required in @($git, $bash)) {
              if (-not (Test-Path $required)) {
                throw "Not found after extracting PortableGit: $required"
              }
            }
            New-Item -ItemType File -Force -Path $complete | Out-Null
          }

          & $git version --build-options
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $bash --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          # Only cmd\ and bin\: usr\bin would shadow MSVC's link.exe and Windows' find.exe.
          @((Split-Path $git), (Split-Path $bash)) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enable Git symlinks (Windows, must precede checkout)
        shell: powershell
        run: |
          git config --global core.symlinks true
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          # A reused runner workspace can override the global setting locally.
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".git")) {
            git -C "$env:GITHUB_WORKSPACE" config --local core.symlinks true
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Checkout cuda-python-private
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # setuptools-scm needs tags and complete commit ancestry.
          fetch-depth: 0
          # cuda.core builds against the pinned CCCL headers.
          submodules: true
          persist-credentials: false

      - name: Resolve CTK kitpick
        uses: ./.github/actions/resolve-ctk-next

      - name: Verify Windows runner architecture
        shell: cmd
        run: |
          if /I not "%PROCESSOR_ARCHITECTURE%"=="%EXPECTED_PROCESSOR_ARCHITECTURE%" (
            echo Expected %EXPECTED_PROCESSOR_ARCHITECTURE%, got %PROCESSOR_ARCHITECTURE%.
            exit /b 1
          )

      - name: Set up Windows toolchain
        id: toolchain
        uses: ./.github/actions/setup-ctk-next-windows
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ env.CUDA_VERSION }}
          cuda-kitpick-version: ${{ env.CUDA_KITPICK_VERSION }}
          cuda-kitpick: ${{ env.CUDA_KITPICK }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify build toolchain
        shell: cmd
        run: |
          where cl.exe || exit /b 1
          cl.exe 2>&1 | findstr /C:"Microsoft (R) C/C++" || exit /b 1
          nvcc --version || exit /b 1

      - name: Install wheel build tools
        shell: powershell
        run: python -m pip install --upgrade pip twine "cibuildwheel[uv]==4.3.4"

      - name: Build cuda.pathfinder wheel
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path wheelhouse | Out-Null
          python -m pip wheel --verbose --no-deps --wheel-dir wheelhouse ./cuda_pathfinder
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Constrain cuda.bindings to the local cuda.pathfinder wheel
        shell: powershell
        run: |
          $pathfinderWheels = @(Get-ChildItem wheelhouse\cuda_pathfinder-*.whl)
          if ($pathfinderWheels.Count -ne 1) {
            throw "Expected exactly one cuda.pathfinder wheel, found $($pathfinderWheels.Count)."
          }
          New-Item -ItemType Directory -Force -Path wheel-constraints | Out-Null
          $pathfinderUri = [System.Uri]::new($pathfinderWheels[0].FullName).AbsoluteUri
          $encoding = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "wheel-constraints\cuda-bindings.txt"),
            "cuda-pathfinder @ $pathfinderUri`n",
            $encoding
          )

      - name: Build cuda.bindings wheel
        shell: powershell
        run: |
          python -m cibuildwheel --output-dir wheelhouse ./cuda_bindings_13
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          CIBW_BUILD: cp313-*
          CIBW_ARCHS_WINDOWS: ${{ inputs.host-platform == 'win-arm64' && 'ARM64' || 'AMD64' }}
          # build[uv]: uv, not the build interpreter's ssl module, does all downloads.
          # Build venvs have no pip; cibuildwheel installs delvewheel itself.
          CIBW_BUILD_FRONTEND: "build[uv]"
          UV_BUILD_CONSTRAINT: ${{ github.workspace }}\wheel-constraints\cuda-bindings.txt
          UV_CONSTRAINT: ${{ github.workspace }}\wheel-constraints\cuda-bindings.txt

      - name: Constrain cuda.core to the local dependency wheels
        shell: powershell
        run: |
          $pathfinderWheels = @(Get-ChildItem wheelhouse\cuda_pathfinder-*.whl)
          $bindingsWheels = @(Get-ChildItem wheelhouse\cuda_bindings-*.whl)
          if ($pathfinderWheels.Count -ne 1) {
            throw "Expected exactly one cuda.pathfinder wheel, found $($pathfinderWheels.Count)."
          }
          if ($bindingsWheels.Count -ne 1) {
            throw "Expected exactly one cuda.bindings wheel, found $($bindingsWheels.Count)."
          }
          $pathfinderUri = [System.Uri]::new($pathfinderWheels[0].FullName).AbsoluteUri
          $bindingsUri = [System.Uri]::new($bindingsWheels[0].FullName).AbsoluteUri
          $constraints = @(
            "cuda-pathfinder @ $pathfinderUri"
            "cuda-bindings @ $bindingsUri"
          ) -join "`n"
          $encoding = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "wheel-constraints\cuda-core.txt"),
            "$constraints`n",
            $encoding
          )

      - name: Build cuda.core wheel
        shell: powershell
        run: |
          python -m cibuildwheel --output-dir wheelhouse ./cuda_core
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          CIBW_BUILD: cp313-*
          CIBW_ARCHS_WINDOWS: ${{ inputs.host-platform == 'win-arm64' && 'ARM64' || 'AMD64' }}
          # build[uv]: uv, not the build interpreter's ssl module, does all downloads.
          # Build venvs have no pip; cibuildwheel installs delvewheel itself.
          CIBW_BUILD_FRONTEND: "build[uv]"
          CUDA_CORE_BUILD_MAJOR: ${{ env.CUDA_MAJOR }}
          UV_BUILD_CONSTRAINT: ${{ github.workspace }}\wheel-constraints\cuda-core.txt
          UV_CONSTRAINT: ${{ github.workspace }}\wheel-constraints\cuda-core.txt

      - name: Check wheel artifacts
        shell: powershell
        run: |
          $wheels = @(Get-ChildItem wheelhouse\*.whl)
          $wheels | Format-Table Name, Length
          if ($wheels.Count -ne 3) {
            throw "Expected exactly three wheel artifacts, found $($wheels.Count)."
          }
          $wheelPaths = @($wheels | ForEach-Object { $_.FullName })
          python -m twine check --strict @wheelPaths
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ctk-next-${{ inputs.host-platform }}-wheels-${{ github.sha }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  test-wheels:
    name: Test installed wheels (${{ matrix.runner }})
    needs: build-wheels
    if: ${{ github.repository_owner == 'nvidia-dev' }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.host-platform == 'win-arm64' && '["windows-arm64-1xgb10", "windows-arm64-gpu-gb300-latest-1-internal"]' || '["windows-amd64-gpu-l4-latest-1-internal"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.host-platform == 'win-arm64' && 180 || 120 }}
    env:
      HOST_PLATFORM: ${{ inputs.host-platform }}
      EXPECTED_PROCESSOR_ARCHITECTURE: ${{ inputs.host-platform == 'win-arm64' && 'ARM64' || 'AMD64' }}
    steps:
      # Keep identical to the other "Set up Git for Windows ARM64" steps in .github/workflows.
      - name: Set up Git for Windows ARM64
        if: ${{ inputs.host-platform == 'win-arm64' }}
        timeout-minutes: 10
        shell: powershell
        run: |
          if (-not $env:RUNNER_TOOL_CACHE) {
            throw "RUNNER_TOOL_CACHE is not set."
          }

          $gitRoot = Join-Path $env:RUNNER_TOOL_CACHE "PortableGit\$env:GIT_VERSION\arm64"
          $git = Join-Path $gitRoot "cmd\git.exe"
          # `shell: bash` steps (e.g. setup-hardened-python) need Git's bash on PATH;
          # otherwise bash resolves to the WSL launcher in System32.
          $bash = Join-Path $gitRoot "bin\bash.exe"
          $complete = "$gitRoot.complete"
          if (-not ((Test-Path $git) -and (Test-Path $bash) -and (Test-Path $complete))) {
            $archive = Join-Path $env:RUNNER_TEMP "PortableGit-$env:GIT_VERSION-arm64.7z.exe"
            $archiveUrl = "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.3/PortableGit-2.55.0.3-arm64.7z.exe"
            $expectedHash = "3bf26b94d9399b16a890776e468334f501742861576cbcdea2d9134643c374bd"

            Invoke-WebRequest -UseBasicParsing -Uri $archiveUrl -OutFile $archive
            $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "PortableGit checksum mismatch: expected $expectedHash, got $actualHash."
            }

            if (Test-Path $gitRoot) {
              Remove-Item -Recurse -Force $gitRoot
            }
            New-Item -ItemType Directory -Force -Path $gitRoot | Out-Null
            # PortableGit is a 7-Zip self-extractor; -y suppresses its prompts.
            $process = Start-Process -FilePath $archive -ArgumentList @("-y", "-o`"$gitRoot`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "PortableGit extraction exited with code $($process.ExitCode)."
            }
            Remove-Item -Force $archive

            foreach ($required in @($git, $bash)) {
              if (-not (Test-Path $required)) {
                throw "Not found after extracting PortableGit: $required"
              }
            }
            New-Item -ItemType File -Force -Path $complete | Out-Null
          }

          & $git version --build-options
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $bash --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          # Only cmd\ and bin\: usr\bin would shadow MSVC's link.exe and Windows' find.exe.
          @((Split-Path $git), (Split-Path $bash)) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enable Git symlinks (Windows, must precede checkout)
        shell: powershell
        run: |
          git config --global core.symlinks true
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          # A reused runner workspace can override the global setting locally.
          if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".git")) {
            git -C "$env:GITHUB_WORKSPACE" config --local core.symlinks true
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Checkout cuda-python-private
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          # cuda.core builds against the pinned CCCL headers.
          submodules: true
          persist-credentials: false

      - name: Set up GB300 MCDM driver and runtime
        if: ${{ matrix.runner == 'windows-arm64-gpu-gb300-latest-1-internal' }}
        timeout-minutes: 15
        uses: ./.github/actions/setup-woa-gb300

      - name: Resolve CTK kitpick
        uses: ./.github/actions/resolve-ctk-next

      - name: Verify Windows runner architecture
        shell: cmd
        run: |
          if /I not "%PROCESSOR_ARCHITECTURE%"=="%EXPECTED_PROCESSOR_ARCHITECTURE%" (
            echo Expected %EXPECTED_PROCESSOR_ARCHITECTURE%, got %PROCESSOR_ARCHITECTURE%.
            exit /b 1
          )
          nvidia-smi || exit /b 1

      - name: Set up Windows toolchain
        id: toolchain
        uses: ./.github/actions/setup-ctk-next-windows
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ env.CUDA_VERSION }}
          cuda-kitpick-version: ${{ env.CUDA_KITPICK_VERSION }}
          cuda-kitpick: ${{ env.CUDA_KITPICK }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ctk-next-${{ inputs.host-platform }}-wheels-${{ github.sha }}
          path: wheelhouse

      - name: Test installed wheels
        env:
          WHEEL_TEST_PYTHON: ${{ steps.toolchain.outputs.python-path }}
        shell: powershell
        run: |
          & ./ci/tools/test_windows_wheels.ps1 -PythonExecutable $env:WHEEL_TEST_PYTHON -PythonVersion $env:PYTHON_VERSION -CudaVersion $env:CUDA_VERSION
