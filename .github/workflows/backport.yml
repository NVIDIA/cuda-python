name: "CI: Backport a merged PR to a release branch"

on:
  workflow_dispatch:
    inputs:
      backport-branch:
        description: "Existing release branch to receive the fix"
        required: true
        type: string
      pull-request:
        description: "Merged PR to backport"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: backport-${{ inputs.pull-request }}-${{ inputs.backport-branch }}
  cancel-in-progress: false

jobs:
  backport:
    if: github.repository == 'NVIDIA/cuda-python'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate source PR and target branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BACKPORT_BRANCH: ${{ inputs.backport-branch }}
          PR_NUMBER: ${{ inputs.pull-request }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The source PR must be a positive integer."
            exit 1
          fi
          if ! git check-ref-format "refs/heads/$BACKPORT_BRANCH"; then
            echo "::error::Provide one exact target branch name."
            exit 1
          fi
          if [[ "$BACKPORT_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "::error::Choose a release branch, not the default branch."
            exit 1
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/$BACKPORT_BRANCH"; then
            echo "::error::The target branch must already exist in this repository."
            exit 1
          fi
          if [[ "$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state --jq .state)" != MERGED ]]; then
            echo "::error::The source PR must already be merged in this repository."
            exit 1
          fi

      # Workflow-file changes need a manual backport because GITHUB_TOKEN
      # cannot push them. Generated changes need target-specific regeneration.
      - name: Create backport pull request
        id: backport
        uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7  # v4.7.0
        with:
          source_pr_number: ${{ inputs.pull-request }}
          target_branches: ${{ inputs.backport-branch }}
          # The explicit target must not be combined with source PR labels.
          label_pattern: ''
          copy_assignees: true
          copy_labels_pattern: '^(?!to-be-backported$|backport ).*'
          copy_requested_reviewers: true

      - name: Require successful backport
        if: steps.backport.outputs.was_successful != 'true'
        run: |
          echo "::error::Backport failed; resolve the conflict or prepare the target-specific fix manually."
          exit 1
