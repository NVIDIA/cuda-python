# Disposable validation-only controller; never merge into the product branch.
name: PR2737 CUDA12 release artifact validation
'on':
  push:
    branches:
    - rwgk/pr2737-cuda12-release-rehearsal-b00b677
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: pr2737-release-rehearsal-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}
jobs:
  validate-existing-release-artifacts:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BINDINGS_PACKAGE: '{"package_root":"cuda_bindings_12","toolkit_version":"12.9.1","release_version":"12.9.99","release_registry_origin":"tag"}'
    steps:
    - name: Checkout exact final source without push credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: b00b677be366fd3638c78e26b99aa5b238602646
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install source-pinned CI tools
      run: python -m pip install -e ./ci
    - name: Verify artifact provenance and all successful prerequisite jobs
      run: |
        test "$GITHUB_REPOSITORY" = NVIDIA/cuda-python
        test "$GITHUB_REF_TYPE" = branch
        test "$GITHUB_REF_NAME" = rwgk/pr2737-cuda12-release-rehearsal-b00b677
        case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1;; esac
        test "$(git rev-parse HEAD)" = b00b677be366fd3638c78e26b99aa5b238602646
        set +e
        git ls-remote --exit-code --tags origin refs/tags/v12.9.99 >/dev/null
        status=$?
        set -e
        if [[ "$status" -ne 2 ]]; then
          echo 'error: could not prove synthetic remote tag absent' >&2
          exit 1
        fi
        mkdir -p release
        gh run view 36579081279 --repo "$GITHUB_REPOSITORY" --json databaseId,event,headBranch,headSha,url,workflowName,status,conclusion > release/artifact-run.json
        gh api --paginate --slurp 'repos/NVIDIA/cuda-python/actions/runs/36579081279/jobs?per_page=100' |
          jq '[.[] | .jobs[] | {id,name,status,conclusion,html_url,started_at,completed_at}]' > release/prerequisite-jobs.json
        python - <<'PY'
        import json
        from pathlib import Path
        from ci.tools.bindings_config import resolve_release_bindings_package

        run = json.loads(Path('release/artifact-run.json').read_text())
        assert run['databaseId'] == 36579081279, run
        assert run['headSha'] == '77cfb553ed6076c5d6d23f0e6d97f2b63f953c7f', run
        assert run['headBranch'] == 'rwgk/pr2737-cuda12-release-rehearsal-b00b677', run
        assert run['event'] == 'push', run
        assert run['status'] == 'completed' and run['conclusion'] == 'failure', run
        jobs = json.loads(Path('release/prerequisite-jobs.json').read_text())
        assert len(jobs) == 49, len(jobs)
        assert all(job['status'] == 'completed' for job in jobs), jobs
        failed = [job for job in jobs if job['conclusion'] != 'success']
        assert len(failed) == 1, failed
        assert failed[0]['id'] == 109453357904 and failed[0]['name'] == 'validate-artifacts' and failed[0]['conclusion'] == 'failure', failed
        prerequisite_names = {job['name'] for job in jobs if job['conclusion'] == 'success'}
        assert len(prerequisite_names) == 48, prerequisite_names
        assert len([name for name in prerequisite_names if name.startswith('build (')]) == 24
        assert len([name for name in prerequisite_names if name.startswith('sdist-')]) == 2
        assert len([name for name in prerequisite_names if ' / Python ' in name]) == 17
        assert 'resolve' in prerequisite_names and 'docs / Build docs' in prerequisite_names
        assert len([name for name in prerequisite_names if name.endswith(' / compute-matrix')]) == 3
        package = resolve_release_bindings_package('v12.9.99', Path.cwd(), Path('ci/versions.yml'))
        assert package == {'package_root': 'cuda_bindings_12', 'toolkit_version': '12.9.1', 'release_version': '12.9.99', 'release_registry_origin': 'tag'}, package
        print('Verified all 48 original prerequisites passed; sole original failure is the known validation assertion.')
        PY
    - name: Archive exact source and validate release payload
      run: |
        test "$(git rev-parse HEAD)" = b00b677be366fd3638c78e26b99aa5b238602646
        if git show-ref --verify --quiet refs/tags/v12.9.99; then exit 1; fi
        git -c tag.gpgSign=false tag v12.9.99 b00b677be366fd3638c78e26b99aa5b238602646
        mkdir -p release
        git archive --format=tar.gz --prefix=cuda-python-v12.9.99/ --output=release/cuda-python-v12.9.99.tar.gz refs/tags/v12.9.99
        sha256sum release/cuda-python-v12.9.99.tar.gz > release/cuda-python-v12.9.99.tar.gz.sha256sum
        ./ci/tools/download-wheels 36579081279 cuda-bindings "$GITHUB_REPOSITORY" release/wheels v12.9.99 "$BINDINGS_PACKAGE"
        python -m ci.tools.validate_release_wheels v12.9.99 cuda-bindings release/wheels --bindings-package "$BINDINGS_PACKAGE" --release-source-root .
        ./ci/tools/download-wheels 36579081279 cuda-python "$GITHUB_REPOSITORY" release/metapackage v12.9.99 "$BINDINGS_PACKAGE"
        python -m ci.tools.validate_release_wheels v12.9.99 cuda-python release/metapackage --bindings-package "$BINDINGS_PACKAGE" --release-source-root .
        gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,event,headBranch,headSha,url,workflowName > release/validation-run.json
        python - <<'PY'
        import email
        import hashlib
        import json
        import os
        import tarfile
        import zipfile
        from pathlib import Path
        from packaging.requirements import Requirement
        from packaging.utils import canonicalize_name
        from packaging.version import Version

        source_sha = "b00b677be366fd3638c78e26b99aa5b238602646"
        tag = "v12.9.99"
        artifact_run = json.loads(Path("release/artifact-run.json").read_text())
        validation_run = json.loads(Path("release/validation-run.json").read_text())
        assert validation_run["headSha"] == os.environ["GITHUB_SHA"], validation_run
        assert validation_run["headBranch"] == "rwgk/pr2737-cuda12-release-rehearsal-b00b677", validation_run
        assert validation_run["event"] in ("push", "workflow_dispatch"), validation_run
        wheels = sorted(Path("release/wheels").glob("*.whl"))
        metas = sorted(Path("release/metapackage").glob("*.whl"))
        assert len(wheels) == 18, len(wheels)
        assert len(metas) == 1, metas
        inventory = []
        for path in [*wheels, *metas]:
            with zipfile.ZipFile(path) as archive:
                members = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
                assert len(members) == 1, members
                metadata = email.message_from_bytes(archive.read(members[0]))
            assert metadata["Version"] == "12.9.99", (path, metadata["Version"])
            expected_name = "cuda-python" if path in metas else "cuda-bindings"
            assert canonicalize_name(metadata["Name"]) == expected_name, (path, metadata["Name"])
            if path in metas:
                reqs = [Requirement(value) for value in metadata.get_all("Requires-Dist", [])]
                version = metadata["Version"]
                matcher = "~=" if Version(version).base_version == version else "=="
                expected_specifier = matcher + version
                actual = [(canonicalize_name(req.name), str(req.specifier), sorted(req.extras),
                           str(req.marker) if req.marker is not None else None) for req in reqs]
                expected = [("cuda-bindings", expected_specifier, [], None),
                            ("cuda-bindings", expected_specifier, ["all"], 'extra == "all"')]
                assert actual == expected, actual
                metapackage_requirements = [str(req) for req in reqs]
            inventory.append({"file": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
        with tarfile.open(f"release/cuda-python-{tag}.tar.gz") as archive:
            metadata = archive.extractfile(f"cuda-python-{tag}/.git_archival.txt").read().decode()
        fields = dict(line.split(": ", 1) for line in metadata.splitlines() if ": " in line)
        assert fields["node"] == source_sha, fields
        assert f"tag: {tag}" in fields["ref-names"].split(", "), fields
        manifest = {"source_sha": source_sha, "artifact_run": artifact_run, "validation_controller_sha": os.environ["GITHUB_SHA"], "validation_run": validation_run,
                    "prerequisite_jobs": json.loads(Path("release/prerequisite-jobs.json").read_text()),
                    "known_original_harness_failure": {"job_id": 109453357904, "reason": "Incorrect exact dependency-pin assertion; stable metapackages use compatible-version requirements"},
                    "metapackage_requirements": metapackage_requirements,
                    "local_only_tag": tag, "bindings_package": json.loads(os.environ["BINDINGS_PACKAGE"]),
                    "wheel_inventory": inventory, "archive_metadata": fields,
                    "release_notes": {"synthetic_12_9_99": "expected missing-note rejection", "real_12_9_9": "passed"},
                    "limitations": ["No remote tag or actual tag-event discovery", "No publication or Pages deployment", "Synthetic version is not a release approval"]}
        Path("release/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
        with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
            stream.write("Exact source: `" + source_sha + "`. Artifact run: `36579081279` at `77cfb553ed6076c5d6d23f0e6d97f2b63f953c7f`. Validation controller: `" + os.environ["GITHUB_SHA"] + "`.\n\n")
            stream.write("Validated 18 CUDA 12 wheels, one metapackage wheel, and exact tagged-source archive. Synthetic release note was deliberately rejected; existing 12.9.9 notes passed. No remote tag, release publication, or docs deployment.\n")
        PY
    - name: Upload publication-incapable release evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: pr2737-cuda12-release-evidence
        path: release/
        retention-days: 30
