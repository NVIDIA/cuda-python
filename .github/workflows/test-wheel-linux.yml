name: "CI: Test wheels"

on:
  workflow_call:
    inputs:
      build-type:
        type: string
        required: true
      host-platform:
        type: string
        required: true
      bindings-config:
        description: Normalized CUDA bindings release-line registry JSON.
        type: string
        required: true
      matrix_filter:
        type: string
        default: "."
      nruns:
        type: number
        default: 1
      workplan:
        description: JSON workplan. An empty value tests everything.
        type: string
        default: ""
      run-id:
        description: >
          Workflow run ID to download artifacts from.
          Defaults to the current run when empty.
        type: string
        default: ''
      test-mode:
        description: >
          Test mode: 'standard' (default), 'nightly-pytorch',
          'nightly-numba-cuda', 'nightly-numba-cuda-mlir', or
          'nightly-cuda-core'.
        type: string
        default: 'standard'
      sha:
        description: >
          Commit SHA used to construct artifact names.
          Defaults to github.sha (current run) when empty.
        type: string
        default: ''

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

jobs:
  compute-matrix:
    if: >-
      ${{ inputs.workplan == '' ||
          contains(fromJSON(inputs.workplan).jobs.test_cuda_majors.*, true) }}
    runs-on: ubuntu-latest
    env:
      BINDINGS_CONFIG: ${{ inputs.bindings-config }}
      BUILD_TYPE: ${{ inputs.build-type }}
      WORKPLAN: ${{ inputs.workplan }}
      ARCH: ${{ (inputs.host-platform == 'linux-64' && 'amd64') ||
                (inputs.host-platform == 'linux-aarch64' && 'arm64') }}
    outputs:
      MATRIX: ${{ steps.compute-matrix.outputs.MATRIX }}
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Validate Test Type
        run: |
          if [[ "$BUILD_TYPE" != "pull-request" ]] && [[ "$BUILD_TYPE" != "nightly" ]] && [[ "$BUILD_TYPE" != "branch" ]]; then
              echo "Invalid build type! Must be one of 'nightly', 'pull-request', or 'branch'."
              exit 1
          fi

      - name: Compute Python Test Matrix
        id: compute-matrix
        run: |
          # Use the nightly matrix for branch tests
          MATRIX_TYPE="${BUILD_TYPE}"
          if [[ "${MATRIX_TYPE}" == "branch" ]]; then
            MATRIX_TYPE="nightly"
          fi

          # Read base matrix from YAML file for the specific architecture
          TEST_MATRIX=$(yq -o json ".linux[\"${MATRIX_TYPE}\"] | map(select(.ARCH == \"${ARCH}\"))" ci/test-matrix.yml)

          BINDINGS_LINES=$(jq -ce '
            .lines
            | if length > 0 then . else error("bindings registry has no lines") end
          ' <<< "$BINDINGS_CONFIG")
          CURRENT_BINDINGS_SOURCE_DIR=$(jq -er '
            [.[] | select(.roles | index("current"))]
            | if length == 1 then .[0].source_dir else error("bindings registry must have one current line") end
          ' <<< "$BINDINGS_LINES")

          if [[ -z "$WORKPLAN" ]]; then
            TEST_CUDA_MAJORS=$(jq -c '
              [.[].cuda_variant] | unique | map({key: ., value: true}) | from_entries
            ' <<< "$BINDINGS_LINES")
          else
            TEST_CUDA_MAJORS=$(jq -ce '
              .jobs.test_cuda_majors
              | if type == "object" then . else error("workplan test_cuda_majors must be an object") end
            ' <<< "$WORKPLAN")
          fi

          python3 ci/tools/check_test_matrix_bindings.py \
            --bindings-config "$BINDINGS_CONFIG" \
            --enabled-cuda-variants "$TEST_CUDA_MAJORS" \
            --test-matrix "$TEST_MATRIX"

          # Apply matrix filter; reject custom DRIVER + FLAVOR=wsl (the
          # in-container driver swap doesn't work under WSL); add a
          # RUNNER_DRIVER field that maps any custom version back to
          # 'latest' (the install script swaps the driver itself, so we
          # need to land on the runner that ships with the most recent
          # pre-installed driver); wrap in include structure.
          MATRIX=$(echo "$TEST_MATRIX" | jq -c \
            --argjson test_cuda_majors "$TEST_CUDA_MAJORS" \
            --argjson bindings_lines "$BINDINGS_LINES" \
            --arg default_bindings_source_dir "$CURRENT_BINDINGS_SOURCE_DIR" \
            '${{ inputs.matrix_filter }}
             | map(
                 . as $row
                 | ("cu" + ($row.CUDA_VER | split(".")[0])) as $cuda_variant
                 | ($bindings_lines | map(select(.toolkit_version == $row.CUDA_VER))) as $matching_lines
                 | if ($matching_lines | length) > 1 then
                     error("multiple bindings lines match CUDA \($row.CUDA_VER)")
                   else
                     ($matching_lines[0] // null) as $bindings_line
                     | $row + {
                         CUDA_VARIANT: $cuda_variant,
                         BINDINGS_SOURCE: (if $bindings_line == null then "published" else "local" end),
                         BINDINGS_LINE_ID: ($bindings_line.line_id // ""),
                         BINDINGS_SOURCE_DIR: ($bindings_line.source_dir // ""),
                         DEFAULT_BINDINGS_SOURCE_DIR: $default_bindings_source_dir
                       }
                   end
               )
             | map(select($test_cuda_majors[.CUDA_VARIANT] == true))
             | if any(.[]; .DRIVER != "latest" and .DRIVER != "earliest" and .FLAVOR == "wsl") then "Error: custom DRIVER is not supported with FLAVOR=wsl\n" | halt_error(1) else . end
             | map(. + {RUNNER_DRIVER: (if .DRIVER == "latest" or .DRIVER == "earliest" then .DRIVER else "latest" end)})
             | if (. | length) > 0 then {include: .} else "Error: Empty matrix after CUDA-major workplan filtering\n" | halt_error(1) end')

          echo "MATRIX=${MATRIX}" | tee --append "${GITHUB_OUTPUT}"

  test:
    env:
      TEST_PATHFINDER: ${{ inputs.workplan == '' || fromJSON(inputs.workplan).modules.pathfinder.needs_test }}
      TEST_BINDINGS: ${{ inputs.workplan == '' || fromJSON(inputs.workplan).modules.bindings.needs_test }}
      TEST_CORE: ${{ inputs.workplan == '' || fromJSON(inputs.workplan).modules.core.needs_test }}
      TEST_PYTHON: ${{ inputs.workplan == '' || fromJSON(inputs.workplan).modules.python.needs_test }}
    name: Python ${{ matrix.PY_VER }}, CUDA ${{ matrix.CUDA_VER }} (${{ (matrix.LOCAL_CTK == '1' && 'local') || 'wheels' }}), GPU ${{ matrix.GPU }}${{ matrix.GPU_COUNT != '1' && format(' (x{0})', matrix.GPU_COUNT) || '' }}${{ matrix.FLAVOR && format(', {0}', matrix.FLAVOR) || '' }}${{ matrix.ENV.TORCH_VER && format(', {0}+{1}', matrix.ENV.TORCH_VER, matrix.ENV.TORCH_CUDA) || '' }}${{ matrix.ENV.MODE == 'nightly-numba-cuda' && ', latest' || '' }}
    timeout-minutes: 60
    needs: compute-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.MATRIX) }}
    runs-on: "${{ matrix.FLAVOR || 'linux' }}-${{ matrix.ARCH }}-gpu-${{ matrix.GPU }}-${{ matrix.RUNNER_DRIVER }}-${{ matrix.GPU_COUNT }}"
    # TODO: remove continue-on-error once 3.15 is officially supported
    continue-on-error: ${{ startsWith(matrix.PY_VER, '3.15') }}
    # The build stage could fail but we want the CI to keep moving.
    if: ${{ github.repository_owner == 'nvidia' && !cancelled() &&
            (inputs.workplan == '' || contains(fromJSON(inputs.workplan).jobs.test_cuda_majors.*, true)) }}
    # Our self-hosted runners require a container
    # TODO: use a different (nvidia?) container
    container:
      # Custom-DRIVER rows need --privileged --pid=host so install_gpu_driver.sh
      # can nsenter to the host for the install + refresh the toolkit bind mounts
      # back inside the container. Stock options for latest/earliest rows.
      options: ${{ ((matrix.DRIVER == 'latest' || matrix.DRIVER == 'earliest') && '-u root --security-opt seccomp=unconfined --shm-size 16g') || '-u root --security-opt seccomp=unconfined --shm-size 16g --privileged --pid=host' }}
      image: ubuntu:24.04
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
        PIP_CACHE_DIR: "/tmp/pip-cache"
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@main
        continue-on-error: true

      - name: Install dependencies
        uses: ./.github/actions/install_unix_deps
        continue-on-error: false
        with:
          # for artifact fetching, graphics libs, g++ required for cffi in
          # example; util-linux for `nsenter` (custom-DRIVER rows re-exec
          # install_gpu_driver.sh onto the host through nsenter)
          dependencies: "jq wget libgl1 libegl1 g++ util-linux"
          dependent_exes: "jq wget"

      - name: Install GPU driver
        if: ${{ matrix.DRIVER != 'latest' && matrix.DRIVER != 'earliest' }}
        env:
          DRIVER: ${{ matrix.DRIVER }}
          GPU_TYPE: ${{ matrix.GPU }}
        run: ./ci/tools/install_gpu_driver.sh

      - name: Ensure GPU is working
        run: nvidia-smi

      - name: Set environment variables
        env:
          BINDINGS_SOURCE: ${{ matrix.BINDINGS_SOURCE }}
          BINDINGS_LINE_ID: ${{ matrix.BINDINGS_LINE_ID }}
          BINDINGS_SOURCE_DIR: ${{ matrix.BINDINGS_SOURCE_DIR }}
          DEFAULT_BINDINGS_SOURCE_DIR: ${{ matrix.DEFAULT_BINDINGS_SOURCE_DIR }}
          CUDA_VER: ${{ matrix.CUDA_VER }}
          HOST_PLATFORM: ${{ inputs.host-platform }}
          LOCAL_CTK: ${{ matrix.LOCAL_CTK }}
          PY_VER: ${{ matrix.PY_VER }}
          SHA: ${{ inputs.sha || github.sha }}
          SKIP_BINDINGS_TEST_OVERRIDE: ${{ env.TEST_BINDINGS != 'true' && '1' || '0' }}
        run: ./ci/tools/env-vars test

      - name: Apply extra matrix environment variables
        if: ${{ matrix.ENV }}
        env:
          MATRIX_ENV: ${{ toJSON(matrix.ENV) }}
        run: echo "$MATRIX_ENV" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Download cuda-pathfinder build artifacts
        if: ${{ (env.TEST_PATHFINDER == 'true' || env.TEST_BINDINGS == 'true' || env.TEST_CORE == 'true' || env.TEST_PYTHON == 'true') &&
                (inputs.workplan == '' || fromJSON(inputs.workplan).modules.pathfinder.needs_build || fromJSON(inputs.workplan).baseline.run_id != '') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cuda-pathfinder-wheel
          path: ./cuda_pathfinder
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download cuda-python build artifacts
        if: ${{ env.TEST_PYTHON == 'true' && env.BINDINGS_SOURCE == 'local' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_PYTHON_ARTIFACT_NAME }}
          path: .
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download cuda.bindings build artifacts
        if: ${{ (env.TEST_BINDINGS == 'true' || env.TEST_CORE == 'true' || env.TEST_PYTHON == 'true') &&
                env.BINDINGS_SOURCE == 'local' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_BINDINGS_ARTIFACT_NAME }}
          path: ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display structure of downloaded cuda-python artifacts
        if: ${{ env.TEST_PYTHON == 'true' && env.BINDINGS_SOURCE != 'published' }}
        run: |
          pwd
          ls -lah cuda_python*.whl cuda_pathfinder/

      - name: Display structure of downloaded cuda.bindings artifacts
        if: ${{ (env.TEST_BINDINGS == 'true' || env.TEST_CORE == 'true' || env.TEST_PYTHON == 'true') &&
                env.BINDINGS_SOURCE != 'published' }}
        run: |
          pwd
          ls -lahR $CUDA_BINDINGS_ARTIFACTS_DIR

      - name: Download cuda.bindings Cython tests
        if: ${{ env.TEST_BINDINGS == 'true' && env.SKIP_CYTHON_TEST == '0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_BINDINGS_ARTIFACT_NAME }}-tests
          path: ${{ env.CUDA_BINDINGS_CYTHON_TESTS_DIR }}
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display structure of downloaded cuda.bindings Cython tests
        if: ${{ env.TEST_BINDINGS == 'true' && env.SKIP_CYTHON_TEST == '0' }}
        run: |
          pwd
          ls -lahR $CUDA_BINDINGS_CYTHON_TESTS_DIR

      - name: Download cuda.core build artifacts
        if: ${{ env.TEST_CORE == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_NAME }}
          path: ${{ env.CUDA_CORE_ARTIFACTS_DIR }}
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display structure of downloaded cuda.core build artifacts
        if: ${{ env.TEST_CORE == 'true' }}
        run: |
          pwd
          ls -lahR $CUDA_CORE_ARTIFACTS_DIR

      - name: Download cuda.core Cython tests
        if: ${{ env.TEST_CORE == 'true' && env.SKIP_CYTHON_TEST == '0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_CORE_CYTHON_TEST_ARTIFACT_NAME }}
          path: ${{ env.CUDA_CORE_CYTHON_TESTS_DIR }}
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display structure of downloaded cuda.core Cython tests
        if: ${{ env.TEST_CORE == 'true' && env.SKIP_CYTHON_TEST == '0' }}
        run: |
          pwd
          ls -lahR $CUDA_CORE_CYTHON_TESTS_DIR

      - name: Download cuda.core test binaries
        if: ${{ env.TEST_CORE == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_NAME }}-test-binaries
          path: ${{ env.CUDA_CORE_TEST_BINARIES_DIR }}
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display structure of downloaded cuda.core test binaries
        if: ${{ env.TEST_CORE == 'true' }}
        run: |
          pwd
          ls -lahR $CUDA_CORE_TEST_BINARIES_DIR

      - name: Set up Python ${{ matrix.PY_VER }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.PY_VER }}
          # TODO: remove allow-prereleases once 3.15 is officially supported
          allow-prereleases: ${{ startsWith(matrix.PY_VER, '3.15') }}
        env:
          # we use self-hosted runners on which setup-python behaves weirdly (Python include can't be found)...
          AGENT_TOOLSDIRECTORY: "/opt/hostedtoolcache"

      - name: Enable Scientific Python Nightly Wheels for Python 3.15
        if: ${{ (env.TEST_BINDINGS == 'true' || env.TEST_CORE == 'true' || env.TEST_PYTHON == 'true') &&
                startsWith(matrix.PY_VER, '3.15') }}
        run: |
          echo "PIP_EXTRA_INDEX_URL=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" >> "$GITHUB_ENV"
          echo "PIP_ONLY_BINARY=numpy" >> "$GITHUB_ENV"

      - name: Set up mini CTK
        if: ${{ matrix.LOCAL_CTK == '1' }}
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ matrix.CUDA_VER }}

      - name: Set up latest cuda_sanitizer_api
        if: ${{ (env.TEST_BINDINGS == 'true' || env.TEST_CORE == 'true') && env.SETUP_SANITIZER == '1' }}
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ env.LATEST_CUDA_VERSION }}
          cuda-components: "cuda_sanitizer_api"

      - name: Set up compute-sanitizer
        if: ${{ env.TEST_BINDINGS == 'true' || env.TEST_CORE == 'true' }}
        run: setup-sanitizer

      - name: Set up test repetition on nightly runs
        run: echo "PYTEST_ADDOPTS=\"--count=${{ inputs.nruns }}\"" >> "$GITHUB_ENV"

      # ── Standard test steps (skipped for nightly modes) ──
      - name: Run cuda.pathfinder tests with see_what_works
        if: ${{ inputs.test-mode == 'standard' && env.TEST_PATHFINDER == 'true' }}
        env:
          CUDA_PATHFINDER_TEST_LOAD_NVIDIA_DYNAMIC_LIB_STRICTNESS: see_what_works
          CUDA_PATHFINDER_TEST_FIND_NVIDIA_HEADERS_STRICTNESS: see_what_works
          CUDA_PATHFINDER_TEST_FIND_NVIDIA_BITCODE_LIB_STRICTNESS: see_what_works
        run: run-tests pathfinder

      - name: Run cuda.bindings tests
        if: ${{ inputs.test-mode == 'standard' && env.TEST_BINDINGS == 'true' && env.SKIP_CUDA_BINDINGS_TEST == '0' }}
        env:
          CUDA_VER: ${{ matrix.CUDA_VER }}
          LOCAL_CTK: ${{ matrix.LOCAL_CTK }}
        run: run-tests bindings

      - name: Run cuda.bindings benchmarks (smoke test)
        if: ${{ inputs.test-mode == 'standard' && env.TEST_BINDINGS == 'true' && env.SKIP_CUDA_BINDINGS_TEST == '0' }}
        run: |
          pip install pyperf
          pushd benchmarks/cuda_bindings
          python run_pyperf.py --debug-single-value
          popd

      - name: Run cuda.core tests
        if: ${{ inputs.test-mode == 'standard' && env.TEST_CORE == 'true' }}
        env:
          CUDA_VER: ${{ matrix.CUDA_VER }}
          LOCAL_CTK: ${{ matrix.LOCAL_CTK }}
        run: run-tests core

      - name: Ensure cuda-python installable
        if: ${{ inputs.test-mode == 'standard' && env.TEST_PYTHON == 'true' && env.BINDINGS_SOURCE == 'local' }}
        run: |
          # Package suites install their own dependencies. A metapackage-only
          # run has no preceding suite, so install the exact local internal
          # wheels in one transaction while resolving released dependencies
          # such as cuda-core from the package index.
          if ${{ env.TEST_BINDINGS == 'true' || env.TEST_CORE == 'true' }}; then
            dependency_args=(--no-deps)
          else
            dependency_args=(
              ./cuda_pathfinder/cuda_pathfinder-*.whl
              "${CUDA_BINDINGS_ARTIFACTS_DIR}"/cuda_bindings-*.whl
            )
          fi
          python_requirements=(cuda_python*.whl)
          if [[ "${{ matrix.LOCAL_CTK }}" != 1 ]]; then
            python_requirements=("${python_requirements[@]/%/[all]}")
          fi
          pip install --only-binary=:all: "${dependency_args[@]}" "${python_requirements[@]}"

      - name: Install cuda.pathfinder extra wheels for testing
        if: ${{ inputs.test-mode == 'standard' && env.TEST_PATHFINDER == 'true' }}
        run: |
          set -euo pipefail
          pushd cuda_pathfinder
          pip install --only-binary=:all: -v ./*.whl --group "test-cu${TEST_CUDA_MAJOR}"
          pip list
          popd

      - name: Run cuda.pathfinder tests with all_must_work
        if: ${{ inputs.test-mode == 'standard' && env.TEST_PATHFINDER == 'true' }}
        env:
          CUDA_PATHFINDER_TEST_LOAD_NVIDIA_DYNAMIC_LIB_STRICTNESS: all_must_work
          CUDA_PATHFINDER_TEST_FIND_NVIDIA_HEADERS_STRICTNESS: all_must_work
          CUDA_PATHFINDER_TEST_FIND_NVIDIA_BITCODE_LIB_STRICTNESS: all_must_work
        run: run-tests pathfinder

      # ── Nightly: install wheels + optional dep together ──
      - name: Install cuda-python wheels + PyTorch
        if: ${{ inputs.test-mode == 'nightly-pytorch' }}
        env:
          CUDA_VER: ${{ matrix.CUDA_VER }}
          LOCAL_CTK: ${{ matrix.LOCAL_CTK }}
        run: run-tests nightly-pytorch

      - name: Install cuda-python wheels + numba-cuda
        if: ${{ inputs.test-mode == 'nightly-numba-cuda' }}
        env:
          CUDA_VER: ${{ matrix.CUDA_VER }}
          LOCAL_CTK: ${{ matrix.LOCAL_CTK }}
        run: run-tests nightly-numba-cuda

      - name: Install cuda-python wheels + numba-cuda-mlir
        if: ${{ inputs.test-mode == 'nightly-numba-cuda-mlir' }}
        env:
          CUDA_VER: ${{ matrix.CUDA_VER }}
          LOCAL_CTK: ${{ matrix.LOCAL_CTK }}
        run: run-tests nightly-numba-cuda-mlir

      - name: Install main pathfinder/bindings + released cuda-core
        if: ${{ inputs.test-mode == 'nightly-cuda-core' }}
        env:
          CUDA_VER: ${{ matrix.CUDA_VER }}
          LOCAL_CTK: ${{ matrix.LOCAL_CTK }}
        run: run-tests nightly-cuda-core

      # ── Nightly: run tests ──
      - name: Run PyTorch interop tests
        if: ${{ inputs.test-mode == 'nightly-pytorch' }}
        run: |
          pushd cuda_core
          pytest -rxXs -v tests/test_utils.py tests/example_tests/
          popd

      - name: Run numba-cuda tests
        if: ${{ inputs.test-mode == 'nightly-numba-cuda' }}
        run: python -m numba.runtests numba.cuda.tests

      - name: Checkout numba-cuda-mlir tests at matching tag
        if: ${{ inputs.test-mode == 'nightly-numba-cuda-mlir' && env.NUMBA_CUDA_MLIR_VER != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: NVIDIA/numba-cuda-mlir
          ref: v${{ env.NUMBA_CUDA_MLIR_VER }}
          path: numba-cuda-mlir-released

      - name: Run numba-cuda-mlir tests
        if: ${{ inputs.test-mode == 'nightly-numba-cuda-mlir' && env.NUMBA_CUDA_MLIR_VER != '' }}
        env:
          LOCAL_CTK: ${{ matrix.LOCAL_CTK }}
        run: |
          if [[ "${LOCAL_CTK}" != 1 ]]; then
            # Let numba-cuda-mlir skip inputs that require toolkit executables.
            export NUMBA_CUDA_MLIR_TEST_WHEEL_ONLY=1
          fi
          pushd numba-cuda-mlir-released
          # Install this tag's test deps (pytest + plugins + ml-dtypes + ...).
          pip install --upgrade "pip>=25.1"
          pip install --group test
          # Skip tests/benchmarks/ and tests/doc_examples/ — they import the
          # numba package at collection time, which cuSIMT intentionally does
          # not depend on. See NVIDIA/numba-cuda-mlir#136.
          pytest -rxXs -v \
            --ignore=tests/benchmarks \
            --ignore=tests/doc_examples \
            tests/
          popd

      - name: Checkout released cuda-core tests at matching tag
        if: ${{ inputs.test-mode == 'nightly-cuda-core' && env.CUDA_CORE_RELEASED_VER != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: cuda-core-v${{ env.CUDA_CORE_RELEASED_VER }}
          path: cuda-core-released

      - name: Run released cuda-core tests
        if: ${{ inputs.test-mode == 'nightly-cuda-core' && env.CUDA_CORE_RELEASED_VER != '' }}
        run: |
          pushd cuda-core-released/cuda_core
          # Install the released tag's test group so we exercise the exact deps
          # that cuda-core version shipped with.
          pip install --upgrade "pip>=25.1"
          pip install --group "${CUDA_CORE_TEST_GROUP}"
          # Cap pytest below 9.1: released cuda-core <=1.0.1 has parametrize
          # patterns that pytest 9.1 rejects; the main-side fix (#2212) has
          # not yet shipped in a cuda-core release.
          pip install "pytest<9.1"
          # Version-gated deselect: drops automatically when a newer
          # cuda-core release with the wrapper-mapping update ships.
          DESELECTS=()
          if python -c "from packaging.version import Version; import sys; sys.exit(0 if Version('${CUDA_CORE_RELEASED_VER}') <= Version('1.0.1') else 1)"; then
            # NvlinkVersion: v1.0.1's wrapper mapping predates
            # NvlinkVersion.VERSION_6_0 which main cuda-bindings adds.
            # Expected drift on this mode until released cuda-core catches up.
            DESELECTS+=(
              --deselect 'tests/test_enum_coverage.py::test_wrapper_covers_all_binding_members[NvlinkVersion]'
            )
          fi
          pytest -rxXs -v --randomly-dont-reorganize \
            "${DESELECTS[@]}" \
            tests/
          popd
