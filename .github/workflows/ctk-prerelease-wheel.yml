name: "CUDA 13.4 prerelease wheel"

# This is a focused Developer Preview experiment. It intentionally builds one
# Linux x86_64/Python combination and does not run GPU qualification. Public
# ARM64 packages exist but are deferred; Windows publishes a local installer
# rather than packages the mini-CTK action can extract. Runtime qualification
# also needs an R616-or-newer driver supplied by the runner environment.
on:
  push:
    branches:
      - "ci-ctk-13.4-prerelease"
      - "pull-request/[0-9]+"
    paths:
      - ".github/actions/fetch_ctk/action.yml"
      - ".github/workflows/build-wheel.yml"
      - ".github/workflows/ctk-prerelease-wheel.yml"
      - "ci/tools/fetch_ctk_redistrib.py"
      - "ci/tools/tests/test_fetch_ctk_redistrib.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-linux-64:
    name: Build linux-64, CUDA 13.4.0 Developer Preview
    secrets: inherit
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: linux-64
      cuda-version: "13.4.0"
      cuda-channel: prerelease
      prev-cuda-version: "12.9.1"
      python-versions: '["3.12"]'
