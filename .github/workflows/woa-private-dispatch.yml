name: "WoA exact public-main dispatch"
run-name: "WoA exact dispatch for public run ${{ inputs.public_run_id }}"

on:
  workflow_dispatch:
    inputs:
      public_run_id:
        description: Eligible public main CI run containing the exact WoA artifacts
        required: true
        type: string

permissions: {}

jobs:
  dispatch:
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/woa-private-dispatch-reusable.yml
    with:
      public_run_id: ${{ inputs.public_run_id }}
      baseline_sha: ""
      commit_count: "1"
    secrets: inherit
