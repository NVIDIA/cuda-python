name: "WoA transport check"
run-name: "WoA transport smoke for current public main"

on:
  workflow_dispatch:

permissions: {}

jobs:
  resolve-public-main:
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      correlation-id: ${{ steps.resolve.outputs.correlation_id }}
      public-sha: ${{ steps.resolve.outputs.public_sha }}
    steps:
      - name: Resolve exact public main commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          public_sha=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/NVIDIA/cuda-python/git/ref/heads/main \
            --jq .object.sha)
          [[ "$public_sha" =~ ^[0-9a-f]{40}$ ]]

          commit=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/NVIDIA/cuda-python/commits/$public_sha")
          jq -e --arg sha "$public_sha" '.sha == $sha' <<< "$commit" >/dev/null

          comparison=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/NVIDIA/cuda-python/compare/$public_sha...main")
          jq -e \
            --arg sha "$public_sha" \
            '.base_commit.sha == $sha and
             .merge_base_commit.sha == $sha and
             (.status == "ahead" or .status == "identical")' \
            <<< "$comparison" >/dev/null

          correlation_id="smoke:381173759:main:$public_sha:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          echo "public_sha=$public_sha" >> "$GITHUB_OUTPUT"
          echo "correlation_id=$correlation_id" >> "$GITHUB_OUTPUT"
          echo "Transport smoke will report on public main commit \`$public_sha\`." >> "$GITHUB_STEP_SUMMARY"

  dispatch-private-smoke:
    needs: resolve-public-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Create private dispatch token
        id: private-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.CUDA_PYTHON_WOA_XREPO_CI_PRIVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUDA_PYTHON_WOA_XREPO_CI_PRIVATE_APP_PRIVATE_KEY }}
          owner: NVIDIA-dev
          repositories: cuda-python-private
          permission-actions: write

      - name: Dispatch and verify private smoke workflow
        env:
          CORRELATION_ID: ${{ needs.resolve-public-main.outputs.correlation-id }}
          GH_TOKEN: ${{ steps.private-app-token.outputs.token }}
          PUBLIC_SHA: ${{ needs.resolve-public-main.outputs.public-sha }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg correlation_id "$CORRELATION_ID" \
            --arg public_sha "$PUBLIC_SHA" \
            '{
              ref: "ctk-next",
              return_run_details: true,
              inputs: {
                schema_version: "2",
                public_repository: "NVIDIA/cuda-python",
                public_repository_id: "381173759",
                public_sha: $public_sha,
                correlation_id: $correlation_id
              }
            }')
          response=$(gh api \
            --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/NVIDIA-dev/cuda-python-private/actions/workflows/ctk-next-woa-transport-check.yml/dispatches \
            --input - <<< "$payload")
          private_run_id=$(jq -er '.workflow_run_id | tostring' <<< "$response")
          run=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/NVIDIA-dev/cuda-python-private/actions/runs/$private_run_id")
          jq -e '
            .repository.id == 809898190 and
            .path == ".github/workflows/ctk-next-woa-transport-check.yml" and
            .event == "workflow_dispatch" and
            .head_branch == "ctk-next"
          ' <<< "$run" >/dev/null
          echo "Private transport-smoke workflow accepted the exact dispatch." >> "$GITHUB_STEP_SUMMARY"
