name: "WoA main CI"
run-name: "WoA main CI for ${{ inputs.public_run_id || 'latest successful public main CI run' }}"

on:
  workflow_call:
    inputs:
      public_run_id:
        required: true
        type: string
    secrets:
      CUDA_PYTHON_WOA_XREPO_CI_PRIVATE_APP_PRIVATE_KEY:
        required: true
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      public_run_id:
        description: Eligible public main CI run; leave empty to find the latest successful main CI run
        required: false
        type: string

permissions: {}

jobs:
  select:
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    concurrency:
      group: cuda-python-woa-public-selector
      cancel-in-progress: false
    outputs:
      baseline-sha: ${{ steps.select.outputs.baseline_sha }}
      commit-count: ${{ steps.select.outputs.commit_count }}
      dispatch: ${{ steps.select.outputs.dispatch }}
      public-run-id: ${{ steps.select.outputs.public_run_id }}
    steps:
      - name: Select public batch
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.public_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RUN_ID" ]]; then
            run=$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/NVIDIA/cuda-python/actions/runs/$INPUT_RUN_ID")
          else
            run=$(gh api --method GET \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              repos/NVIDIA/cuda-python/actions/workflows/ci.yml/runs \
              -f branch=main -f event=push -f status=success -F per_page=1 \
              --jq '.workflow_runs[0]')
          fi
          jq -e '
            .repository.full_name == "NVIDIA/cuda-python" and
            .workflow_id == 155304118 and
            .path == ".github/workflows/ci.yml" and
            .event == "push" and
            .head_branch == "main" and
            ((.status == "in_progress" and .conclusion == null) or
             (.status == "completed" and .conclusion == "success"))
          ' <<< "$run" >/dev/null
          run_id=$(jq -r '.id | tostring' <<< "$run")
          sha=$(jq -r .head_sha <<< "$run")
          external_id="woa:v1:NVIDIA/cuda-python:$run_id:$sha"

          checks=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/NVIDIA/cuda-python/commits/$sha/check-runs?check_name=cuda-python%20WoA%20integration&per_page=100")
          if jq -e --arg id "$external_id" '
            any(.check_runs[]; .app.id == 4954254 and .external_id == $id)
          ' <<< "$checks" >/dev/null; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "This exact public run already has an App-owned attempt." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          commits=$(gh api --method GET \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/NVIDIA/cuda-python/commits -f sha=main -F per_page=100)
          candidate_index=$(jq -er --arg sha "$sha" '
            [to_entries[] | select(.value.sha == $sha) | .key][0]
          ' <<< "$commits")
          commit_total=$(jq length <<< "$commits")
          baseline_index=""
          baseline_sha=""
          for ((index = candidate_index + 1; index < commit_total; index++)); do
            older_sha=$(jq -r --argjson index "$index" '.[$index].sha' <<< "$commits")
            older_checks=$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/NVIDIA/cuda-python/commits/$older_sha/check-runs?check_name=cuda-python%20WoA%20integration&per_page=100")
            if jq -e '
              any(.check_runs[];
                .app.id == 4954254 and
                .status == "completed" and
                .conclusion == "success")
            ' <<< "$older_checks" >/dev/null; then
              baseline_index=$index
              baseline_sha=$older_sha
              break
            fi
          done

          dispatch=true
          commit_count=1
          reason="Bootstrap: no successful App-owned baseline exists in the latest 100 commits."
          if [[ -n "$baseline_index" ]]; then
            commit_count=$((baseline_index - candidate_index))
            oldest_pending_index=$((baseline_index - 1))
            oldest_pending_at=$(jq -r \
              --argjson index "$oldest_pending_index" \
              '.[$index].commit.committer.date' <<< "$commits")
            age_seconds=$(($(date +%s) - $(date -d "$oldest_pending_at" +%s)))
            if (( commit_count >= 3 )); then
              reason="Batch threshold reached: $commit_count commits."
            elif (( age_seconds >= 7200 )); then
              reason="Two-hour fallback reached: oldest pending commit is $age_seconds seconds old."
            else
              dispatch=false
              reason="Deferred: $commit_count/3 commits and oldest pending age $age_seconds/7200 seconds."
            fi
          fi
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "commit_count=$commit_count" >> "$GITHUB_OUTPUT"
          echo "dispatch=$dispatch" >> "$GITHUB_OUTPUT"
          echo "public_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

  resolve-public-build:
    needs: select
    if: ${{ github.repository == 'NVIDIA/cuda-python' && needs.select.outputs.dispatch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      correlation-id: ${{ steps.resolve.outputs.correlation_id }}
      public-run-id: ${{ steps.resolve.outputs.public_run_id }}
      public-sha: ${{ steps.resolve.outputs.public_sha }}
    steps:
      - name: Resolve exact public build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RUN_ID: ${{ needs.select.outputs.public-run-id }}
        run: |
          set -euo pipefail
          [[ "$PUBLIC_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/NVIDIA/cuda-python/actions/runs/$PUBLIC_RUN_ID")
          jq -e '
            .repository.full_name == "NVIDIA/cuda-python" and
            .workflow_id == 155304118 and
            .path == ".github/workflows/ci.yml" and
            .event == "push" and
            .head_branch == "main" and
            ((.status == "in_progress" and .conclusion == null) or
             (.status == "completed" and .conclusion == "success")) and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' <<< "$run" >/dev/null
          public_sha=$(jq -r .head_sha <<< "$run")

          comparison=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/NVIDIA/cuda-python/compare/$public_sha...main")
          jq -e '.status == "ahead" or .status == "identical"' <<< "$comparison" >/dev/null

          correlation_id="v1:NVIDIA/cuda-python:$PUBLIC_RUN_ID:$public_sha"
          echo "correlation_id=$correlation_id" >> "$GITHUB_OUTPUT"
          echo "public_run_id=$PUBLIC_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "public_sha=$public_sha" >> "$GITHUB_OUTPUT"
          {
            echo "Resolved public run \`$PUBLIC_RUN_ID\` at commit \`$public_sha\`."
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-private-validation:
    needs:
      - select
      - resolve-public-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Create private dispatch token
        id: private-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.CUDA_PYTHON_WOA_XREPO_CI_PRIVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUDA_PYTHON_WOA_XREPO_CI_PRIVATE_APP_PRIVATE_KEY }}
          owner: NVIDIA-dev
          repositories: cuda-python-private
          permission-actions: write

      - name: Dispatch and verify exact private validation
        env:
          BASELINE_SHA: ${{ needs.select.outputs.baseline-sha }}
          COMMIT_COUNT: ${{ needs.select.outputs.commit-count }}
          CORRELATION_ID: ${{ needs.resolve-public-build.outputs.correlation-id }}
          GH_TOKEN: ${{ steps.private-app-token.outputs.token }}
          PUBLIC_RUN_ID: ${{ needs.resolve-public-build.outputs.public-run-id }}
          PUBLIC_SHA: ${{ needs.resolve-public-build.outputs.public-sha }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg baseline_sha "$BASELINE_SHA" \
            --arg commit_count "$COMMIT_COUNT" \
            --arg correlation_id "$CORRELATION_ID" \
            --arg run_id "$PUBLIC_RUN_ID" \
            --arg sha "$PUBLIC_SHA" \
            '{
              ref: "ctk-next",
              return_run_details: true,
              inputs: {
                schema_version: "1",
                public_repository: "NVIDIA/cuda-python",
                public_workflow_id: "155304118",
                public_run_id: $run_id,
                public_sha: $sha,
                baseline_sha: $baseline_sha,
                commit_count: $commit_count,
                correlation_id: $correlation_id
              }
            }')
          response=$(gh api \
            --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/NVIDIA-dev/cuda-python-private/actions/workflows/ctk-next-woa-main-ci.yml/dispatches \
            --input - <<< "$payload")
          private_run_id=$(jq -er '.workflow_run_id | tostring' <<< "$response")
          run=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/NVIDIA-dev/cuda-python-private/actions/runs/$private_run_id")
          jq -e '
            .repository.full_name == "NVIDIA-dev/cuda-python-private" and
            .path == ".github/workflows/ctk-next-woa-main-ci.yml" and
            .event == "workflow_dispatch" and
            .head_branch == "ctk-next"
          ' <<< "$run" >/dev/null
          echo "Private validation workflow accepted the exact dispatch." >> "$GITHUB_STEP_SUMMARY"
