name: "WoA main CI"
run-name: "WoA main CI for ${{ github.sha }}"

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: cuda-python-woa-public-selector
  cancel-in-progress: false

jobs:
  resolve-public-build:
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      checks: read
    outputs:
      dispatch: ${{ steps.select.outputs.dispatch }}
      correlation-id: ${{ steps.resolve.outputs.correlation_id }}
      public-run-id: ${{ steps.resolve.outputs.public_run_id }}
      public-sha: ${{ steps.resolve.outputs.public_sha }}
    steps:
      - name: Checkout CI selection helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            ci/tools/select-woa-batch
            ci/versions.yml
          sparse-checkout-cone-mode: false

      - name: Resolve exact public build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PUBLIC_RUN_ID=''
          for ((attempt = 0; attempt < 20; attempt++)); do
            runs=$(gh api --method GET \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              repos/NVIDIA/cuda-python/actions/workflows/ci.yml/runs \
              -f event=push -f branch=main -f head_sha="$PUBLIC_SHA" -F per_page=100)
            PUBLIC_RUN_ID=$(jq -r --arg sha "$PUBLIC_SHA" '
              [.workflow_runs[] | select(.event == "push" and
                .head_branch == "main" and .head_sha == $sha)]
              | max_by(.id) | .id // empty
            ' <<< "$runs")
            [[ -z "$PUBLIC_RUN_ID" ]] || break
            echo "Waiting for main push CI run at $PUBLIC_SHA (attempt $((attempt + 1))/20)."
            sleep 30
          done
          if [[ -z "$PUBLIC_RUN_ID" ]]; then
            echo "::error::No main push CI run appeared for $PUBLIC_SHA within ten minutes."
            exit 1
          fi
          [[ "$PUBLIC_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/NVIDIA/cuda-python/actions/runs/$PUBLIC_RUN_ID")
          jq -e --arg sha "$PUBLIC_SHA" '
            .repository.full_name == "NVIDIA/cuda-python" and
            .workflow_id == 155304118 and
            .path == ".github/workflows/ci.yml" and
            .event == "push" and
            .head_branch == "main" and
            ((.status != "completed" and .conclusion == null) or
             (.status == "completed" and .conclusion == "success")) and
            .head_sha == $sha and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' <<< "$run" >/dev/null
          correlation_id="v1:NVIDIA/cuda-python:$PUBLIC_RUN_ID:$PUBLIC_SHA"
          echo "correlation_id=$correlation_id" >> "$GITHUB_OUTPUT"
          echo "public_run_id=$PUBLIC_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "public_sha=$PUBLIC_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "Resolved public run \`$PUBLIC_RUN_ID\` at commit \`$PUBLIC_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select public batch
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RUN_ID: ${{ steps.resolve.outputs.public_run_id }}
          PUBLIC_SHA: ${{ steps.resolve.outputs.public_sha }}
        run: bash ./ci/tools/select-woa-batch

      - name: Wait for public WoA wheel artifacts
        if: ${{ steps.select.outputs.dispatch == 'true' }}
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RUN_ID: ${{ steps.resolve.outputs.public_run_id }}
          PUBLIC_SHA: ${{ steps.resolve.outputs.public_sha }}
        run: |
          set -euo pipefail
          cuda_version=$(yq -r '.cuda.build.version' ci/versions.yml)
          mapfile -t python_versions < <(yq -r '.python.supported[]' ci/versions.yml)
          pending=(cuda-pathfinder-wheel)
          for version in "${python_versions[@]}"; do
            python_tag=${version//./}
            pending+=("cuda-bindings-python$python_tag-cuda$cuda_version-win-arm64-$PUBLIC_SHA"
                      "cuda-core-python$python_tag-win-arm64-$PUBLIC_SHA")
          done
          while (( ${#pending[@]} > 0 )); do
            run=$(gh api \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/NVIDIA/cuda-python/actions/runs/$PUBLIC_RUN_ID")
            if jq -e '.status == "completed" and .conclusion != "success"' <<< "$run" >/dev/null; then
              echo "::error::Public CI run $PUBLIC_RUN_ID ended with $(jq -r .conclusion <<< "$run")."
              exit 1
            fi
            artifact_name=${pending[0]}
            artifacts=$(gh api --method GET \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/NVIDIA/cuda-python/actions/runs/$PUBLIC_RUN_ID/artifacts" \
              -f name="$artifact_name")
            if jq -e --arg name "$artifact_name" '
              .total_count == 1 and (.artifacts | length == 1) and
              .artifacts[0].name == $name and .artifacts[0].expired == false
            ' <<< "$artifacts" >/dev/null; then
              echo "Ready: $artifact_name"
              pending=("${pending[@]:1}")
            elif [[ $(jq -r .status <<< "$run") == completed ]]; then
              echo "::error::Successful public CI run $PUBLIC_RUN_ID is missing usable artifact $artifact_name."
              jq . <<< "$artifacts"
              exit 1
            else
              echo "Waiting for $artifact_name (${#pending[@]} artifacts remaining)."
              sleep 60
            fi
          done
          echo "All public WoA wheel artifacts are ready; remaining public CI jobs need not finish." >> "$GITHUB_STEP_SUMMARY"

  dispatch-private-validation:
    needs: resolve-public-build
    if: ${{ needs.resolve-public-build.outputs.dispatch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Create private dispatch token
        id: private-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ vars.CUDA_PYTHON_WOA_XREPO_CI_PRIVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CUDA_PYTHON_WOA_XREPO_CI_PRIVATE_APP_PRIVATE_KEY }}
          owner: NVIDIA-dev
          repositories: cuda-python-private
          permission-actions: write

      - name: Dispatch and verify exact private validation
        env:
          CORRELATION_ID: ${{ needs.resolve-public-build.outputs.correlation-id }}
          GH_TOKEN: ${{ steps.private-app-token.outputs.token }}
          PUBLIC_RUN_ID: ${{ needs.resolve-public-build.outputs.public-run-id }}
          PUBLIC_SHA: ${{ needs.resolve-public-build.outputs.public-sha }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg correlation_id "$CORRELATION_ID" \
            --arg run_id "$PUBLIC_RUN_ID" \
            --arg sha "$PUBLIC_SHA" \
            '{
              ref: "ctk-next",
              return_run_details: true,
              inputs: {
                schema_version: "1",
                public_repository: "NVIDIA/cuda-python",
                public_workflow_id: "155304118",
                public_run_id: $run_id,
                public_sha: $sha,
                correlation_id: $correlation_id
              }
            }')
          response=$(gh api \
            --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/NVIDIA-dev/cuda-python-private/actions/workflows/ctk-next-woa-main-ci.yml/dispatches \
            --input - <<< "$payload")
          private_run_id=$(jq -er '.workflow_run_id | tostring' <<< "$response")
          run=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/NVIDIA-dev/cuda-python-private/actions/runs/$private_run_id")
          jq -e '
            .repository.full_name == "NVIDIA-dev/cuda-python-private" and
            .path == ".github/workflows/ctk-next-woa-main-ci.yml" and
            .event == "workflow_dispatch" and
            .head_branch == "ctk-next"
          ' <<< "$run" >/dev/null
          echo "Private validation workflow accepted the exact dispatch." >> "$GITHUB_STEP_SUMMARY"
