on:
  workflow_call:
    inputs:
      host-platform:
        required: true
        type: string
      cuda-version:
        required: true
        type: string
      baseline-run-id:
        required: false
        default: ""
        type: string
      moon-base:
        required: true
        type: string
      force-all:
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  actions: read  # This is required for actions/download-artifact
  contents: read  # This is required for actions/checkout

jobs:
  test-sdist:
    name: Test sdist builds
    timeout-minutes: 60
    runs-on: linux-amd64-cpu8
    env:
      BUILD_CUDA_VER: ${{ inputs.cuda-version }}
      CUDA_VER: ${{ inputs.cuda-version }}
      HOST_PLATFORM: ${{ inputs.host-platform }}
      MOON_BASE: ${{ inputs.moon-base }}
      MOON_FORCE_ALL: ${{ inputs.force-all && 'true' || 'false' }}
      MOON_HEAD: ${{ github.sha }}
      PY_VER: "3.12"
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Treeless clone: setuptools-scm (invoked via `python -m build`) needs
          # the commit graph (`git describe`) but not historical blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0.6.4
        with:
          moon-version: "2.5.1"
          auto-install: false
          auto-setup: false

      - name: Install build tools
        run: python -m pip install "pip>=25.3" build

      # Cython packages need CTK + sccache.
      # The env vars ACTIONS_CACHE_SERVICE_V2, ACTIONS_RESULTS_URL, and ACTIONS_RUNTIME_TOKEN
      # are exposed by this action.
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # 0.0.10
        with:
          disable_annotations: 'true'

      # xref: https://github.com/orgs/community/discussions/42856#discussioncomment-7678867
      - name: Adding additional GHA cache-related env vars
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env['ACTIONS_RUNTIME_URL'])

      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@main
        continue-on-error: true
        with:
          enable-apt: true

      - name: Set environment variables
        env:
          SHA: ${{ github.sha }}
        run: ./ci/tools/env-vars build

      - name: Restore trusted exact-base Moon cache
        if: ${{ inputs.baseline-run-id != '' && !inputs.force-all }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: moon-cache-sdist-${{ inputs.host-platform }}
          path: .moon/cache
          github-token: ${{ github.token }}
          run-id: ${{ inputs.baseline-run-id }}

      - name: Set up mini CTK
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ inputs.cuda-version }}

      - name: Build affected sdists and verify wheels with Moon
        run: |
          export CC="sccache cc"
          export CXX="sccache c++"
          args=()
          if [[ "${MOON_FORCE_ALL}" == "true" ]]; then
            args+=(--force)
          fi
          moon ci ':#ci-sdist' --downstream none "${args[@]}"

      - name: Validate sdist outputs
        run: |
          validated=0
          for project in cuda_pathfinder cuda_bindings cuda_core cuda_python; do
            output="${project}/.moon-out/sdist"
            if [[ ! -d "${output}" ]]; then
              continue
            fi
            test "$(find "${output}" -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1
            test "$(find "${output}" -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
            validated=$((validated + 1))
          done
          test "${validated}" -gt 0

      - name: Show sccache stats
        if: ${{ always() }}
        run: sccache --show-stats

      # GitHub transports Moon's portable cache between trusted exact runs;
      # Moon remains responsible for hashes, hits, and output hydration.
      - name: Upload portable Moon cache
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: moon-cache-sdist-${{ inputs.host-platform }}
          path: |
            .moon/cache/hashes
            .moon/cache/outputs
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 30
