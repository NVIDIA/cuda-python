on:
  workflow_call:
    inputs:
      host-platform:
        required: true
        type: string
      cuda-version:
        required: true
        type: string
      targets:
        description: JSON object keyed by semantic Moon tags. An empty value builds everything.
        required: false
        default: ""
        type: string

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  actions: read  # This is required for actions/download-artifact
  contents: read  # This is required for actions/checkout

jobs:
  test-sdist:
    name: Test sdist builds
    env:
      SEMANTIC_TARGETS: ${{ inputs.targets != '' && inputs.targets || '{"ci-sdist-foundation":["pathfinder:sdist"],"ci-sdist-bindings":["bindings:sdist"],"ci-sdist-consumers":["core:sdist","metapackage:sdist"]}' }}
    timeout-minutes: 60
    runs-on: linux-amd64-cpu8
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Treeless clone: setuptools-scm (invoked via `python -m build`) needs
          # the commit graph (`git describe`) but not historical blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Install target resolver dependencies
        uses: ./.github/actions/install_unix_deps
        with:
          dependencies: "jq"
          dependent_exes: "jq"

      - name: Resolve Moon sdist targets
        run: |
          jq -e '
            . as $root |
            type == "object" and
            all(["ci-sdist-foundation", "ci-sdist-bindings", "ci-sdist-consumers"][];
              . as $tag |
              (($root[$tag] // []) | type == "array" and all(.[]; type == "string")))
          ' <<< "$SEMANTIC_TARGETS" >/dev/null
          foundation=$(jq -c '.["ci-sdist-foundation"] // []' <<< "$SEMANTIC_TARGETS")
          bindings=$(jq -c '.["ci-sdist-bindings"] // []' <<< "$SEMANTIC_TARGETS")
          consumers=$(jq -c '.["ci-sdist-consumers"] // []' <<< "$SEMANTIC_TARGETS")
          all_targets=$(jq -cn \
            --argjson foundation "$foundation" \
            --argjson bindings "$bindings" \
            --argjson consumers "$consumers" \
            '$foundation + $bindings + $consumers')
          has_target() {
            jq -e --arg target "$1" 'index($target) != null' <<< "$all_targets" >/dev/null
          }
          {
            echo "SDIST_FOUNDATION_TARGETS=$foundation"
            echo "SDIST_BINDINGS_TARGETS=$bindings"
            echo "SDIST_CONSUMER_TARGETS=$consumers"
            echo "BUILD_PATHFINDER=$(has_target pathfinder:sdist && echo true || echo false)"
            echo "BUILD_BINDINGS=$(has_target bindings:sdist && echo true || echo false)"
            echo "BUILD_CORE=$(has_target core:sdist && echo true || echo false)"
            echo "BUILD_PYTHON=$(has_target metapackage:sdist && echo true || echo false)"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Moon and build tools
        run: |
          curl -fsSL "https://github.com/moonrepo/moon/releases/download/v2.5.1/moon_cli-installer.sh" | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          python -m pip install "pip>=25.3" build

      # Pure Python packages -- no CTK needed.
      - name: Build foundation sdists and wheels-from-sdists
        if: ${{ env.BUILD_PATHFINDER == 'true' }}
        run: |
          mapfile -t targets < <(jq -r '.[]' <<< "$SDIST_FOUNDATION_TARGETS")
          moon run "${targets[@]}" --upstream none --downstream none

      - name: Download cuda.pathfinder wheel
        if: ${{ env.BUILD_PATHFINDER != 'true' && (env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cuda-pathfinder-wheel
          path: cuda_pathfinder/dist

      - name: Constrain builds to the local cuda.pathfinder wheel
        if: ${{ env.BUILD_BINDINGS == 'true' }}
        run: |
          pathfinder_wheels=(cuda_pathfinder/dist/cuda_pathfinder-*.whl)
          test "${#pathfinder_wheels[@]}" -eq 1
          test -f "${pathfinder_wheels[0]}"
          mkdir -p wheel-constraints
          pathfinder_uri="file://$(realpath "${pathfinder_wheels[0]}")"
          printf 'cuda-pathfinder @ %s\n' "${pathfinder_uri}" | tee wheel-constraints/cuda-bindings.txt

      # Cython packages need CTK + sccache.
      # The env vars ACTIONS_CACHE_SERVICE_V2, ACTIONS_RESULTS_URL, and ACTIONS_RUNTIME_TOKEN
      # are exposed by this action.
      - name: Enable sccache
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' }}
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # 0.0.10
        with:
          disable_annotations: 'true'

      # xref: https://github.com/orgs/community/discussions/42856#discussioncomment-7678867
      - name: Adding additional GHA cache-related env vars
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env['ACTIONS_RUNTIME_URL'])

      - name: Setup proxy cache
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' }}
        uses: nv-gha-runners/setup-proxy-cache@main
        continue-on-error: true
        with:
          enable-apt: true

      - name: Set up mini CTK
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' }}
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ inputs.cuda-version }}

      # cuda_bindings/setup.py parses CUDA headers at import time, so CUDA_PATH
      # (set by fetch_ctk) must be available for both sdist and wheel builds.
      - name: Build bindings sdists and wheels-from-sdists
        if: ${{ env.BUILD_BINDINGS == 'true' }}
        run: |
          export CUDA_PYTHON_PARALLEL_LEVEL=$(nproc)
          export CC="sccache cc"
          export CXX="sccache c++"
          export PIP_BUILD_CONSTRAINT="$(pwd)/wheel-constraints/cuda-bindings.txt"
          export PIP_CONSTRAINT="${PIP_BUILD_CONSTRAINT}"
          mapfile -t targets < <(jq -r '.[]' <<< "$SDIST_BINDINGS_TARGETS")
          moon run "${targets[@]}" --upstream none --downstream none

      - name: Download cuda.bindings wheel
        if: ${{ env.BUILD_BINDINGS != 'true' && env.BUILD_CORE == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cuda-bindings-python312-cuda${{ inputs.cuda-version }}-${{ inputs.host-platform }}-${{ github.sha }}
          path: cuda_bindings/dist

      - name: Constrain cuda.core to the local cuda.bindings wheel
        if: ${{ env.BUILD_CORE == 'true' }}
        run: |
          CUDA_MAJOR="$(echo '${{ inputs.cuda-version }}' | cut -d. -f1)"
          pathfinder_wheels=(cuda_pathfinder/dist/cuda_pathfinder-*.whl)
          bindings_wheels=(cuda_bindings/dist/cuda_bindings-"${CUDA_MAJOR}".*.whl)
          test "${#pathfinder_wheels[@]}" -eq 1
          test "${#bindings_wheels[@]}" -eq 1
          test -f "${pathfinder_wheels[0]}"
          test -f "${bindings_wheels[0]}"
          mkdir -p wheel-constraints
          pathfinder_uri="file://$(realpath "${pathfinder_wheels[0]}")"
          bindings_uri="file://$(realpath "${bindings_wheels[0]}")"
          {
            printf 'cuda-pathfinder @ %s\n' "${pathfinder_uri}"
            printf 'cuda-bindings @ %s\n' "${bindings_uri}"
          } | tee wheel-constraints/cuda-core.txt

      # cuda_core sdist delegates to setuptools (no CTK needed), but
      # wheel-from-sdist needs CTK and cuda-bindings (dynamic build dep via
      # get_requires_for_build_wheel in build_hooks.py).
      - name: Build consumer sdists and wheels-from-sdists
        if: ${{ env.BUILD_CORE == 'true' || env.BUILD_PYTHON == 'true' }}
        run: |
          if [[ "$BUILD_CORE" == "true" ]]; then
            export CUDA_PYTHON_PARALLEL_LEVEL=$(nproc)
            export CUDA_CORE_BUILD_MAJOR="$(echo '${{ inputs.cuda-version }}' | cut -d. -f1)"
            export CC="sccache cc"
            export CXX="sccache c++"
            export PIP_BUILD_CONSTRAINT="$(pwd)/wheel-constraints/cuda-core.txt"
            export PIP_CONSTRAINT="${PIP_BUILD_CONSTRAINT}"
          fi
          mapfile -t targets < <(jq -r '.[]' <<< "$SDIST_CONSUMER_TARGETS")
          moon run "${targets[@]}" --upstream none --downstream none

      - name: Show sccache stats
        if: ${{ always() && (env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true') }}
        run: sccache --show-stats
