on:
  workflow_call:
    inputs:
      host-platform:
        required: true
        type: string
      bindings-package:
        description: Normalized CUDA bindings package JSON.
        required: true
        type: string
      workplan:
        description: JSON workplan.
        required: true
        type: string

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  actions: read  # This is required for actions/download-artifact
  contents: read  # This is required for actions/checkout

jobs:
  test-sdist:
    name: Test sdist builds (${{ fromJSON(inputs.bindings-package).package_root }})
    if: ${{ fromJSON(inputs.workplan).jobs.sdist_package_roots[fromJSON(inputs.bindings-package).package_root] }}
    env:
      BINDINGS_ROOT: ${{ fromJSON(inputs.bindings-package).package_root }}
      CUDA_BUILD_VERSION: ${{ fromJSON(inputs.bindings-package).toolkit_version }}
      CUDA_PYTHON_BUILD_MAJOR: ${{ fromJSON(inputs.bindings-package).cuda_major }}
      BUILD_PATHFINDER: ${{ fromJSON(inputs.workplan).modules.pathfinder.needs_build }}
      BUILD_BINDINGS: ${{ fromJSON(inputs.workplan).modules.bindings.package_roots[fromJSON(inputs.bindings-package).package_root].needs_build }}
      BUILD_CORE: ${{ fromJSON(inputs.workplan).modules.core.cuda_majors[fromJSON(inputs.bindings-package).cuda_variant].needs_build }}
      BUILD_CUDA_PYTHON: ${{ fromJSON(inputs.workplan).modules.python.package_roots[fromJSON(inputs.bindings-package).package_root].needs_build }}
      PATHFINDER_SOURCE: ${{ fromJSON(inputs.workplan).sources.pathfinder }}
    timeout-minutes: 60
    runs-on: linux-amd64-cpu8
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Treeless clone: setuptools-scm (invoked via `python -m build`) needs
          # the commit graph (`git describe`) but not historical blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build and CI tools
        run: python -m pip install "pip>=25.3" build -e ./ci

      - name: Set maintenance package development versions
        if: ${{ fromJSON(inputs.bindings-package).release_status == 'maintenance' }}
        run: |
          version="$(python -m ci.tools.bindings_scm_version \
            --package-root "${BINDINGS_ROOT}" \
            --sha "$GITHUB_SHA")"
          if [[ -n "$version" ]]; then
            echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CUDA_BINDINGS=${version}" >> "$GITHUB_ENV"
            echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CUDA_PYTHON=${version}" >> "$GITHUB_ENV"
          fi

      # Pure Python packages -- no CTK needed.
      - name: Build cuda.pathfinder sdist and wheel-from-sdist
        if: ${{ env.BUILD_PATHFINDER == 'true' }}
        run: |
          python -m build --sdist cuda_pathfinder/
          pip wheel --no-deps --wheel-dir cuda_pathfinder/dist cuda_pathfinder/dist/*.tar.gz

      - name: Build cuda-python sdist and wheel-from-sdist
        if: ${{ env.BUILD_CUDA_PYTHON == 'true' }}
        run: |
          python -m build --sdist cuda_python/
          pip wheel --no-deps --wheel-dir cuda_python/dist cuda_python/dist/*.tar.gz

      - name: Download cuda.pathfinder wheel
        if: ${{ env.BUILD_PATHFINDER != 'true' && (env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true') &&
                env.PATHFINDER_SOURCE == 'artifact' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cuda-pathfinder-wheel
          path: cuda_pathfinder/dist

      - name: Constrain builds to the local cuda.pathfinder wheel
        if: ${{ env.BUILD_BINDINGS == 'true' }}
        run: |
          pathfinder_wheels=(cuda_pathfinder/dist/cuda_pathfinder-*.whl)
          mkdir -p wheel-constraints
          if [[ "${PATHFINDER_SOURCE}" == "artifact" ]]; then
            if [[ "${#pathfinder_wheels[@]}" -ne 1 || ! -f "${pathfinder_wheels[0]}" ]]; then
              echo "Expected exactly one cuda-pathfinder wheel in cuda_pathfinder/dist" >&2
              exit 1
            fi
            pathfinder_uri="file://$(realpath "${pathfinder_wheels[0]}")"
            printf 'cuda-pathfinder @ %s\n' "${pathfinder_uri}" > wheel-constraints/cuda-bindings.txt
          elif [[ "${PATHFINDER_SOURCE}" == "published" ]]; then
            : > wheel-constraints/cuda-bindings.txt
          else
            echo "Error: PATHFINDER_SOURCE must be artifact or published, got ${PATHFINDER_SOURCE}" >&2
            exit 1
          fi
          cat wheel-constraints/cuda-bindings.txt

      # Cython packages need CTK + sccache.
      # The env vars ACTIONS_CACHE_SERVICE_V2, ACTIONS_RESULTS_URL, and ACTIONS_RUNTIME_TOKEN
      # are exposed by this action.
      - name: Enable sccache
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' }}
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # 0.0.10
        with:
          disable_annotations: 'true'

      # xref: https://github.com/orgs/community/discussions/42856#discussioncomment-7678867
      - name: Adding additional GHA cache-related env vars
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env['ACTIONS_RUNTIME_URL'])

      - name: Setup proxy cache
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' }}
        uses: nv-gha-runners/setup-proxy-cache@main
        continue-on-error: true
        with:
          enable-apt: true

      - name: Set up mini CTK
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' }}
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ fromJSON(inputs.bindings-package).toolkit_version }}

      # cuda_bindings/setup.py parses CUDA headers at import time, so CUDA_PATH
      # (set by fetch_ctk) must be available for both sdist and wheel builds.
      - name: Build cuda.bindings sdist and wheel-from-sdist
        if: ${{ env.BUILD_BINDINGS == 'true' }}
        run: |
          export CUDA_PYTHON_PARALLEL_LEVEL=$(nproc)
          export CC="sccache cc"
          export CXX="sccache c++"
          export PIP_BUILD_CONSTRAINT="$(pwd)/wheel-constraints/cuda-bindings.txt"
          export PIP_CONSTRAINT="${PIP_BUILD_CONSTRAINT}"
          python -m build --sdist "${BINDINGS_ROOT}/"
          pip wheel --no-deps --wheel-dir "${BINDINGS_ROOT}/dist" "${BINDINGS_ROOT}"/dist/*.tar.gz

      - name: Download cuda.bindings wheel
        if: ${{ env.BUILD_BINDINGS != 'true' && env.BUILD_CORE == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cuda-bindings-python312-cuda${{ fromJSON(inputs.bindings-package).toolkit_version }}-${{ inputs.host-platform }}-${{ github.sha }}
          path: ${{ env.BINDINGS_ROOT }}/dist

      - name: Constrain cuda.core to the local cuda.bindings wheel
        if: ${{ env.BUILD_CORE == 'true' }}
        run: |
          CUDA_MAJOR='${{ fromJSON(inputs.bindings-package).cuda_major }}'
          pathfinder_wheels=(cuda_pathfinder/dist/cuda_pathfinder-*.whl)
          bindings_wheels=("${BINDINGS_ROOT}"/dist/cuda_bindings-"${CUDA_MAJOR}".*.whl)
          test "${#pathfinder_wheels[@]}" -eq 1
          test "${#bindings_wheels[@]}" -eq 1
          test -f "${pathfinder_wheels[0]}"
          test -f "${bindings_wheels[0]}"
          mkdir -p wheel-constraints
          pathfinder_uri="file://$(realpath "${pathfinder_wheels[0]}")"
          bindings_uri="file://$(realpath "${bindings_wheels[0]}")"
          {
            printf 'cuda-pathfinder @ %s\n' "${pathfinder_uri}"
            printf 'cuda-bindings @ %s\n' "${bindings_uri}"
          } | tee wheel-constraints/cuda-core.txt

      # cuda_core sdist delegates to setuptools (no CTK needed), but
      # wheel-from-sdist needs CTK and cuda-bindings (dynamic build dep via
      # get_requires_for_build_wheel in build_hooks.py).
      - name: Build cuda.core sdist and wheel-from-sdist
        if: ${{ env.BUILD_CORE == 'true' }}
        run: |
          export CUDA_PYTHON_PARALLEL_LEVEL=$(nproc)
          export CUDA_CORE_BUILD_MAJOR='${{ fromJSON(inputs.bindings-package).cuda_major }}'
          export CC="sccache cc"
          export CXX="sccache c++"
          export PIP_BUILD_CONSTRAINT="$(pwd)/wheel-constraints/cuda-core.txt"
          export PIP_CONSTRAINT="${PIP_BUILD_CONSTRAINT}"
          python -m build --sdist cuda_core/
          pip wheel --no-deps --wheel-dir cuda_core/dist cuda_core/dist/*.tar.gz

      - name: Show sccache stats
        if: ${{ always() && (env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true') }}
        run: sccache --show-stats
