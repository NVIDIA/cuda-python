on:
  workflow_call:
    inputs:
      host-platform:
        required: true
        type: string
      cuda-version:
        required: true
        type: string
      prev-cuda-version:
        required: true
        type: string
      baseline-run-id:
        required: false
        type: string
        default: ""
      moon-base:
        description: "Base revision used by Moon affected checks"
        required: true
        type: string
      force-all:
        description: "Force selected Moon tasks when no reusable baseline exists"
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  actions: read
  contents: read  # This is required for actions/checkout

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: "3.10", python-version-formatted: "310"}
          - {python-version: "3.11", python-version-formatted: "311"}
          - {python-version: "3.12", python-version-formatted: "312"}
          - {python-version: "3.13", python-version-formatted: "313"}
          - {python-version: "3.14", python-version-formatted: "314"}
          - {python-version: "3.14t", python-version-formatted: "314t"}
          - {python-version: "3.15", python-version-formatted: "315"}
          - {python-version: "3.15t", python-version-formatted: "315t"}
    name: py${{ matrix.python-version }}
    runs-on: ${{ (inputs.host-platform == 'linux-64' && 'linux-amd64-cpu8') ||
                 (inputs.host-platform == 'linux-aarch64' && 'linux-arm64-cpu8') ||
                 (inputs.host-platform == 'win-64' && 'windows-2022') }}
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Treeless clone: setuptools-scm needs the commit graph (`git describe`)
          # but not historical blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Install latest rapidsai/sccache
        if: ${{ startsWith(inputs.host-platform, 'linux') }}
        run: |
          curl -fsSL "https://github.com/rapidsai/sccache/releases/latest/download/sccache-$(uname -m)-unknown-linux-musl.tar.gz" \
            | sudo tar -C /usr/local/bin -xvzf - --wildcards --strip-components=1 -x '*/sccache'
          echo "SCCACHE_PATH=/usr/local/bin/sccache" >> "$GITHUB_ENV"

      # xref: https://github.com/orgs/community/discussions/42856#discussioncomment-7678867
      - name: Adding addtional GHA cache-related env vars
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env['ACTIONS_RUNTIME_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@main
        continue-on-error: true
        # Skip cache on GitHub-hosted Windows runners.
        if: ${{ inputs.host-platform != 'win-64' }}
        with:
          enable-apt: true

      - name: Set up Python
        id: setup-python1
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          # WAR: setup-python is not relocatable, and cibuildwheel hard-wires to 3.12...
          # see https://github.com/actions/setup-python/issues/871
          python-version: "3.12"

      - name: Set up Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0.6.4
        with:
          moon-version: "2.5.1"
          auto-install: false
          auto-setup: false

      - name: Restore trusted exact-base Moon cache
        if: ${{ inputs.baseline-run-id != '' && !inputs.force-all }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: moon-lane-build-${{ inputs.host-platform }}-py${{ matrix.python-version-formatted }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ inputs.baseline-run-id }}

      - name: Set up MSVC
        if: ${{ startsWith(inputs.host-platform, 'win') }}
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4  # v1.13.1

      - name: Set up yq
        # GitHub made an unprofessional decision to not provide it in their Windows VMs,
        # see https://github.com/actions/runner-images/issues/7443.
        if: ${{ startsWith(inputs.host-platform, 'win') }}
        env:
          YQ_VERSION: v4.52.5
          YQ_SHA256: 47594981f3848a4b4447494adeca9555f908f7cf0a89c4da3fd0243a4631da1c
          YQ_DIR: yq
        shell: pwsh -command ". '{0}'"
        run: |
          $yqUrl = "https://github.com/mikefarah/yq/releases/download/${env:YQ_VERSION}/yq_windows_amd64.exe"
          mkdir -Force -ErrorAction SilentlyContinue "${env:YQ_DIR}" | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile "${env:YQ_DIR}/yq.exe" -Uri "$yqUrl"
          $hash = (Get-FileHash -Algorithm SHA256 "${env:YQ_DIR}/yq.exe").Hash.ToLower()
          if ($hash -ne $env:YQ_SHA256) {
            Write-Error "SHA256 mismatch for yq: expected $env:YQ_SHA256, got $hash"
            exit 1
          }
          ls -l $env:YQ_DIR
          echo "$((Get-Location).Path)\\$env:YQ_DIR" >> $env:GITHUB_PATH
          $env:Path += ";$((Get-Location).Path)\\$env:YQ_DIR"
          yq --version

      - name: Set environment variables
        env:
          CUDA_VER: ${{ inputs.cuda-version }}
          HOST_PLATFORM: ${{ inputs.host-platform }}
          PY_VER: ${{ matrix.python-version }}
          SHA: ${{ github.sha }}
        run: ./ci/tools/env-vars build

      - name: Dump environment
        run: |
          env

      - name: Install externally managed build tools
        run: python -m pip install "cibuildwheel==4.1.1" twine wheel

      - name: Set up mini CTK
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ inputs.cuda-version }}

      - name: Build current wheels with Moon
        env:
          CUDA_PYTHON_USE_STAGED_BINDINGS_VERSION: "1"
          CUDA_PYTHON_LANE: ${{ inputs.host-platform }}-py${{ matrix.python-version }}-cuda${{ inputs.cuda-version }}
          MOON_BASE: ${{ inputs.moon-base }}
          MOON_HEAD: ${{ github.sha }}
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_BEFORE_BUILD_LINUX: 'python -m pip install --upgrade "pip>=25.3"'
          CIBW_BEFORE_BUILD_WINDOWS: 'python -m pip install --upgrade "pip>=25.3" delvewheel'
          # TODO: remove cpython-prerelease once 3.15 is officially supported
          # Allow CPython pre-release builds (currently 3.15 / 3.15t). This is a
          # no-op for stable Python versions because CIBW_BUILD still filters
          # the target version.
          CIBW_ENABLE: cpython-prerelease
          # CIBW mounts the host filesystem under /host
          CIBW_ENVIRONMENT_LINUX: >
            CUDA_PATH=/host/${{ env.CUDA_PATH }}
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
            CC="/host/${{ env.SCCACHE_PATH }} cc"
            CXX="/host/${{ env.SCCACHE_PATH }} c++"
            SCCACHE_GHA_ENABLED=true
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RUNTIME_URL=${{ env.ACTIONS_RUNTIME_URL }}
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_CACHE_URL=${{ env.ACTIONS_CACHE_URL }}
            ACTIONS_CACHE_SERVICE_V2=${{ env.ACTIONS_CACHE_SERVICE_V2 }}
            SCCACHE_DIR=/host/${{ env.SCCACHE_DIR }}
            SCCACHE_CACHE_SIZE=${{ env.SCCACHE_CACHE_SIZE }}
          CIBW_ENVIRONMENT_WINDOWS: >
            CUDA_PATH="$(cygpath -w ${{ env.CUDA_PATH }})"
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
          CIBW_BEFORE_TEST_LINUX: '"/host/${{ env.SCCACHE_PATH }}" --show-adv-stats'
          # Run the test stage so the sccache summary hook is not skipped.
          CIBW_TEST_COMMAND: 'echo "ok!"'
        run: |
          args=()
          if [[ "${{ inputs.force-all }}" == "true" ]]; then
            args+=(--force)
          fi
          # Moon owns the pathfinder -> bindings -> core build chain.
          moon ci core:wheel-current --upstream deep --downstream none "${args[@]}"
          # The metapackage is needed only in the Linux/Python 3.12 lane used
          # by docs and release publication. Run it after bindings so its exact
          # development pin is derived from the wheel that this lane produced.
          if [[ "${{ inputs.host-platform }}" == "linux-64" &&
                "${{ matrix.python-version-formatted }}" == "312" ]]; then
            moon ci metapackage:wheel-pure --upstream none --downstream none "${args[@]}"
          fi

      - name: Set up Python
        id: setup-python2
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          # TODO: remove allow-prereleases once 3.15 is officially supported
          allow-prereleases: ${{ startsWith(matrix.python-version, '3.15') }}

      - name: Install target-Python build tools
        run: python -m pip install "cibuildwheel==4.1.1" twine wheel

      - name: Enable Scientific Python Nightly Wheels for Python 3.15
        if: ${{ startsWith(matrix.python-version, '3.15') }}
        run: |
          echo "PIP_EXTRA_INDEX_URL=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" >> "$GITHUB_ENV"
          echo "PIP_ONLY_BINARY=numpy" >> "$GITHUB_ENV"

      - name: verify free-threaded build
        if: ${{ endsWith(matrix.python-version, 't') }}
        run: python -c 'import sys; assert not sys._is_gil_enabled()'

      - name: Set up Python include paths
        run: |
          if [[ "${{ inputs.host-platform }}" == linux* ]]; then
            echo "CPLUS_INCLUDE_PATH=${Python3_ROOT_DIR}/include/python${{ matrix.python-version }}" >> $GITHUB_ENV
          elif [[ "${{ inputs.host-platform }}" == win* ]]; then
            echo "CL=/I\"${Python3_ROOT_DIR}\include\python${{ matrix.python-version }}\"" >> $GITHUB_ENV
          fi
          # For caching
          echo "PY_EXT_SUFFIX=$(python -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))")" >> $GITHUB_ENV

      - name: Hide GNU link.exe so Meson finds MSVC link.exe
        if: ${{ startsWith(inputs.host-platform, 'win') }}
        run: |
          if [ -f "/c/Program Files/Git/usr/bin/link.exe" ]; then
            mv "/c/Program Files/Git/usr/bin/link.exe" "/c/Program Files/Git/usr/bin/link.exe.bak"
          fi

      - name: Build target-Python test assets with Moon
        env:
          CUDA_PYTHON_LANE: ${{ inputs.host-platform }}-py${{ matrix.python-version }}-cuda${{ inputs.cuda-version }}
          MOON_BASE: ${{ inputs.moon-base }}
          MOON_HEAD: ${{ github.sha }}
        run: |
          args=()
          if [[ "${{ inputs.force-all }}" == "true" ]]; then
            args+=(--force)
          fi
          # Install the shared test groups before Moon fingerprints the compiler
          # and resolved Cython/NumPy versions for the cached binary outputs.
          moon ci test-helpers:prepare-test-assets --force --upstream none --downstream none
          moon ci bindings:cython-test-assets core:cython-test-assets \
            --upstream none --downstream none "${args[@]}"

      # Note: This overwrites CUDA_PATH etc
      - name: Set up previous mini CTK
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ inputs.prev-cuda-version }}
          cuda-path: "./cuda_toolkit_prev"

      - name: Download cuda.bindings build artifacts from the prior branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! (command -v gh 2>&1 >/dev/null); then
            # See https://github.com/cli/cli/blob/trunk/docs/install_linux.md#debian-ubuntu-linux-raspberry-pi-os-apt.
            # gh is needed for artifact fetching.
            mkdir -p -m 755 /etc/apt/keyrings \
                  && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                  && cat $out | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && apt update \
            && apt install gh -y
          fi

          OLD_BRANCH=$(yq '.backport_branch' ci/versions.yml)
          OLD_BASENAME="cuda-bindings-python${PYTHON_VERSION_FORMATTED}-cuda*-${{ inputs.host-platform }}*"
          LATEST_PRIOR_RUN_ID=$(./ci/tools/lookup-run-id --branch "${OLD_BRANCH}" NVIDIA/cuda-python "CI")
          PREV_BINDINGS_DIR="cuda_bindings/.moon-out/wheel-previous"

          gh run download $LATEST_PRIOR_RUN_ID -p ${OLD_BASENAME} -R NVIDIA/cuda-python
          rm -rf ${OLD_BASENAME}-tests  # exclude cython test artifacts
          ls -al $OLD_BASENAME
          rm -rf "${PREV_BINDINGS_DIR}"
          mkdir -p "${PREV_BINDINGS_DIR}"
          mv $OLD_BASENAME/*.whl "${PREV_BINDINGS_DIR}"
          rmdir $OLD_BASENAME

      - name: Build previous-CTK outputs and merge wheels with Moon
        env:
          CUDA_PYTHON_LANE: ${{ inputs.host-platform }}-py${{ matrix.python-version }}-cuda${{ inputs.prev-cuda-version }}
          MOON_BASE: ${{ inputs.moon-base }}
          MOON_HEAD: ${{ github.sha }}
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_BEFORE_BUILD_LINUX: 'python -m pip install --upgrade "pip>=25.3"'
          CIBW_BEFORE_BUILD_WINDOWS: 'python -m pip install --upgrade "pip>=25.3" delvewheel'
          # TODO: remove cpython-prerelease once 3.15 is officially supported
          # Allow CPython pre-release builds (currently 3.15 / 3.15t). This is a
          # no-op for stable Python versions because CIBW_BUILD still filters
          # the target version.
          CIBW_ENABLE: cpython-prerelease
          # CIBW mounts the host filesystem under /host
          CIBW_ENVIRONMENT_LINUX: >
            CUDA_PATH=/host/${{ env.CUDA_PATH }}
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
            CUDA_CORE_BUILD_MAJOR=${{ env.BUILD_PREV_CUDA_MAJOR }}
            CC="/host/${{ env.SCCACHE_PATH }} cc"
            CXX="/host/${{ env.SCCACHE_PATH }} c++"
            SCCACHE_GHA_ENABLED=true
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RUNTIME_URL=${{ env.ACTIONS_RUNTIME_URL }}
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_CACHE_URL=${{ env.ACTIONS_CACHE_URL }}
            ACTIONS_CACHE_SERVICE_V2=${{ env.ACTIONS_CACHE_SERVICE_V2 }}
            SCCACHE_DIR=/host/${{ env.SCCACHE_DIR }}
            SCCACHE_CACHE_SIZE=${{ env.SCCACHE_CACHE_SIZE }}
          CIBW_ENVIRONMENT_WINDOWS: >
            CUDA_PATH="$(cygpath -w ${{ env.CUDA_PATH }})"
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
          CIBW_BEFORE_TEST_LINUX: '"/host/${{ env.SCCACHE_PATH }}" --show-adv-stats'
          CIBW_TEST_COMMAND: 'echo "ok!"'
        run: |
          args=()
          if [[ "${{ inputs.force-all }}" == "true" ]]; then
            args+=(--force)
          fi
          # The previous-CTK wheel and test binaries are independent, so Moon
          # builds them in parallel. The merge then consumes the selected or
          # restored current and previous wheel outputs.
          moon ci core:wheel-previous core:test-binaries --upstream none --downstream none "${args[@]}"
          moon ci core:wheel-merge --upstream none --downstream none "${args[@]}"

      - name: Validate native lane outputs
        run: |
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            CHOWN=chown
          else
            CHOWN="sudo chown"
          fi
          $CHOWN -R "$(whoami)" \
            cuda_pathfinder/.moon-out cuda_bindings/.moon-out cuda_core/.moon-out
          test "$(find cuda_pathfinder/.moon-out/wheel-pure -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
          test "$(find cuda_bindings/.moon-out/wheel-current -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
          test "$(find cuda_core/.moon-out/wheel-merged -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
          wheels=(
            cuda_pathfinder/.moon-out/wheel-pure/*.whl
            cuda_bindings/.moon-out/wheel-current/*.whl
            cuda_core/.moon-out/wheel-merged/*.whl
          )
          if [[ "${{ inputs.host-platform }}" == "linux-64" &&
                "${{ matrix.python-version-formatted }}" == "312" ]]; then
            $CHOWN -R "$(whoami)" cuda_python/.moon-out
            test "$(find cuda_python/.moon-out/wheel-pure -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
            wheels+=(cuda_python/.moon-out/wheel-pure/*.whl)
          fi
          twine check --strict "${wheels[@]}"

      # Release tooling consumes stable component artifact names. Publish the
      # universal wheels once instead of racing every native matrix row.
      - name: Upload cuda.pathfinder wheel
        if: ${{ inputs.host-platform == 'linux-64' && matrix.python-version-formatted == '312' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cuda-pathfinder-wheel
          path: cuda_pathfinder/.moon-out/wheel-pure/*.whl
          if-no-files-found: error
          overwrite: true

      - name: Upload cuda-python metapackage wheel
        if: ${{ inputs.host-platform == 'linux-64' && matrix.python-version-formatted == '312' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cuda-python-wheel
          path: cuda_python/.moon-out/wheel-pure/*.whl
          if-no-files-found: error
          overwrite: true

      - name: Upload cuda.bindings build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_BINDINGS_ARTIFACT_NAME }}
          path: cuda_bindings/.moon-out/wheel-current/*.whl
          if-no-files-found: error
          overwrite: true

      - name: Upload cuda.bindings Cython tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_BINDINGS_ARTIFACT_NAME }}-tests
          path: cuda_bindings/.moon-out/cython-tests/test_*${{ env.PY_EXT_SUFFIX }}
          if-no-files-found: error
          overwrite: true

      - name: Upload cuda.core Cython tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_NAME }}-tests
          path: cuda_core/.moon-out/cython-tests/test_*${{ env.PY_EXT_SUFFIX }}
          if-no-files-found: error
          overwrite: true

      - name: Upload cuda.core test binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_NAME }}-test-binaries
          path: |
            cuda_core/.moon-out/test-binaries/*.o
            cuda_core/.moon-out/test-binaries/*.a
            cuda_core/.moon-out/test-binaries/*.lib
          if-no-files-found: error
          overwrite: true

      - name: Upload cuda.core build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_NAME }}
          path: cuda_core/.moon-out/wheel-merged/*.whl
          if-no-files-found: error
          overwrite: true

      - name: Upload native Moon lane
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: moon-lane-build-${{ inputs.host-platform }}-py${{ matrix.python-version-formatted }}
          path: |
            .moon/cache/hashes
            .moon/cache/outputs
            cuda_pathfinder/.moon-out/wheel-pure
            cuda_python/.moon-out/wheel-pure
            cuda_bindings/.moon-out/wheel-current
            cuda_bindings/.moon-out/cython-tests
            cuda_core/.moon-out/wheel-current
            cuda_core/.moon-out/wheel-previous
            cuda_core/.moon-out/wheel-merged
            cuda_core/.moon-out/cython-tests
            cuda_core/.moon-out/test-binaries
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 30
