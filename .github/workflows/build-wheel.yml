on:
  workflow_call:
    inputs:
      host-platform:
        required: true
        type: string
      cuda-version:
        required: true
        type: string
      prev-cuda-version:
        required: true
        type: string
      workplan:
        description: JSON workplan. An empty value builds and tests everything.
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  actions: read
  contents: read  # This is required for actions/checkout

jobs:
  build:
    env:
      WHEEL_FOUNDATION_TARGETS: ${{ inputs.workplan != '' && toJSON(fromJSON(inputs.workplan).targets['ci-wheel-foundation']) || '["pathfinder:wheel"]' }}
      WHEEL_BINDINGS_TARGETS: ${{ inputs.workplan != '' && toJSON(fromJSON(inputs.workplan).targets['ci-wheel-bindings']) || '["bindings:wheel"]' }}
      WHEEL_CONSUMER_TARGETS: ${{ inputs.workplan != '' && toJSON(fromJSON(inputs.workplan).targets['ci-wheel-consumers']) || '["core:wheel","metapackage:wheel"]' }}
      WHEEL_MULTI_CTK_TARGETS: ${{ inputs.workplan != '' && toJSON(fromJSON(inputs.workplan).targets['ci-wheel-multi-ctk']) || '["core:wheel"]' }}
      WHEEL_FINALIZE_TARGETS: ${{ inputs.workplan != '' && toJSON(fromJSON(inputs.workplan).targets['ci-wheel-finalize']) || '["core:wheel-merge"]' }}
      TEST_ASSETS_CURRENT_TARGETS: ${{ inputs.workplan != '' && toJSON(fromJSON(inputs.workplan).targets['ci-test-assets-current']) || '["bindings:ci-test-assets","core:ci-test-assets"]' }}
      TEST_ASSETS_PREVIOUS_TARGETS: ${{ inputs.workplan != '' && toJSON(fromJSON(inputs.workplan).targets['ci-test-assets-previous']) || '["core:ci-test-binaries"]' }}
      TEST_LINUX_TARGETS: ${{ inputs.workplan != '' && toJSON(fromJSON(inputs.workplan).targets['ci-test-linux']) || '["pathfinder:ci-test-linux"]' }}
      TEST_WINDOWS_TARGETS: ${{ inputs.workplan != '' && toJSON(fromJSON(inputs.workplan).targets['ci-test-windows']) || '["pathfinder:ci-test-windows"]' }}
      HOST_PLATFORM: ${{ inputs.host-platform }}
      BASELINE_RUN_ID: ${{ inputs.workplan != '' && fromJSON(inputs.workplan).baseline.run_id || '' }}
      BASELINE_SHA: ${{ inputs.workplan != '' && fromJSON(inputs.workplan).baseline.sha || '' }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    name: py${{ matrix.python-version }}
    runs-on: ${{ (inputs.host-platform == 'linux-64' && 'linux-amd64-cpu8') ||
                 (inputs.host-platform == 'linux-aarch64' && 'linux-arm64-cpu8') ||
                 (inputs.host-platform == 'win-64' && 'windows-2022') }}
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Treeless clone: setuptools-scm needs the commit graph (`git describe`)
          # but not historical blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Install target resolver dependencies
        if: ${{ startsWith(inputs.host-platform, 'linux') }}
        uses: ./.github/actions/install_unix_deps
        with:
          dependencies: "jq"
          dependent_exes: "jq"

      - name: Resolve Moon phase targets
        run: |
          for value in \
            "$WHEEL_FOUNDATION_TARGETS" \
            "$WHEEL_BINDINGS_TARGETS" \
            "$WHEEL_CONSUMER_TARGETS" \
            "$WHEEL_MULTI_CTK_TARGETS" \
            "$WHEEL_FINALIZE_TARGETS" \
            "$TEST_ASSETS_CURRENT_TARGETS" \
            "$TEST_ASSETS_PREVIOUS_TARGETS" \
            "$TEST_LINUX_TARGETS" \
            "$TEST_WINDOWS_TARGETS"; do
            jq -e 'type == "array" and all(.[]; type == "string")' <<< "$value" >/dev/null
          done

          has_target() {
            jq -e --arg target "$2" 'index($target) != null' <<< "$1" >/dev/null
          }
          if [[ "$HOST_PLATFORM" == "win-64" ]]; then
            platform_test_targets="$TEST_WINDOWS_TARGETS"
          else
            platform_test_targets="$TEST_LINUX_TARGETS"
          fi
          run_test_assets=$(jq -r 'length > 0' <<< "$platform_test_targets")
          {
            echo "BUILD_PATHFINDER=$(has_target "$WHEEL_FOUNDATION_TARGETS" pathfinder:wheel && echo true || echo false)"
            echo "BUILD_BINDINGS=$(has_target "$WHEEL_BINDINGS_TARGETS" bindings:wheel && echo true || echo false)"
            echo "BUILD_CORE_CURRENT=$(has_target "$WHEEL_CONSUMER_TARGETS" core:wheel && echo true || echo false)"
            echo "BUILD_CORE_PREVIOUS=$(has_target "$WHEEL_MULTI_CTK_TARGETS" core:wheel && echo true || echo false)"
            echo "FINALIZE_CORE=$(has_target "$WHEEL_FINALIZE_TARGETS" core:wheel-merge && echo true || echo false)"
            if has_target "$WHEEL_CONSUMER_TARGETS" core:wheel || \
               has_target "$WHEEL_MULTI_CTK_TARGETS" core:wheel || \
               has_target "$WHEEL_FINALIZE_TARGETS" core:wheel-merge; then
              echo "BUILD_CORE=true"
            else
              echo "BUILD_CORE=false"
            fi
            echo "BUILD_PYTHON=$(has_target "$WHEEL_CONSUMER_TARGETS" metapackage:wheel && echo true || echo false)"
            echo "TEST_BINDINGS=$(if [[ "$run_test_assets" == "true" ]]; then has_target "$TEST_ASSETS_CURRENT_TARGETS" bindings:ci-test-assets && echo true || echo false; else echo false; fi)"
            echo "TEST_CORE_CURRENT=$(if [[ "$run_test_assets" == "true" ]]; then has_target "$TEST_ASSETS_CURRENT_TARGETS" core:ci-test-assets && echo true || echo false; else echo false; fi)"
            echo "TEST_CORE_PREVIOUS=$(if [[ "$run_test_assets" == "true" ]]; then has_target "$TEST_ASSETS_PREVIOUS_TARGETS" core:ci-test-binaries && echo true || echo false; else echo false; fi)"
            if [[ "$run_test_assets" == "true" ]] && \
               (has_target "$TEST_ASSETS_CURRENT_TARGETS" core:ci-test-assets || \
                has_target "$TEST_ASSETS_PREVIOUS_TARGETS" core:ci-test-binaries); then
              echo "TEST_CORE=true"
            else
              echo "TEST_CORE=false"
            fi
          } >> "$GITHUB_ENV"

      - name: Install latest rapidsai/sccache
        if: ${{ startsWith(inputs.host-platform, 'linux') && (env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true') }}
        run: |
          curl -fsSL "https://github.com/rapidsai/sccache/releases/latest/download/sccache-$(uname -m)-unknown-linux-musl.tar.gz" \
            | sudo tar -C /usr/local/bin -xvzf - --wildcards --strip-components=1 -x '*/sccache'
          echo "SCCACHE_PATH=/usr/local/bin/sccache" >> "$GITHUB_ENV"

      # xref: https://github.com/orgs/community/discussions/42856#discussioncomment-7678867
      - name: Adding addtional GHA cache-related env vars
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env['ACTIONS_RUNTIME_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - name: Setup proxy cache
        uses: nv-gha-runners/setup-proxy-cache@main
        continue-on-error: true
        # Skip cache on GitHub-hosted Windows runners.
        if: ${{ inputs.host-platform != 'win-64' }}
        with:
          enable-apt: true

      - name: Set up Python
        id: setup-python1
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          # WAR: setup-python is not relocatable, and cibuildwheel hard-wires to 3.12...
          # see https://github.com/actions/setup-python/issues/871
          python-version: "3.12"

      - name: Install Moon and build tools
        run: |
          curl -fsSL "https://github.com/moonrepo/moon/releases/download/v2.5.1/moon_cli-installer.sh" | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          python -m pip install cibuildwheel twine wheel

      - name: Set up MSVC
        if: ${{ startsWith(inputs.host-platform, 'win') && (env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' || env.TEST_BINDINGS == 'true' || env.TEST_CORE == 'true') }}
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4  # v1.13.1

      - name: Set up yq
        # GitHub made an unprofessional decision to not provide it in their Windows VMs,
        # see https://github.com/actions/runner-images/issues/7443.
        if: ${{ startsWith(inputs.host-platform, 'win') && env.BUILD_CORE == 'true' }}
        env:
          YQ_VERSION: v4.52.5
          YQ_SHA256: 47594981f3848a4b4447494adeca9555f908f7cf0a89c4da3fd0243a4631da1c
          YQ_DIR: yq
        shell: pwsh -command ". '{0}'"
        run: |
          $yqUrl = "https://github.com/mikefarah/yq/releases/download/${env:YQ_VERSION}/yq_windows_amd64.exe"
          mkdir -Force -ErrorAction SilentlyContinue "${env:YQ_DIR}" | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile "${env:YQ_DIR}/yq.exe" -Uri "$yqUrl"
          $hash = (Get-FileHash -Algorithm SHA256 "${env:YQ_DIR}/yq.exe").Hash.ToLower()
          if ($hash -ne $env:YQ_SHA256) {
            Write-Error "SHA256 mismatch for yq: expected $env:YQ_SHA256, got $hash"
            exit 1
          }
          ls -l $env:YQ_DIR
          echo "$((Get-Location).Path)\\$env:YQ_DIR" >> $env:GITHUB_PATH
          $env:Path += ";$((Get-Location).Path)\\$env:YQ_DIR"
          yq --version

      - name: Set environment variables
        env:
          CUDA_VER: ${{ inputs.cuda-version }}
          HOST_PLATFORM: ${{ inputs.host-platform }}
          PY_VER: ${{ matrix.python-version }}
          SHA: ${{ github.sha }}
        run: ./ci/tools/env-vars build

      - name: Dump environment
        run: |
          env

      # To keep the build workflow simple, all matrix jobs will build a wheel for later use within this workflow.
      - name: Build and check cuda.pathfinder wheel
        if: ${{ env.BUILD_PATHFINDER == 'true' }}
        run: |
          mapfile -t targets < <(jq -r '.[]' <<< "$WHEEL_FOUNDATION_TARGETS")
          moon run "${targets[@]}" --upstream none --downstream none

      - name: Download reusable cuda.pathfinder wheel
        if: ${{ env.BUILD_PATHFINDER != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cuda-pathfinder-wheel
          path: cuda_pathfinder/dist
          github-token: ${{ github.token }}
          run-id: ${{ env.BASELINE_RUN_ID }}

      - name: List the cuda.pathfinder artifacts directory
        run: |
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            export CHOWN=chown
          else
            export CHOWN="sudo chown"
          fi
          $CHOWN -R $(whoami) cuda_pathfinder/dist/*.whl
          ls -lahR cuda_pathfinder/dist

      # We only need/want a single pure python wheel, pick linux-64 index 0.
      # This is what we will use for testing & releasing.
      - name: Check cuda.pathfinder wheel
        if: ${{ env.BUILD_PATHFINDER == 'true' && strategy.job-index == 0 && inputs.host-platform == 'linux-64' }}
        run: |
          twine check --strict cuda_pathfinder/dist/*.whl

      - name: Constrain builds to the local cuda.pathfinder wheel
        if: ${{ env.BUILD_BINDINGS == 'true' }}
        run: |
          pathfinder_wheels=(cuda_pathfinder/dist/cuda_pathfinder-*.whl)
          test "${#pathfinder_wheels[@]}" -eq 1
          test -f "${pathfinder_wheels[0]}"
          mkdir -p wheel-constraints
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            pathfinder_uri="file:///$(cygpath -am "${pathfinder_wheels[0]}")"
          else
            pathfinder_uri="file:///host$(realpath "${pathfinder_wheels[0]}")"
          fi
          printf 'cuda-pathfinder @ %s\n' "${pathfinder_uri}" | tee wheel-constraints/cuda-bindings.txt

      - name: Upload cuda.pathfinder build artifacts
        if: ${{ strategy.job-index == 0 && inputs.host-platform == 'linux-64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cuda-pathfinder-wheel
          path: cuda_pathfinder/dist/*.whl
          if-no-files-found: error

      - name: Set up mini CTK
        if: ${{ env.BUILD_BINDINGS == 'true' || env.BUILD_CORE == 'true' || env.TEST_BINDINGS == 'true' || env.TEST_CORE == 'true' }}
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ inputs.cuda-version }}

      - name: Build cuda.bindings wheel
        if: ${{ env.BUILD_BINDINGS == 'true' }}
        run: |
          mapfile -t targets < <(jq -r '.[]' <<< "$WHEEL_BINDINGS_TARGETS")
          moon run "${targets[@]}" --upstream none --downstream none
        env:
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_BEFORE_BUILD_LINUX: 'python -m pip install --upgrade "pip>=25.3"'
          CIBW_BEFORE_BUILD_WINDOWS: 'python -m pip install --upgrade "pip>=25.3" delvewheel'
          # TODO: remove cpython-prerelease once 3.15 is officially supported
          # Allow CPython pre-release builds (currently 3.15 / 3.15t). This is a
          # no-op for stable Python versions because CIBW_BUILD still filters
          # the target version.
          CIBW_ENABLE: cpython-prerelease
          # CIBW mounts the host filesystem under /host
          CIBW_ENVIRONMENT_LINUX: >
            CUDA_PATH=/host/${{ env.CUDA_PATH }}
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
            PIP_BUILD_CONSTRAINT=/host/${{ github.workspace }}/wheel-constraints/cuda-bindings.txt
            PIP_CONSTRAINT=/host/${{ github.workspace }}/wheel-constraints/cuda-bindings.txt
            CC="/host/${{ env.SCCACHE_PATH }} cc"
            CXX="/host/${{ env.SCCACHE_PATH }} c++"
            SCCACHE_GHA_ENABLED=true
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RUNTIME_URL=${{ env.ACTIONS_RUNTIME_URL }}
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_CACHE_URL=${{ env.ACTIONS_CACHE_URL }}
            ACTIONS_CACHE_SERVICE_V2=${{ env.ACTIONS_CACHE_SERVICE_V2 }}
            SCCACHE_DIR=/host/${{ env.SCCACHE_DIR }}
            SCCACHE_CACHE_SIZE=${{ env.SCCACHE_CACHE_SIZE }}
          CIBW_ENVIRONMENT_WINDOWS: >
            CUDA_PATH="$(cygpath -w ${{ env.CUDA_PATH }})"
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
            PIP_BUILD_CONSTRAINT="$(cygpath -w ./wheel-constraints/cuda-bindings.txt)"
            PIP_CONSTRAINT="$(cygpath -w ./wheel-constraints/cuda-bindings.txt)"
          # check cache stats before leaving cibuildwheel
          CIBW_BEFORE_TEST_LINUX: >
            "/host/${{ env.SCCACHE_PATH }}" --show-adv-stats &&
            "/host/${{ env.SCCACHE_PATH }}" --show-stats --stats-format=json > /host/${{ github.workspace }}/sccache_bindings.json
          # force the test stage to be run (so that before-test is not skipped)
          # TODO: we might want to think twice on adding this, it does a lot of
          # things before reaching this command.
          CIBW_TEST_COMMAND: >
            echo "ok!"

      - name: Report sccache stats (cuda.bindings)
        if: ${{ env.BUILD_BINDINGS == 'true' && inputs.host-platform != 'win-64' }}
        uses: ./.github/actions/sccache-summary
        with:
          json-file: sccache_bindings.json
          label: "cuda.bindings"
          build-step: "Build cuda.bindings wheel"

      - name: Download reusable cuda.bindings wheel
        if: ${{ env.BUILD_BINDINGS != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_BINDINGS_ARTIFACT_BASENAME }}-${{ env.BASELINE_SHA }}
          path: ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.BASELINE_RUN_ID }}

      - name: List the cuda.bindings artifacts directory
        run: |
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            export CHOWN=chown
          else
            export CHOWN="sudo chown"
          fi
          $CHOWN -R $(whoami) ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}
          ls -lahR ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}

      - name: Check cuda.bindings wheel
        if: ${{ env.BUILD_BINDINGS == 'true' }}
        run: |
          twine check --strict ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}/*.whl

      - name: Constrain cuda.core to the local cuda.bindings wheel
        if: ${{ env.BUILD_CORE_CURRENT == 'true' }}
        run: |
          pathfinder_wheels=(cuda_pathfinder/dist/cuda_pathfinder-*.whl)
          bindings_wheels=("${CUDA_BINDINGS_ARTIFACTS_DIR}"/cuda_bindings-"${BUILD_CUDA_MAJOR}".*.whl)
          test "${#pathfinder_wheels[@]}" -eq 1
          test "${#bindings_wheels[@]}" -eq 1
          test -f "${pathfinder_wheels[0]}"
          test -f "${bindings_wheels[0]}"
          mkdir -p wheel-constraints
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            pathfinder_uri="file:///$(cygpath -am "${pathfinder_wheels[0]}")"
            bindings_uri="file:///$(cygpath -am "${bindings_wheels[0]}")"
          else
            pathfinder_uri="file:///host$(realpath "${pathfinder_wheels[0]}")"
            bindings_uri="file:///host$(realpath "${bindings_wheels[0]}")"
          fi
          {
            printf 'cuda-pathfinder @ %s\n' "${pathfinder_uri}"
            printf 'cuda-bindings @ %s\n' "${bindings_uri}"
          } | tee wheel-constraints/cuda-core.txt

      - name: Upload cuda.bindings build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_BINDINGS_ARTIFACT_NAME }}
          path: ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}/*.whl
          if-no-files-found: error

      - name: Build current-context consumer wheels
        if: ${{ env.BUILD_CORE_CURRENT == 'true' || (env.BUILD_PYTHON == 'true' && strategy.job-index == 0 && inputs.host-platform == 'linux-64') }}
        run: |
          targets="$WHEEL_CONSUMER_TARGETS"
          if [[ "${{ inputs.host-platform }}" != "linux-64" || "${{ strategy.job-index }}" != "0" ]]; then
            targets=$(jq -c 'map(select(. != "metapackage:wheel"))' <<< "$targets")
          fi
          mapfile -t target_args < <(jq -r '.[]' <<< "$targets")
          if (( ${#target_args[@]} != 0 )); then
            moon run "${target_args[@]}" --upstream none --downstream none
          fi
        env:
          CUDA_CORE_BUILD_MAJOR: ${{ env.BUILD_CUDA_MAJOR }}
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_BEFORE_BUILD_LINUX: 'python -m pip install --upgrade "pip>=25.3"'
          CIBW_BEFORE_BUILD_WINDOWS: 'python -m pip install --upgrade "pip>=25.3" delvewheel'
          # TODO: remove cpython-prerelease once 3.15 is officially supported
          # Allow CPython pre-release builds (currently 3.15 / 3.15t). This is a
          # no-op for stable Python versions because CIBW_BUILD still filters
          # the target version.
          CIBW_ENABLE: cpython-prerelease
          # CIBW mounts the host filesystem under /host
          CIBW_ENVIRONMENT_LINUX: >
            CUDA_PATH=/host/${{ env.CUDA_PATH }}
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
            CUDA_CORE_BUILD_MAJOR=${{ env.BUILD_CUDA_MAJOR }}
            PIP_BUILD_CONSTRAINT=/host/${{ github.workspace }}/wheel-constraints/cuda-core.txt
            PIP_CONSTRAINT=/host/${{ github.workspace }}/wheel-constraints/cuda-core.txt
            CC="/host/${{ env.SCCACHE_PATH }} cc"
            CXX="/host/${{ env.SCCACHE_PATH }} c++"
            SCCACHE_GHA_ENABLED=true
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RUNTIME_URL=${{ env.ACTIONS_RUNTIME_URL }}
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_CACHE_URL=${{ env.ACTIONS_CACHE_URL }}
            ACTIONS_CACHE_SERVICE_V2=${{ env.ACTIONS_CACHE_SERVICE_V2 }}
            SCCACHE_DIR=/host/${{ env.SCCACHE_DIR }}
            SCCACHE_CACHE_SIZE=${{ env.SCCACHE_CACHE_SIZE }}
          CIBW_ENVIRONMENT_WINDOWS: >
            CUDA_PATH="$(cygpath -w ${{ env.CUDA_PATH }})"
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
            CUDA_CORE_BUILD_MAJOR=${{ env.BUILD_CUDA_MAJOR }}
            PIP_BUILD_CONSTRAINT="$(cygpath -w ./wheel-constraints/cuda-core.txt)"
            PIP_CONSTRAINT="$(cygpath -w ./wheel-constraints/cuda-core.txt)"
          # check cache stats before leaving cibuildwheel
          CIBW_BEFORE_TEST_LINUX: >
            "/host${{ env.SCCACHE_PATH }}" --show-adv-stats &&
            "/host${{ env.SCCACHE_PATH }}" --show-stats --stats-format=json > /host/${{ github.workspace }}/sccache_core.json
          # force the test stage to be run (so that before-test is not skipped)
          # TODO: we might want to think twice on adding this, it does a lot of
          # things before reaching this command.
          CIBW_TEST_COMMAND: >
            echo "ok!"

      - name: Report sccache stats (cuda.core)
        if: ${{ env.BUILD_CORE_CURRENT == 'true' && inputs.host-platform != 'win-64' }}
        uses: ./.github/actions/sccache-summary
        with:
          json-file: sccache_core.json
          label: "cuda.core"
          build-step: "Build cuda.core wheel"

      - name: List the cuda.core artifacts directory
        if: ${{ env.BUILD_CORE_CURRENT == 'true' }}
        run: |
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            export CHOWN=chown
          else
            export CHOWN="sudo chown"
          fi
          $CHOWN -R $(whoami) ${{ env.CUDA_CORE_ARTIFACTS_DIR }}
          ls -lahR ${{ env.CUDA_CORE_ARTIFACTS_DIR }}

      - name: Download reusable cuda.core wheel
        if: ${{ env.BUILD_CORE != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_BASENAME }}-${{ env.BASELINE_SHA }}
          path: ${{ env.CUDA_CORE_ARTIFACTS_DIR }}
          github-token: ${{ github.token }}
          run-id: ${{ env.BASELINE_RUN_ID }}

      - name: Download reusable cuda-python wheel
        if: ${{ env.BUILD_PYTHON != 'true' && strategy.job-index == 0 && inputs.host-platform == 'linux-64' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cuda-python-wheel
          path: cuda_python/dist
          github-token: ${{ github.token }}
          run-id: ${{ env.BASELINE_RUN_ID }}

      - name: List the cuda-python artifacts directory
        if: ${{ strategy.job-index == 0 && inputs.host-platform == 'linux-64' }}
        run: |
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            export CHOWN=chown
          else
            export CHOWN="sudo chown"
          fi
          $CHOWN -R $(whoami) cuda_python/dist/*.whl
          ls -lahR cuda_python/dist

      - name: Upload cuda-python build artifacts
        if: ${{ strategy.job-index == 0 && inputs.host-platform == 'linux-64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cuda-python-wheel
          path: cuda_python/dist/*.whl
          if-no-files-found: error

      - name: Set up Python
        id: setup-python2
        if: ${{ env.TEST_BINDINGS == 'true' || env.TEST_CORE_CURRENT == 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          # TODO: remove allow-prereleases once 3.15 is officially supported
          allow-prereleases: ${{ startsWith(matrix.python-version, '3.15') }}

      - name: Reinstall build tools for the selected Python
        if: ${{ env.TEST_BINDINGS == 'true' || env.TEST_CORE_CURRENT == 'true' }}
        run: python -m pip install cibuildwheel twine wheel

      - name: Enable Scientific Python Nightly Wheels for Python 3.15
        if: ${{ (env.TEST_BINDINGS == 'true' || env.TEST_CORE_CURRENT == 'true') && startsWith(matrix.python-version, '3.15') }}
        run: |
          echo "PIP_EXTRA_INDEX_URL=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" >> "$GITHUB_ENV"
          echo "PIP_ONLY_BINARY=numpy" >> "$GITHUB_ENV"

      - name: verify free-threaded build
        if: ${{ (env.TEST_BINDINGS == 'true' || env.TEST_CORE_CURRENT == 'true') && endsWith(matrix.python-version, 't') }}
        run: python -c 'import sys; assert not sys._is_gil_enabled()'

      - name: Set up Python include paths
        if: ${{ env.TEST_BINDINGS == 'true' || env.TEST_CORE_CURRENT == 'true' }}
        run: |
          if [[ "${{ inputs.host-platform }}" == linux* ]]; then
            echo "CPLUS_INCLUDE_PATH=${Python3_ROOT_DIR}/include/python${{ matrix.python-version }}" >> $GITHUB_ENV
          elif [[ "${{ inputs.host-platform }}" == win* ]]; then
            echo "CL=/I\"${Python3_ROOT_DIR}\include\python${{ matrix.python-version }}\"" >> $GITHUB_ENV
          fi
          # For caching
          echo "PY_EXT_SUFFIX=$(python -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))")" >> $GITHUB_ENV

      - name: Install cuda.pathfinder (required for next step)
        if: ${{ env.TEST_BINDINGS == 'true' || env.TEST_CORE_CURRENT == 'true' }}
        run: |
          pip install cuda_pathfinder/dist/*.whl

      - name: Hide GNU link.exe so Meson finds MSVC link.exe
        if: ${{ startsWith(inputs.host-platform, 'win') && (env.TEST_BINDINGS == 'true' || env.TEST_CORE_CURRENT == 'true') }}
        run: |
          if [ -f "/c/Program Files/Git/usr/bin/link.exe" ]; then
            mv "/c/Program Files/Git/usr/bin/link.exe" "/c/Program Files/Git/usr/bin/link.exe.bak"
          fi

      - name: Install wheels for current-context native test assets
        if: ${{ env.TEST_BINDINGS == 'true' || env.TEST_CORE_CURRENT == 'true' }}
        run: |
          if [[ "$TEST_BINDINGS" == "true" ]]; then
            pip install ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}/*.whl --group ./cuda_bindings/pyproject.toml:test
          fi
          if [[ "$TEST_CORE_CURRENT" == "true" ]]; then
            pip install ${{ env.CUDA_BINDINGS_ARTIFACTS_DIR }}/*.whl
            if [[ "$BUILD_CORE_CURRENT" == "true" ]]; then
              core_wheel=$(find "${{ env.CUDA_CORE_ARTIFACTS_DIR }}/cu${BUILD_CUDA_MAJOR}" -maxdepth 1 -type f -name '*.whl' -print -quit)
            else
              core_wheel=$(find "${{ env.CUDA_CORE_ARTIFACTS_DIR }}" -maxdepth 1 -type f -name '*.whl' -print -quit)
            fi
            test -n "$core_wheel"
            pip install "$core_wheel" --group ./cuda_core/pyproject.toml:test
          fi

      - name: Build current-context native test assets
        if: ${{ env.TEST_BINDINGS == 'true' || env.TEST_CORE_CURRENT == 'true' }}
        env:
          CUDA_CORE_BUILD_MAJOR: ${{ env.BUILD_CUDA_MAJOR }}
        run: |
          mapfile -t targets < <(jq -r '.[]' <<< "$TEST_ASSETS_CURRENT_TARGETS")
          moon run "${targets[@]}" --upstream direct --downstream none

      - name: Upload cuda.bindings Cython tests
        if: ${{ env.TEST_BINDINGS == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_BINDINGS_ARTIFACT_NAME }}-tests
          path: ${{ env.CUDA_BINDINGS_CYTHON_TESTS_DIR }}/test_*${{ env.PY_EXT_SUFFIX }}
          if-no-files-found: error

      - name: Upload cuda.core Cython tests
        if: ${{ env.TEST_CORE_CURRENT == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_NAME }}-tests
          path: ${{ env.CUDA_CORE_CYTHON_TESTS_DIR }}/test_*${{ env.PY_EXT_SUFFIX }}
          if-no-files-found: error

      # Note: This overwrites CUDA_PATH etc
      - name: Set up mini CTK
        if: ${{ env.BUILD_CORE_PREVIOUS == 'true' || env.TEST_CORE_PREVIOUS == 'true' }}
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ inputs.prev-cuda-version }}
          cuda-path: "./cuda_toolkit_prev"

      - name: Build previous-context native test assets
        if: ${{ env.TEST_CORE_PREVIOUS == 'true' }}
        run: |
          mapfile -t targets < <(jq -r '.[]' <<< "$TEST_ASSETS_PREVIOUS_TARGETS")
          moon run "${targets[@]}" --upstream direct --downstream none

      - name: Upload cuda.core test binaries
        if: ${{ env.TEST_CORE_PREVIOUS == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_NAME }}-test-binaries
          path: |
            ${{ env.CUDA_CORE_TEST_BINARIES_DIR }}/*.o
            ${{ env.CUDA_CORE_TEST_BINARIES_DIR }}/*.a
            ${{ env.CUDA_CORE_TEST_BINARIES_DIR }}/*.lib
          if-no-files-found: error

      - name: Download cuda.bindings build artifacts from the prior branch
        if: ${{ env.BUILD_CORE_PREVIOUS == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! (command -v gh 2>&1 >/dev/null); then
            # See https://github.com/cli/cli/blob/trunk/docs/install_linux.md#debian-ubuntu-linux-raspberry-pi-os-apt.
            # gh is needed for artifact fetching.
            mkdir -p -m 755 /etc/apt/keyrings \
                  && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                  && cat $out | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && apt update \
            && apt install gh -y
          fi

          OLD_BRANCH=$(yq '.backport_branch' ci/versions.yml)
          OLD_ARTIFACT_PATTERN="cuda-bindings-python${PYTHON_VERSION_FORMATTED}-cuda*-${{ inputs.host-platform }}-*[0-9a-f]"
          LATEST_PRIOR_RUN_ID=$(./ci/tools/lookup-run-id \
            --branch "${OLD_BRANCH}" \
            --artifact "${OLD_ARTIFACT_PATTERN}" \
            NVIDIA/cuda-python "CI")
          PREV_BINDINGS_DIR="cuda_bindings/dist-prev"

          gh run download \
            "${LATEST_PRIOR_RUN_ID}" \
            -p "${OLD_ARTIFACT_PATTERN}" \
            -R NVIDIA/cuda-python
          OLD_ARTIFACT_DIR=$(compgen -G "${OLD_ARTIFACT_PATTERN}")
          test -d "${OLD_ARTIFACT_DIR}"
          ls -al "${OLD_ARTIFACT_DIR}"
          mkdir -p "${PREV_BINDINGS_DIR}"
          mv "${OLD_ARTIFACT_DIR}"/*.whl "${PREV_BINDINGS_DIR}"
          rmdir "${OLD_ARTIFACT_DIR}"

      - name: Constrain previous cuda.core to the downloaded cuda.bindings wheel
        if: ${{ env.BUILD_CORE_PREVIOUS == 'true' }}
        run: |
          pathfinder_wheels=(cuda_pathfinder/dist/cuda_pathfinder-*.whl)
          bindings_wheels=(cuda_bindings/dist-prev/cuda_bindings-"${BUILD_PREV_CUDA_MAJOR}".*.whl)
          test "${#pathfinder_wheels[@]}" -eq 1
          test "${#bindings_wheels[@]}" -eq 1
          test -f "${pathfinder_wheels[0]}"
          test -f "${bindings_wheels[0]}"
          mkdir -p wheel-constraints
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            pathfinder_uri="file:///$(cygpath -am "${pathfinder_wheels[0]}")"
            bindings_uri="file:///$(cygpath -am "${bindings_wheels[0]}")"
          else
            pathfinder_uri="file:///host$(realpath "${pathfinder_wheels[0]}")"
            bindings_uri="file:///host$(realpath "${bindings_wheels[0]}")"
          fi
          {
            printf 'cuda-pathfinder @ %s\n' "${pathfinder_uri}"
            printf 'cuda-bindings @ %s\n' "${bindings_uri}"
          } | tee wheel-constraints/cuda-core-prev.txt

      - name: Build previous-context cuda.core wheel
        if: ${{ env.BUILD_CORE_PREVIOUS == 'true' }}
        run: |
          mapfile -t targets < <(jq -r '.[]' <<< "$WHEEL_MULTI_CTK_TARGETS")
          moon run "${targets[@]}" --upstream none --downstream none
        env:
          CUDA_CORE_BUILD_MAJOR: ${{ env.BUILD_PREV_CUDA_MAJOR }}
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_BEFORE_BUILD_LINUX: 'python -m pip install --upgrade "pip>=25.3"'
          CIBW_BEFORE_BUILD_WINDOWS: 'python -m pip install --upgrade "pip>=25.3" delvewheel'
          # TODO: remove cpython-prerelease once 3.15 is officially supported
          # Allow CPython pre-release builds (currently 3.15 / 3.15t). This is a
          # no-op for stable Python versions because CIBW_BUILD still filters
          # the target version.
          CIBW_ENABLE: cpython-prerelease
          # CIBW mounts the host filesystem under /host
          CIBW_ENVIRONMENT_LINUX: >
            CUDA_PATH=/host/${{ env.CUDA_PATH }}
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
            CUDA_CORE_BUILD_MAJOR=${{ env.BUILD_PREV_CUDA_MAJOR }}
            PIP_BUILD_CONSTRAINT=/host/${{ github.workspace }}/wheel-constraints/cuda-core-prev.txt
            PIP_CONSTRAINT=/host/${{ github.workspace }}/wheel-constraints/cuda-core-prev.txt
            CC="/host/${{ env.SCCACHE_PATH }} cc"
            CXX="/host/${{ env.SCCACHE_PATH }} c++"
            SCCACHE_GHA_ENABLED=true
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RUNTIME_URL=${{ env.ACTIONS_RUNTIME_URL }}
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_CACHE_URL=${{ env.ACTIONS_CACHE_URL }}
            ACTIONS_CACHE_SERVICE_V2=${{ env.ACTIONS_CACHE_SERVICE_V2 }}
            SCCACHE_DIR=/host/${{ env.SCCACHE_DIR }}
            SCCACHE_CACHE_SIZE=${{ env.SCCACHE_CACHE_SIZE }}
          CIBW_ENVIRONMENT_WINDOWS: >
            CUDA_PATH="$(cygpath -w ${{ env.CUDA_PATH }})"
            CUDA_PYTHON_PARALLEL_LEVEL=${{ env.CUDA_PYTHON_PARALLEL_LEVEL }}
            CUDA_CORE_BUILD_MAJOR=${{ env.BUILD_PREV_CUDA_MAJOR }}
            PIP_BUILD_CONSTRAINT="$(cygpath -w ./wheel-constraints/cuda-core-prev.txt)"
            PIP_CONSTRAINT="$(cygpath -w ./wheel-constraints/cuda-core-prev.txt)"
          # check cache stats before leaving cibuildwheel
          CIBW_BEFORE_TEST_LINUX: >
            "/host${{ env.SCCACHE_PATH }}" --show-adv-stats &&
            "/host${{ env.SCCACHE_PATH }}" --show-stats --stats-format=json > /host/${{ github.workspace }}/sccache_core_prev.json
          # force the test stage to be run (so that before-test is not skipped)
          # TODO: we might want to think twice on adding this, it does a lot of
          # things before reaching this command.
          CIBW_TEST_COMMAND: >
            echo "ok!"

      - name: Report sccache stats (cuda.core prev)
        if: ${{ env.BUILD_CORE_PREVIOUS == 'true' && inputs.host-platform != 'win-64' }}
        uses: ./.github/actions/sccache-summary
        with:
          json-file: sccache_core_prev.json
          label: "cuda.core (prev CTK)"
          build-step: "Build cuda.core wheel"

      - name: List the previous-context cuda.core artifacts
        if: ${{ env.BUILD_CORE_PREVIOUS == 'true' }}
        run: |
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            export CHOWN=chown
          else
            export CHOWN="sudo chown"
          fi
          $CHOWN -R $(whoami) ${{ env.CUDA_CORE_ARTIFACTS_DIR }}
          ls -lahR ${{ env.CUDA_CORE_ARTIFACTS_DIR }}

      - name: Merge cuda.core wheels
        if: ${{ env.FINALIZE_CORE == 'true' }}
        run: |
          mapfile -t targets < <(jq -r '.[]' <<< "$WHEEL_FINALIZE_TARGETS")
          moon run "${targets[@]}" --upstream none --downstream none

      - name: Check cuda.core wheel
        if: ${{ env.FINALIZE_CORE == 'true' }}
        run: |
          twine check --strict ${{ env.CUDA_CORE_ARTIFACTS_DIR }}/*.whl

      - name: Upload cuda.core build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.CUDA_CORE_ARTIFACT_NAME }}
          path: ${{ env.CUDA_CORE_ARTIFACTS_DIR }}/*.whl
          if-no-files-found: error
