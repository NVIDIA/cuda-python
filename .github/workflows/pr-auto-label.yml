name: "CI: Auto-label PRs by path"

on:
  pull_request_target:
    types:
      - opened
      - synchronize

jobs:
  auto-label:
    name: Auto-label by changed paths
    if: github.repository_owner == 'NVIDIA'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
