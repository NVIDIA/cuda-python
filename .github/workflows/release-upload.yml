name: "CI: Upload git archive"

on:
  workflow_call:
    inputs:
      git-tag:
        type: string
        required: true
      run-id:
        description: "The GHA run ID that generated validated artifacts"
        type: string
        required: true
      component:
        description: "Component to download wheels for"
        type: string
        required: true
      dry-run:
        description: "Validate release artifacts without uploading them to the GitHub release"
        type: boolean
        required: false
        default: false

concurrency:
  # Pathfinder releases are serialized by the caller. Keep their uploads out
  # of the other components' existing cancellation group.
  group: ${{ inputs.component == 'cuda-pathfinder' && format('release-upload-cuda-pathfinder-{0}', github.run_id) || format('{0}-{1}', github.workflow, github.ref_name || github.sha) }}
  cancel-in-progress: ${{ inputs.component != 'cuda-pathfinder' }}

permissions:
  contents: write

jobs:
  # create source archive and upload it to the published release
  # URL to the archive: https://github.com/NVIDIA/<repo>/releases/download/<tag>/<repo>-<tag>.tar.gz
  upload:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ inputs.git-tag }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.git-tag }}

      - name: Checkout Pathfinder Release Tools
        if: ${{ inputs.component == 'cuda-pathfinder' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Older Pathfinder tags may predate release-wheel validation tooling.
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: ci/tools
          persist-credentials: false

      - name: Create Release Directory
        run: mkdir -p release

      - name: Archive Source
        run: >
          git archive
          --format=tar.gz
          --prefix="${{ env.ARCHIVE_NAME }}/"
          --output="release/${{ env.ARCHIVE_NAME }}.tar.gz"
          ${{ inputs.git-tag }}

      - name: Compute Checksum
        run: >
          sha256sum "release/${{ env.ARCHIVE_NAME }}.tar.gz"
          | awk '{print $1}'
          > "release/${{ env.ARCHIVE_NAME }}.tar.gz.sha256sum"

      - name: Upload Archive
        if: ${{ !inputs.dry-run && inputs.component != 'cuda-pathfinder' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload
          --clobber "${{ inputs.git-tag }}"
          --repo "${{ github.repository }}"
          release/*

      - name: Download and Validate Wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOOLS_DIR: ${{ inputs.component == 'cuda-pathfinder' && '.release-tools/ci/tools' || 'ci/tools' }}
        run: |
          # Use the shared script to download wheels
          "${RELEASE_TOOLS_DIR}/download-wheels" "${{ inputs.run-id }}" "${{ inputs.component }}" "${{ github.repository }}" "release/wheels"

          # Validate that release wheels match the expected version from tag.
          "${RELEASE_TOOLS_DIR}/validate-release-wheels" "${{ inputs.git-tag }}" "${{ inputs.component }}" "release/wheels"

      - name: Upload Wheels and Pathfinder Archive
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
        run: |
          if [[ "${COMPONENT}" == "cuda-pathfinder" ]]; then
            gh release upload --clobber "${{ inputs.git-tag }}" --repo "${{ github.repository }}" \
              release/*.tar.gz release/*.sha256sum release/wheels/*.whl
          elif [[ -d "release/wheels" && $(ls -A release/wheels 2>/dev/null | wc -l) -gt 0 ]]; then
            echo "Uploading wheels to release ${{ inputs.git-tag }}"
            gh release upload --clobber "${{ inputs.git-tag }}" --repo "${{ github.repository }}" release/wheels/*
          fi

      - name: Upload dry-run release artifacts
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifacts-dry-run-${{ inputs.component }}-${{ inputs.git-tag }}
          path: release/
          retention-days: 3
