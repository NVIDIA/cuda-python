name: "CI: Upload git archive"

on:
  workflow_call:
    inputs:
      git-tag:
        type: string
        required: true
      run-id:
        description: "The GHA run ID that generated validated artifacts"
        type: string
        required: true
      component:
        description: "Component to download wheels for"
        type: string
        required: true
      dry-run:
        description: "Validate release artifacts without uploading them to the GitHub release"
        type: boolean
        required: false
        default: false
      bindings-package:
        description: "Resolved CUDA bindings package JSON"
        type: string
        required: false
        default: ""

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.ref_name || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # create source archive and upload it to the published release
  # URL to the archive: https://github.com/NVIDIA/<repo>/releases/download/<tag>/<repo>-<tag>.tar.gz
  upload:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ inputs.git-tag }}
      RELEASE_COMPONENT: ${{ inputs.component }}
      RELEASE_GIT_TAG: ${{ inputs.git-tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_RUN_ID: ${{ inputs.run-id }}
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install CI tool dependencies
        run: python -m pip install -r ci/tools/requirements.txt

      - name: Create Release Directory
        run: mkdir -p release

      - name: Archive Source
        run: >
          git archive
          --format=tar.gz
          --prefix="$ARCHIVE_NAME/"
          --output="release/$ARCHIVE_NAME.tar.gz"
          "refs/tags/$RELEASE_GIT_TAG"

      - name: Compute Checksum
        run: >
          sha256sum "release/$ARCHIVE_NAME.tar.gz"
          | awk '{print $1}'
          > "release/$ARCHIVE_NAME.tar.gz.sha256sum"

      - name: Upload Archive
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload
          --clobber "$RELEASE_GIT_TAG"
          --repo "$RELEASE_REPOSITORY"
          release/*

      - name: Download and Validate Wheels
        env:
          BINDINGS_PACKAGE: ${{ inputs.bindings-package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the shared script to download wheels
          ./ci/tools/download-wheels \
            "$RELEASE_RUN_ID" \
            "$RELEASE_COMPONENT" \
            "$RELEASE_REPOSITORY" \
            "release/wheels" \
            "$RELEASE_GIT_TAG" \
            "$BINDINGS_PACKAGE"

          # Validate that release wheels match the expected version from tag.
          python -m ci.tools.validate_release_wheels \
            "$RELEASE_GIT_TAG" \
            "$RELEASE_COMPONENT" \
            "release/wheels" \
            --bindings-package "$BINDINGS_PACKAGE"

      - name: Upload Wheels
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -d "release/wheels" && $(ls -A release/wheels 2>/dev/null | wc -l) -gt 0 ]]; then
            echo "Uploading wheels to release $RELEASE_GIT_TAG"
            gh release upload --clobber "$RELEASE_GIT_TAG" --repo "$RELEASE_REPOSITORY" release/wheels/*
          fi

      - name: Upload dry-run release artifacts
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifacts-dry-run-${{ inputs.component }}-${{ inputs.git-tag }}
          path: release/
          retention-days: 3
