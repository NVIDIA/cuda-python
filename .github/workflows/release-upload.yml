name: "CI: Validate git archive"

on:
  workflow_call:
    inputs:
      git-tag:
        type: string
        required: true
      release-source-sha:
        description: "Exact source commit to archive"
        type: string
        required: true
      run-id:
        description: "The GHA run ID that generated validated artifacts"
        type: string
        required: true
      component:
        description: "Component whose wheels will be validated"
        type: string
        required: true
      bindings-package:
        description: "Resolved CUDA bindings package JSON"
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  upload:
    name: Build and validate dry-run artifacts
    if: ${{ github.repository == 'NVIDIA/cuda-python' }}
    runs-on: ubuntu-latest
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ inputs.git-tag }}
      RELEASE_COMPONENT: ${{ inputs.component }}
      RELEASE_GIT_TAG: ${{ inputs.git-tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_RUN_ID: ${{ inputs.run-id }}
      RELEASE_SOURCE_SHA: ${{ inputs.release-source-sha }}
    steps:
      - name: Checkout release control plane without push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout release source without push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
          path: release-source
          persist-credentials: false
          ref: ${{ inputs.release-source-sha }}

      - name: Create synthetic local release tag for archival metadata
        run: >-
          ./ci/tools/create-synthetic-release-tag
          "$RELEASE_GIT_TAG"
          "$RELEASE_SOURCE_SHA"
          release-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CI tool dependencies
        run: python -m pip install -e ./ci

      - name: Create release directory
        run: mkdir -p release

      - name: Archive synthetic release source
        run: >
          git -C release-source archive
          --format=tar.gz
          --prefix="$ARCHIVE_NAME/"
          --output="$GITHUB_WORKSPACE/release/$ARCHIVE_NAME.tar.gz"
          "refs/tags/$RELEASE_GIT_TAG"

      - name: Verify archived source provenance
        run: |
          metadata=$(tar -xOf \
            "release/$ARCHIVE_NAME.tar.gz" \
            "$ARCHIVE_NAME/.git_archival.txt")
          node=$(sed -n 's/^node: //p' <<< "$metadata")
          ref_names=$(sed -n 's/^ref-names: //p' <<< "$metadata")
          if [[ "$node" != "$RELEASE_SOURCE_SHA" ||
                ", $ref_names, " != *", tag: $RELEASE_GIT_TAG, "* ]]; then
            echo "error: archive metadata does not identify the requested synthetic tag and commit" >&2
            printf '%s\n' "$metadata" >&2
            exit 1
          fi

      - name: Compute checksum
        run: >
          sha256sum "release/$ARCHIVE_NAME.tar.gz"
          | awk '{print $1}'
          > "release/$ARCHIVE_NAME.tar.gz.sha256sum"

      - name: Download and validate wheels
        env:
          BINDINGS_PACKAGE: ${{ inputs.bindings-package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./ci/tools/download-wheels \
            "$RELEASE_RUN_ID" \
            "$RELEASE_COMPONENT" \
            "$RELEASE_REPOSITORY" \
            "release/wheels" \
            "$RELEASE_GIT_TAG" \
            "$BINDINGS_PACKAGE"

          python -m ci.tools.validate_release_wheels \
            "$RELEASE_GIT_TAG" \
            "$RELEASE_COMPONENT" \
            "release/wheels" \
            --bindings-package "$BINDINGS_PACKAGE" \
            --release-source-root release-source

      - name: Upload dry-run release artifacts to this workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifacts-dry-run-${{ inputs.component }}-${{ inputs.git-tag }}
          path: release/
          retention-days: 3

      # This harness intentionally contains no GitHub Release upload step.
