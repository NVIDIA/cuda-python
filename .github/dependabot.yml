version: 2
updates:
  # GitHub Actions updates targeting the default branch (main)
  - package-ecosystem: github-actions
    # "/" covers only .github/workflows/; composite actions must be listed.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Los_Angeles"

    # Keep churn down: only one open PR from this ecosystem at a time
    open-pull-requests-limit: 1

    groups:
      actions-monthly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

    labels: [CI/CD, dependencies]

  # Group monthly hook revision updates, preserving SHA pins and frozen comments.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Los_Angeles"

    open-pull-requests-limit: 1

    # Match hook repositories, leaving additional_dependencies pins unchanged.
    allow:
      - dependency-name: "https://github.com/*"

    groups:
      pre-commit-monthly:
        applies-to: version-updates
        patterns: ["*"]

    labels: [CI/CD, dependencies]

  # CCCL submodule on main.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1

  # GitHub Actions updates targeting the 12.9.x branch
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: "12.9.x"  # keep in sync with backport_branch in ci/versions.yml
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Los_Angeles"

    # Keep churn down: only one open PR from this ecosystem at a time
    open-pull-requests-limit: 1

    groups:
      actions-monthly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

    labels: [CI/CD, dependencies]
