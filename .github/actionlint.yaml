# Self-hosted runner labels used in CI workflows.
# Without this config, actionlint rejects non-GitHub-hosted labels.
self-hosted-runner:
  labels:
    - linux-amd64-cpu8
    - linux-amd64-gpu-l4-latest-1

# GitHub supports queued concurrency runs, but the pinned actionlint parser
# predates this key.
paths:
  ".github/workflows/ci-workflow-health.yml":
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
