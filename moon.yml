$schema: https://moonrepo.dev/schemas/v2/project.json

tasks:
  test:
    deps:
      - 'pathfinder:test'
      - 'bindings:test'
      - 'core:test'
    inputs: []
    options:
      cache: false

  docs:
    script: |
      rm -rf cuda_python/docs/build/html/cuda-bindings cuda_python/docs/build/html/cuda-core cuda_python/docs/build/html/cuda-pathfinder
      mkdir -p cuda_python/docs/build/html/cuda-bindings cuda_python/docs/build/html/cuda-core cuda_python/docs/build/html/cuda-pathfinder
      cp -R cuda_bindings/docs/build/html/. cuda_python/docs/build/html/cuda-bindings/
      cp -R cuda_core/docs/build/html/. cuda_python/docs/build/html/cuda-core/
      cp -R cuda_pathfinder/docs/build/html/. cuda_python/docs/build/html/cuda-pathfinder/
    deps:
      - 'pathfinder:docs'
      - 'bindings:docs'
      - 'core:docs'
      - 'metapackage:docs'
    inputs: []
    options:
      cache: false
    tags: ['ci-docs']

  ci-ignore:
    inputs:
      - '/.agents/**/*'
      - '/.coveragerc'
      - '/.gitattributes'
      - '/.gitignore'
      - '/.github/**/*'
      - '!/.github/actions/**/*'
      - '!/.github/workflows/**/*'
      - '/.mailmap'
      - '/.pre-commit-config.yaml'
      - '/.spdx-ignore'
      - '/**/AGENTS.md'
      - '/**/CLAUDE.md'
      - '/**/pixi.lock'
      - '/**/pixi.toml'
      - '/**/*.md'
      - '/**/*.svg'
      - '!/README.md'
      - '!/cuda_python/README.md'
      - '/context7.json'
      - '/greptile.json'
      - '/LICENSE'
      - '/ruff.toml'
      - '/toolshed/**/*'
    options:
      cache: false
    tags: ['ci-ignore']

  ci-fallback:
    deps:
      - 'pathfinder:wheel'
      - 'bindings:wheel'
      - 'core:wheel'
      - 'metapackage:wheel'
      - 'core:wheel-merge'
      - 'pathfinder:sdist'
      - 'bindings:sdist'
      - 'core:sdist'
      - 'metapackage:sdist'
      - 'pathfinder:ci-test-linux'
      - 'pathfinder:ci-test-windows'
      - 'bindings:ci-test-linux'
      - 'bindings:ci-test-windows'
      - 'bindings:ci-test-assets'
      - 'core:ci-test-linux'
      - 'core:ci-test-windows'
      - 'core:ci-test-assets'
      - 'core:ci-test-binaries'
      - 'metapackage:ci-test-linux'
      - 'metapackage:ci-test-windows'
      - 'core:api-check'
      - 'docs'
    inputs:
      - '/.github/actions/**/*'
      - '/.github/workflows/build-docs.yml'
      - '/.github/workflows/build-wheel.yml'
      - '/.github/workflows/ci-nightly.yml'
      - '/.github/workflows/ci-pixi-source-test.yml'
      - '/.github/workflows/ci.yml'
      - '/.github/workflows/coverage.yml'
      - '/.github/workflows/release*.yml'
      - '/.github/workflows/test-sdist-linux.yml'
      - '/.github/workflows/test-sdist-windows.yml'
      - '/.moon/workspace.yml'
      - '/moon.yml'
      - '/cuda_pathfinder/moon.yml'
      - '/cuda_bindings/moon.yml'
      - '/cuda_core/moon.yml'
      - '/cuda_python/moon.yml'
      - '/ci/tools/env-vars'
      - '/ci/versions.yml'
      - '/pyproject.toml'
      - '/pytest.ini'
      - '/tests/test_moon_ci.py'
    options:
      cache: false
    tags: ['ci-force-all']
