$schema: https://moonrepo.dev/schemas/v2/project.json

language: unknown
layer: automation
dependsOn:
  - id: pathfinder
    scope: development
  - id: bindings
    scope: development
  - id: core
    scope: development
  - id: metapackage
    scope: development
toolchains:
  default: system

taskOptions:
  cache: false
  runInCI: false

tasks:
  test:
    deps:
      - pathfinder:test
      - bindings:test
      - core:test
    inputs: []

  docs:
    deps:
      - pathfinder:docs
      - bindings:docs
      - core:docs
    inputs: []

  docs-ci:
    command: python
    args: [ci/tools/moon_ci.py, docs-assemble]
    deps:
      - target: pathfinder:docs-ci
        cacheStrategy: outputs
      - target: bindings:docs-ci
        cacheStrategy: outputs
      - target: core:docs-ci
        cacheStrategy: outputs
      - target: metapackage:docs-ci
        cacheStrategy: outputs
    inputs:
      - {project: pathfinder, group: package}
      - {project: pathfinder, group: docs}
      - {project: bindings, group: package}
      - {project: bindings, group: docs}
      - {project: core, group: package}
      - {project: core, group: docs}
      - {project: metapackage, group: package}
      - {project: metapackage, group: docs}
      - '/cuda_pathfinder/.moon-out/docs-ci/**/*'
      - '/cuda_bindings/.moon-out/docs-ci/**/*'
      - '/cuda_core/.moon-out/docs-ci/**/*'
      - '/cuda_python/.moon-out/docs-ci/**/*'
      - '/ci/tools/moon_ci.py'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
      - '/.github/workflows/build-docs.yml'
    outputs:
      - '.moon-out/docs'
    tags: [ci-docs, runner-docs]
    type: build
    options:
      os: linux
      runInCI: true

  pure-wheel:
    deps:
      - pathfinder:wheel-pure
      - metapackage:wheel-pure
    inputs: []
