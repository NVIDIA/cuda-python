features:
  - |
    Experimental: A new version of the ``nvrtc`` API is available as ``cuda.bindings._v2.nvrtc``.
    The primary improvements are: (1) raising exceptions rather than returning error codes, (2) uses
    PEP8-compliant naming, and (3) more performance. This API is still experimental and subject to
    change. (#2398)
