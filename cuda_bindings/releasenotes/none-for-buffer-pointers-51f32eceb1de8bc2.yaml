---
features:
  - |
    The following functions now accept ``None`` for their buffer-like pointer argument (an integer
    address or an object supporting the buffer protocol), which is treated as ``NULL``.

    - ``cudla.module_load_from_memory`` (``p_module``)
    - ``nvfatbin.add_cubin``, ``nvfatbin.add_index``, ``nvfatbin.add_ltoir``, ``nvfatbin.add_ptx``,
      ``nvfatbin.add_reloc``, ``nvfatbin.add_tile_ir`` (``code``)
    - ``nvfatbin.get`` (``buffer``)
    - ``nvjitlink.add_data`` (``data``)
    - ``nvjitlink.get_error_log``, ``nvjitlink.get_info_log`` (``log``)
    - ``nvjitlink.get_linked_cubin`` (``cubin``)
    - ``nvjitlink.get_linked_ltoir`` (``ltoir``)
    - ``nvjitlink.get_linked_ptx`` (``ptx``)
    - ``nvvm.add_module_to_program``, ``nvvm.lazy_add_module_to_program``,
      ``nvvm.get_compiled_result``, ``nvvm.get_program_log`` (``buffer``)

    (#2818)
