$schema: https://moonrepo.dev/schemas/v2/project.json

language: unknown
layer: library
tags: [docs-package, installed-test-package, native-package, pixi-package, python-package]
dependsOn:
  - id: pathfinder
    scope: production
  - id: test-helpers
    scope: development
fileGroups:
  package:
    - '.git_archival.txt'
    - 'cuda/**/*'
    - 'build_hooks.py'
    - 'DESCRIPTION.rst'
    - 'LICENSE'
    - 'MANIFEST.in'
    - 'pyproject.toml'
    - 'setup.py'
  benchmarks:
    - '/benchmarks/cuda_bindings/benchmarks/**/*'
    - '/benchmarks/cuda_bindings/runner/**/*'
    - '/benchmarks/cuda_bindings/compare.py'
    - '/benchmarks/cuda_bindings/run_cpp.py'
    - '/benchmarks/cuda_bindings/run_pyperf.py'
    - '/benchmarks/cuda_bindings/pixi.toml'
    - '/benchmarks/cuda_bindings/pixi.lock'
  benchmark-tests:
    - '/benchmarks/cuda_bindings/runner/**/*'
    - '/benchmarks/cuda_bindings/benchmarks/**/*'
    - '/benchmarks/cuda_bindings/tests/**/*'
    - '/benchmarks/cuda_bindings/pixi.toml'
    - '/benchmarks/cuda_bindings/pixi.lock'

tasks:
  wheel-current:
    command: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        reset_directory() {
          local DIRECTORY="$1"
          local ROOT
          ROOT=$(dirname -- "$DIRECTORY")
          if [[ -L "$ROOT" || ( -e "$ROOT" && ! -d "$ROOT" ) ]]; then
            echo "refusing to use non-directory output root: $ROOT" >&2
            exit 1
          fi
          if [[ -L "$DIRECTORY" || ( -e "$DIRECTORY" && ! -d "$DIRECTORY" ) ]]; then
            echo "refusing to replace non-directory output: $DIRECTORY" >&2
            exit 1
          fi
          mkdir -p "$ROOT"
          rm -rf -- "$DIRECTORY"
          mkdir -p "$DIRECTORY"
        }

        OUTPUT=cuda_bindings/.moon-out/wheel-current
        CONSTRAINTS=cuda_bindings/.moon-out/constraints-current
        reset_directory "$OUTPUT"
        reset_directory "$CONSTRAINTS"
        SOURCE_DATE_EPOCH=$(printenv SOURCE_DATE_EPOCH || true)
        export SOURCE_DATE_EPOCH
        [[ -n "$SOURCE_DATE_EPOCH" ]] || SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)

        shopt -s nullglob
        set -- cuda_pathfinder/.moon-out/wheel-pure/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.pathfinder wheel, found $#" >&2
          exit 1
        }
        PATHFINDER_WHEEL=$1

        CONSTRAINT_FILE="$CONSTRAINTS/build.txt"
        cp ci/build-constraints.txt "$CONSTRAINT_FILE"
        HOST_PLATFORM_RESOLVED=$(printenv HOST_PLATFORM || true)
        if [[ -z "$HOST_PLATFORM_RESOLVED" ]]; then
          HOST_PLATFORM_RESOLVED=$(python -c "import platform; print('win-64' if platform.system() == 'Windows' else 'linux-' + platform.machine())")
        fi
        if [[ "$HOST_PLATFORM_RESOLVED" == win* ]]; then
          PATHFINDER_URI=$(python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())" "$PATHFINDER_WHEEL")
          CONSTRAINT_HOST=$(cygpath -w "$(pwd)/$CONSTRAINT_FILE")
          printf 'cuda-pathfinder @ %s\n' "$PATHFINDER_URI" >> "$CONSTRAINT_FILE"
          CIBW_ENVIRONMENT_BASE=$(printenv CIBW_ENVIRONMENT_WINDOWS || true)
          export CIBW_ENVIRONMENT_WINDOWS="$CIBW_ENVIRONMENT_BASE PIP_BUILD_CONSTRAINT=\"$CONSTRAINT_HOST\" PIP_CONSTRAINT=\"$CONSTRAINT_HOST\" SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
        else
          PATHFINDER_URI=$(python -c "from pathlib import Path; import sys; print(Path('/host' + Path(sys.argv[1]).resolve().as_posix()).as_uri())" "$PATHFINDER_WHEEL")
          CONSTRAINT_HOST=$(realpath "$CONSTRAINT_FILE")
          CONSTRAINT_CONTAINER="/host$CONSTRAINT_HOST"
          printf 'cuda-pathfinder @ %s\n' "$PATHFINDER_URI" >> "$CONSTRAINT_FILE"
          CIBW_ENVIRONMENT_BASE=$(printenv CIBW_ENVIRONMENT_LINUX || true)
          export CIBW_ENVIRONMENT_LINUX="$CIBW_ENVIRONMENT_BASE PIP_BUILD_CONSTRAINT=\"$CONSTRAINT_CONTAINER\" PIP_CONSTRAINT=\"$CONSTRAINT_CONTAINER\" SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
        fi
        export PIP_BUILD_CONSTRAINT="$CONSTRAINT_HOST"
        export PIP_CONSTRAINT="$CONSTRAINT_HOST"

        python -m cibuildwheel --output-dir "$OUTPUT" cuda_bindings
        if [[ "$HOST_PLATFORM_RESOLVED" != win* ]] && find "$OUTPUT" ! -user "$(id -u)" -print -quit | grep -q .; then
          command -v sudo >/dev/null || {
            echo "cibuildwheel output is not owned by this user and sudo was not found: $OUTPUT" >&2
            exit 1
          }
          sudo chown -R "$(id -u):$(id -g)" "$OUTPUT"
        fi
        set -- "$OUTPUT"/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.bindings wheel, found $#" >&2
          exit 1
        }
    deps:
      - target: pathfinder:wheel-pure
        cacheStrategy: outputs
    env:
      BUILD_CUDA_VER: '${BUILD_CUDA_VER}'
      CIBW_BUILD: '${CIBW_BUILD}'
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    # Moon 2.5.1 filters each explicitly selected phase before expanding task
    # relations, so keep the upstream source proxy for granular CI calls.
    inputs:
      - {project: pathfinder, group: package}

  sdist:
    command: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        if [[ -L cuda_bindings/.moon-out || ( -e cuda_bindings/.moon-out && ! -d cuda_bindings/.moon-out ) ]]; then
          echo "refusing to use non-directory output root: cuda_bindings/.moon-out" >&2
          exit 1
        fi
        if [[ -L cuda_bindings/.moon-out/sdist || ( -e cuda_bindings/.moon-out/sdist && ! -d cuda_bindings/.moon-out/sdist ) ]]; then
          echo "refusing to replace non-directory output: cuda_bindings/.moon-out/sdist" >&2
          exit 1
        fi
        mkdir -p cuda_bindings/.moon-out
        rm -rf -- cuda_bindings/.moon-out/sdist
        mkdir -p cuda_bindings/.moon-out/sdist
        SOURCE_DATE_EPOCH=$(printenv SOURCE_DATE_EPOCH || true)
        export SOURCE_DATE_EPOCH
        [[ -n "$SOURCE_DATE_EPOCH" ]] || SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)

        shopt -s nullglob
        set -- cuda_pathfinder/.moon-out/sdist/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.pathfinder sdist wheel, found $#" >&2
          exit 1
        }
        PATHFINDER_WHEEL=$1
        CONSTRAINT_FILE=$(mktemp)
        trap 'rm -f "$CONSTRAINT_FILE"' EXIT
        cp ci/build-constraints.txt "$CONSTRAINT_FILE"
        HOST_PLATFORM_RESOLVED=$(printenv HOST_PLATFORM || true)
        if [[ -z "$HOST_PLATFORM_RESOLVED" ]]; then
          HOST_PLATFORM_RESOLVED=$(python -c "import platform; print('win-64' if platform.system() == 'Windows' else 'linux-' + platform.machine())")
        fi
        if [[ "$HOST_PLATFORM_RESOLVED" == win* ]]; then
          PATHFINDER_URI=$(python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())" "$PATHFINDER_WHEEL")
          CONSTRAINT_HOST=$(cygpath -w "$CONSTRAINT_FILE")
        else
          PATHFINDER_URI=$(python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())" "$PATHFINDER_WHEEL")
          CONSTRAINT_HOST=$(realpath "$CONSTRAINT_FILE")
        fi
        printf 'cuda-pathfinder @ %s\n' "$PATHFINDER_URI" >> "$CONSTRAINT_FILE"
        export PIP_BUILD_CONSTRAINT="$CONSTRAINT_HOST"
        export PIP_CONSTRAINT="$CONSTRAINT_HOST"

        python -m build --sdist --outdir cuda_bindings/.moon-out/sdist cuda_bindings
        set -- cuda_bindings/.moon-out/sdist/*.tar.gz
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.bindings source distribution, found $#" >&2
          exit 1
        }
        ARCHIVE=$1
        python -m pip wheel --no-deps \
          --wheel-dir cuda_bindings/.moon-out/sdist "$ARCHIVE"
        set -- cuda_bindings/.moon-out/sdist/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.bindings wheel from source distribution, found $#" >&2
          exit 1
        }
    deps:
      - target: pathfinder:sdist
        cacheStrategy: outputs
    env:
      BUILD_CUDA_VER: '${BUILD_CUDA_VER}'
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    inputs:
      - {project: pathfinder, group: package}

  cython-test-assets:
    command: python
    args:
      - cuda_bindings/tests/cython/build_tests.py
      - --output-dir
      - cuda_bindings/.moon-out/cython-tests
    env:
      PYTHONPATH: cuda_python_test_helpers
    inputs:
      - {project: pathfinder, group: package}
      - '/cuda_pathfinder/.moon-out/wheel-pure/*.whl'
      - '/cuda_bindings/.moon-out/wheel-current/*.whl'
      - '/cuda_python_test_helpers/cuda_python_test_helpers/cython_test_builder.py'

  test:
    inputs:
      - '/cuda_pathfinder/**/*'
      - '/cuda_python_test_helpers/**/*'
      - '/benchmarks/cuda_bindings/**/*'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/tests/**/*'

  bench:
    command: pixi
    args: [run, --manifest-path, benchmarks/cuda_bindings/pixi.toml, --environment, source, bench]
    inputs:
      - '@group(benchmarks)'
      - '/cuda_bindings/**/*'

  smoke:
    command: pixi
    args:
      - run
      - --manifest-path
      - benchmarks/cuda_bindings/pixi.toml
      - --environment
      - source
      - bench-smoke-test
    inputs:
      - '@group(benchmarks)'
      - '/cuda_bindings/**/*'

  smoke-linux:
    script: |
      set -euo pipefail
      SKIP=$(printenv SKIP_CUDA_BINDINGS_TEST || printf 0)
      if [[ "$SKIP" == "1" ]]; then
        echo "Skipping cuda.bindings benchmarks for this declared compatibility lane."
        exit 0
      fi
      shopt -s nullglob
      set -- cuda_pathfinder/.moon-out/wheel-pure/*.whl
      [[ $# -eq 1 ]] || {
        echo "expected one pathfinder wheel, found $#" >&2
        exit 1
      }
      PATHFINDER_WHEEL=$1
      set -- cuda_bindings/.moon-out/wheel-current/*.whl
      [[ $# -eq 1 ]] || {
        echo "expected one bindings wheel, found $#" >&2
        exit 1
      }
      BINDINGS_WHEEL=$1
      python -m pip install \
        "$PATHFINDER_WHEEL" \
        "$BINDINGS_WHEEL" \
        pyperf
      python benchmarks/cuda_bindings/run_pyperf.py --debug-single-value
    inputs:
      - '@group(benchmarks)'
      - '@group(package)'
      - {project: pathfinder, group: package}
      - '/cuda_pathfinder/.moon-out/wheel-pure/*.whl'
      - '/cuda_bindings/.moon-out/wheel-current/*.whl'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/ci/tools/guess_latest.sh'
      - '/ci/tools/install_gpu_driver.sh'
      - '/tests/**/*'
      - '/.github/workflows/test-wheel-linux.yml'
    tags: [ci-test-linux]
    type: test
    options:
      mutex: ci-python-gpu
      os: linux
      runInCI: true
      shell: true

  unit-test:
    command: uvx
    args:
      - --no-managed-python
      - --no-python-downloads
      - --from
      - pytest
      - pytest
      - --noconftest
      - benchmarks/cuda_bindings/tests
    inputs:
      - '@group(benchmark-tests)'
    tags: [ci-quality]
    type: test
    options:
      os: linux
      runInCI: true

  test-installed-linux:
    inputs:
      - '@group(tests)'
      - {project: pathfinder, group: package}
      - '/cuda_python_test_helpers/**/*'
      - '/ci/tools/setup-sanitizer'

  test-installed-windows:
    inputs:
      - '@group(tests)'
      - {project: pathfinder, group: package}
      - '/cuda_python_test_helpers/**/*'

  docs:
    args: [build-docs]
    inputs:
      - {project: pathfinder, group: package}
      - {project: pathfinder, group: docs}

  docs-ci:
    inputs:
      - {project: pathfinder, group: package}
