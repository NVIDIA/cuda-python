$schema: https://moonrepo.dev/schemas/v2/project.json

language: unknown
layer: library
dependsOn:
  - id: pathfinder
    scope: production
  - id: test-helpers
    scope: development
toolchains:
  default: system

taskOptions:
  cache: false
  runFromWorkspaceRoot: true
  runInCI: false

fileGroups:
  package:
    - '.git_archival.txt'
    - 'cuda/**/*'
    - 'build_hooks.py'
    - 'DESCRIPTION.rst'
    - 'LICENSE'
    - 'MANIFEST.in'
    - 'pyproject.toml'
    - 'setup.py'
  tests:
    - 'examples/**/*'
    - 'tests/**/*'
    - 'pixi.toml'
    - 'pixi.lock'
  docs:
    - 'docs/**/*'
    - 'pixi.toml'
    - 'pixi.lock'
  benchmarks:
    - '/benchmarks/cuda_bindings/benchmarks/**/*'
    - '/benchmarks/cuda_bindings/runner/**/*'
    - '/benchmarks/cuda_bindings/compare.py'
    - '/benchmarks/cuda_bindings/run_cpp.py'
    - '/benchmarks/cuda_bindings/run_pyperf.py'
    - '/benchmarks/cuda_bindings/pixi.toml'
    - '/benchmarks/cuda_bindings/pixi.lock'
  benchmark-tests:
    - '/benchmarks/cuda_bindings/runner/**/*'
    - '/benchmarks/cuda_bindings/benchmarks/**/*'
    - '/benchmarks/cuda_bindings/tests/**/*'
    - '/benchmarks/cuda_bindings/pixi.toml'
    - '/benchmarks/cuda_bindings/pixi.lock'

tasks:
  wheel-current:
    command: python
    args: [-m, ci.tools.build_artifacts, native-wheel, bindings, --lane, current]
    env:
      BUILD_CUDA_VER: '${BUILD_CUDA_VER}'
      CIBW_BUILD: '${CIBW_BUILD}'
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    inputs:
      - '@group(package)'
      - {project: pathfinder, group: package}
      - '/cuda_pathfinder/.moon-out/wheel-pure/*.whl'
      - '/ci/tools/artifacts.py'
      - '/ci/tools/build_artifacts.py'
      - '/ci/tools/moon_fingerprint.py'
      - '/ci/tools/env-vars'
      - '/ci/versions.yml'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/wheel-current'
    checks:
      - check: fingerprint
        script: python ci/tools/moon_fingerprint.py bindings native
        hash: stdout
    tags:
      - ci-wheel-current
      - runner-build-linux-64
      - runner-build-linux-aarch64
      - runner-build-windows
    type: build
    options:
      cache: true
      cacheKey: wheel-current-v2
      priority: critical
      runInCI: true

  sdist:
    command: python
    args: [-m, ci.tools.build_artifacts, sdist, bindings]
    deps:
      - target: pathfinder:sdist
        cacheStrategy: outputs
    env:
      BUILD_CUDA_VER: '${BUILD_CUDA_VER}'
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    inputs:
      - '@group(package)'
      - {project: pathfinder, group: package}
      - '/ci/tools/artifacts.py'
      - '/ci/tools/build_artifacts.py'
      - '/ci/tools/moon_fingerprint.py'
      - '/.github/workflows/test-sdist-linux.yml'
      - '/.github/workflows/test-sdist-windows.yml'
    outputs:
      - '.moon-out/sdist'
    checks:
      - check: fingerprint
        script: python ci/tools/moon_fingerprint.py bindings sdist
        hash: stdout
    tags: [ci-sdist, runner-sdist-linux, runner-sdist-windows]
    type: build
    options:
      cache: true
      cacheKey: sdist-v2
      runInCI: true

  cython-test-assets:
    command: bash
    args:
      - cuda_bindings/tests/cython/build_tests.sh
      - --output-dir
      - cuda_bindings/.moon-out/cython-tests
    deps:
      - test-helpers:prepare-test-assets
    inputs:
      - '@group(package)'
      - 'tests/cython/**/*'
      - {project: pathfinder, group: package}
      - '/cuda_pathfinder/.moon-out/wheel-pure/*.whl'
      - '/cuda_bindings/.moon-out/wheel-current/*.whl'
      - '/ci/tools/moon_fingerprint.py'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/cython-tests'
    checks:
      - check: fingerprint
        script: python ci/tools/moon_fingerprint.py bindings test-assets
        hash: stdout
    tags:
      - ci-build-cython-assets
      - runner-build-linux-64
      - runner-build-linux-aarch64
      - runner-build-windows
    type: build
    options:
      cache: true
      cacheKey: cython-test-assets-v2
      os: [linux, windows]
      runInCI: true

  test:
    command: python
    args: [ci/tools/run_pixi_test.py, bindings]
    inputs:
      - '@group(package)'
      - '@group(tests)'
      - '/cuda_pathfinder/**/*'
      - '/cuda_python_test_helpers/**/*'
      - '/benchmarks/cuda_bindings/**/*'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/tests/**/*'
      - '/ci/tools/run_pixi_test.py'
    type: test

  bench:
    command: pixi
    args: [run, --manifest-path, benchmarks/cuda_bindings/pixi.toml, --environment, source, bench]
    inputs:
      - '@group(benchmarks)'
      - '/cuda_bindings/**/*'

  smoke:
    command: pixi
    args:
      - run
      - --manifest-path
      - benchmarks/cuda_bindings/pixi.toml
      - --environment
      - source
      - bench-smoke-test
    inputs:
      - '@group(benchmarks)'
      - '/cuda_bindings/**/*'

  smoke-linux:
    script: |
      set -euo pipefail
      if [[ "${SKIP_CUDA_BINDINGS_TEST:-0}" == "1" ]]; then
        echo "Skipping cuda.bindings benchmarks for this declared compatibility lane."
        exit 0
      fi
      shopt -s nullglob
      pathfinder_wheels=(cuda_pathfinder/.moon-out/wheel-pure/*.whl)
      bindings_wheels=(cuda_bindings/.moon-out/wheel-current/*.whl)
      [[ ${#pathfinder_wheels[@]} -eq 1 ]] || {
        echo "expected one pathfinder wheel, found ${#pathfinder_wheels[@]}" >&2
        exit 1
      }
      [[ ${#bindings_wheels[@]} -eq 1 ]] || {
        echo "expected one bindings wheel, found ${#bindings_wheels[@]}" >&2
        exit 1
      }
      python -m pip install \
        "${pathfinder_wheels[0]}" \
        "${bindings_wheels[0]}" \
        pyperf
      python benchmarks/cuda_bindings/run_pyperf.py --debug-single-value
    inputs:
      - '@group(benchmarks)'
      - '@group(package)'
      - {project: pathfinder, group: package}
      - '/cuda_pathfinder/.moon-out/wheel-pure/*.whl'
      - '/cuda_bindings/.moon-out/wheel-current/*.whl'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/ci/tools/guess_latest.sh'
      - '/ci/tools/install_gpu_driver.sh'
      - '/tests/**/*'
      - '/.github/workflows/test-wheel-linux.yml'
    tags: [ci-test-linux, runner-test-linux]
    type: test
    options:
      mutex: ci-python-gpu
      os: linux
      runInCI: true

  unit-test:
    command: uvx
    args:
      - --no-managed-python
      - --no-python-downloads
      - --from
      - pytest
      - pytest
      - --noconftest
      - benchmarks/cuda_bindings/tests
    inputs:
      - '@group(benchmark-tests)'
    tags: [ci-quality, runner-quality]
    type: test
    options:
      os: linux
      runInCI: true

  test-installed-linux:
    command: bash
    args: [ci/tools/run-tests, bindings]
    inputs:
      - '@group(package)'
      - '@group(tests)'
      - {project: pathfinder, group: package}
      - '/cuda_python_test_helpers/**/*'
      - '/ci/tools/run-tests'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/tests/**/*'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
      - '/ci/tools/guess_latest.sh'
      - '/ci/tools/install_gpu_driver.sh'
      - '/ci/tools/setup-sanitizer'
      - '/.github/workflows/test-wheel-linux.yml'
    tags: [ci-test-linux, runner-test-linux]
    type: test
    options:
      mutex: ci-python-gpu
      os: linux
      runInCI: true

  test-installed-windows:
    command: bash
    args: [ci/tools/run-tests, bindings]
    inputs:
      - '@group(package)'
      - '@group(tests)'
      - {project: pathfinder, group: package}
      - '/cuda_python_test_helpers/**/*'
      - '/ci/tools/run-tests'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/tests/**/*'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
      - '/ci/tools/configure_driver_mode.ps1'
      - '/ci/tools/install_gpu_driver.ps1'
      - '/.github/workflows/test-wheel-windows.yml'
    tags: [ci-test-windows, runner-test-windows]
    type: test
    options:
      mutex: ci-python-gpu
      os: windows
      runInCI: true

  docs:
    command: pixi
    args: [run, --manifest-path, cuda_bindings/pixi.toml, --environment, docs, build-docs]
    inputs:
      - '@group(package)'
      - '@group(docs)'
      - {project: pathfinder, group: package}
      - {project: pathfinder, group: docs}
      - '/.github/workflows/build-docs.yml'

  docs-ci:
    command: bash
    args: [cuda_bindings/docs/build_docs.sh, moon-ci]
    env:
      CUDA_PYTHON_DOCS_LATEST_ONLY: '${CUDA_PYTHON_DOCS_LATEST_ONLY}'
    inputs:
      - '@group(package)'
      - '@group(docs)'
      - {project: pathfinder, group: package}
      - '/cuda_python/docs/environment-docs.yml'
      - '/.github/workflows/build-docs.yml'
    outputs:
      - '.moon-out/docs-ci'
    tags: [ci-docs, runner-docs]
    type: build
    options:
      os: linux
      runInCI: true
