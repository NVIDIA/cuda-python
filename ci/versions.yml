schema_version: 2

# This controls the version of the upstream CTK to install to build the wheels,
# and the compute-sanitizer version used in all sanitizer test runs.
# It is not the version of cuda_bindings/cuda_python being released, which is
# solely determined by git tags via setuptools_scm.
# Each version here, and in every LOCAL_CTK: '1' row of ci/test-matrix.yml,
# needs a pinned manifest hash in KNOWN_REDISTRIB_SHA256 in
# ci/tools/fetch_ctk_redistrib.py; fetch_ctk fails without one.
cuda:
  bindings:
    package_roots:
      cuda_bindings_12:
        toolkit_version: "12.9.1"
        release_status: maintenance
      cuda_bindings_13:
        toolkit_version: "13.5.0"
        release_status: current
python:
  # Shared wheel build matrix, also read from tagged sources during releases.
  supported:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
    - "3.14t"
    - "3.15"
    - "3.15t"
