    command: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        PIXI_ENVIRONMENT=$(printenv PIXI_ENVIRONMENT_NAME || true)
        if [[ -n "$PIXI_ENVIRONMENT" ]]; then
          exec pixi run --manifest-path cuda_core/pixi.toml \
            --environment "$PIXI_ENVIRONMENT" test
        fi
        exec pixi run --manifest-path cuda_core/pixi.toml test
    inputs:
      - '@group(package)'
      - '@group(tests)'
      - '/cuda_pathfinder/**/*'
      - '/cuda_bindings/**/*'
      - '/cuda_python_test_helpers/**/*'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/tests/**/*'
    type: test

