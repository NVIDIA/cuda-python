$schema: https://moonrepo.dev/schemas/v2/project.json

language: unknown
layer: library
tags: [docs-package, installed-test-package, native-package, pixi-package, python-package]
dependsOn:
  - id: pathfinder
    scope: production
  - id: bindings
    scope: production
  - id: test-helpers
    scope: development
fileGroups:
  package:
    - '.git_archival.txt'
    - 'cuda/**/*'
    - 'build_hooks.py'
    - 'DESCRIPTION.rst'
    - 'LICENSE'
    - 'MANIFEST.in'
    - 'NOTICE'
    - 'pyproject.toml'
    - 'setup.py'
tasks:
  fingerprint-package:
    checks:
      - check: fingerprint
        script: >-
          python -c "import subprocess;
          subprocess.run(['git', 'describe', '--always', '--dirty', '--tags', '--long',
          '--match', 'cuda-core-v*[0-9]*'], check=True)"
        hash: stdout
    options:
      mergeChecks: replace

  wheel-current:
    command: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        reset_directory() {
          local DIRECTORY="$1"
          local ROOT
          ROOT=$(dirname -- "$DIRECTORY")
          if [[ -L "$ROOT" || ( -e "$ROOT" && ! -d "$ROOT" ) ]]; then
            echo "refusing to use non-directory output root: $ROOT" >&2
            exit 1
          fi
          if [[ -L "$DIRECTORY" || ( -e "$DIRECTORY" && ! -d "$DIRECTORY" ) ]]; then
            echo "refusing to replace non-directory output: $DIRECTORY" >&2
            exit 1
          fi
          mkdir -p "$ROOT"
          rm -rf -- "$DIRECTORY"
          mkdir -p "$DIRECTORY"
        }

        WHEEL_VARIANT=$(printenv CUDA_PYTHON_WHEEL_VARIANT || true)
        case "$WHEEL_VARIANT" in
          current)
            CUDA_MAJOR=$(printenv BUILD_CUDA_MAJOR || true)
            if [[ -z "$CUDA_MAJOR" ]]; then
              CUDA_VERSION=$(printenv BUILD_CUDA_VER || true)
              if [[ -z "$CUDA_VERSION" ]]; then
                CUDA_VERSION=$(printenv CUDA_VER || true)
              fi
              CUDA_MAJOR=$(cut -d . -f 1 <<< "$CUDA_VERSION")
            fi
            if [[ -z "$CUDA_MAJOR" ]] && command -v nvcc >/dev/null; then
              CUDA_MAJOR=$(nvcc --version | sed -n 's/.*release \([0-9][0-9]*\).*/\1/p' | head -n 1)
            fi
            ERROR_MESSAGE="set BUILD_CUDA_MAJOR/BUILD_CUDA_VER or activate a toolkit with nvcc"
            ;;
          previous)
            CUDA_MAJOR=$(printenv BUILD_PREV_CUDA_MAJOR || true)
            ERROR_MESSAGE="BUILD_PREV_CUDA_MAJOR must be a numeric CUDA major version"
            ;;
          *)
            echo "CUDA_PYTHON_WHEEL_VARIANT must be current or previous" >&2
            exit 1
            ;;
        esac
        [[ "$CUDA_MAJOR" =~ ^[0-9]+$ ]] || {
          echo "$ERROR_MESSAGE" >&2
          exit 1
        }
        OUTPUT="cuda_core/.moon-out/wheel-$WHEEL_VARIANT"
        CONSTRAINTS="cuda_core/.moon-out/constraints-$WHEEL_VARIANT"
        reset_directory "$OUTPUT"
        reset_directory "$CONSTRAINTS"
        SOURCE_DATE_EPOCH=$(printenv SOURCE_DATE_EPOCH || true)
        export SOURCE_DATE_EPOCH
        [[ -n "$SOURCE_DATE_EPOCH" ]] || SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)

        shopt -s nullglob
        set -- cuda_pathfinder/.moon-out/wheel-pure/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.pathfinder wheel, found $#" >&2
          exit 1
        }
        PATHFINDER_WHEEL=$1
        BINDINGS_OUTPUT="cuda_bindings/.moon-out/wheel-$WHEEL_VARIANT"
        set -- "$BINDINGS_OUTPUT"/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one $WHEEL_VARIANT cuda.bindings wheel, found $#" >&2
          exit 1
        }
        BINDINGS_WHEEL=$1

        CONSTRAINT_FILE="$CONSTRAINTS/build.txt"
        cp ci/build-constraints.txt "$CONSTRAINT_FILE"
        HOST_PLATFORM_RESOLVED=$(printenv HOST_PLATFORM || true)
        if [[ -z "$HOST_PLATFORM_RESOLVED" ]]; then
          HOST_PLATFORM_RESOLVED=$(python -c "import platform; print('win-64' if platform.system() == 'Windows' else 'linux-' + platform.machine())")
        fi
        if [[ "$HOST_PLATFORM_RESOLVED" == win* ]]; then
          PATHFINDER_URI=$(python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())" "$PATHFINDER_WHEEL")
          BINDINGS_URI=$(python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())" "$BINDINGS_WHEEL")
          CONSTRAINT_HOST=$(cygpath -w "$(pwd)/$CONSTRAINT_FILE")
          {
            printf 'cuda-pathfinder @ %s\n' "$PATHFINDER_URI"
            printf 'cuda-bindings @ %s\n' "$BINDINGS_URI"
          } >> "$CONSTRAINT_FILE"
          CIBW_ENVIRONMENT_BASE=$(printenv CIBW_ENVIRONMENT_WINDOWS || true)
          export CIBW_ENVIRONMENT_WINDOWS="$CIBW_ENVIRONMENT_BASE PIP_BUILD_CONSTRAINT=\"$CONSTRAINT_HOST\" PIP_CONSTRAINT=\"$CONSTRAINT_HOST\" CUDA_CORE_BUILD_MAJOR=$CUDA_MAJOR SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
        else
          PATHFINDER_URI=$(python -c "from pathlib import Path; import sys; print(Path('/host' + Path(sys.argv[1]).resolve().as_posix()).as_uri())" "$PATHFINDER_WHEEL")
          BINDINGS_URI=$(python -c "from pathlib import Path; import sys; print(Path('/host' + Path(sys.argv[1]).resolve().as_posix()).as_uri())" "$BINDINGS_WHEEL")
          CONSTRAINT_HOST=$(realpath "$CONSTRAINT_FILE")
          CONSTRAINT_CONTAINER="/host$CONSTRAINT_HOST"
          {
            printf 'cuda-pathfinder @ %s\n' "$PATHFINDER_URI"
            printf 'cuda-bindings @ %s\n' "$BINDINGS_URI"
          } >> "$CONSTRAINT_FILE"
          CIBW_ENVIRONMENT_BASE=$(printenv CIBW_ENVIRONMENT_LINUX || true)
          export CIBW_ENVIRONMENT_LINUX="$CIBW_ENVIRONMENT_BASE PIP_BUILD_CONSTRAINT=\"$CONSTRAINT_CONTAINER\" PIP_CONSTRAINT=\"$CONSTRAINT_CONTAINER\" CUDA_CORE_BUILD_MAJOR=$CUDA_MAJOR SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
        fi
        export PIP_BUILD_CONSTRAINT="$CONSTRAINT_HOST"
        export PIP_CONSTRAINT="$CONSTRAINT_HOST"
        export CUDA_CORE_BUILD_MAJOR="$CUDA_MAJOR"

        python -m cibuildwheel --output-dir "$OUTPUT" cuda_core
        if [[ "$HOST_PLATFORM_RESOLVED" != win* ]] && find "$OUTPUT" ! -user "$(id -u)" -print -quit | grep -q .; then
          command -v sudo >/dev/null || {
            echo "cibuildwheel output is not owned by this user and sudo was not found: $OUTPUT" >&2
            exit 1
          }
          sudo chown -R "$(id -u):$(id -g)" "$OUTPUT"
        fi
        set -- "$OUTPUT"/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one $WHEEL_VARIANT cuda.core wheel, found $#" >&2
          exit 1
        }
        WHEEL=$1
        WHEEL_WITHOUT_SUFFIX=$(printf '%s\n' "$WHEEL" | sed 's/\.whl$//')
        mv -- "$WHEEL" "$WHEEL_WITHOUT_SUFFIX.cu$CUDA_MAJOR.whl"
    deps:
      - target: pathfinder:wheel-pure
        cacheStrategy: outputs
      - target: bindings:wheel-current
        cacheStrategy: outputs
    env:
      BUILD_CUDA_MAJOR: '${BUILD_CUDA_MAJOR}'
      BUILD_CUDA_VER: '${BUILD_CUDA_VER}'
      CIBW_BUILD: '${CIBW_BUILD}'
      CUDA_PATH: '${CUDA_PATH}'
      CUDA_PYTHON_WHEEL_VARIANT: current
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    inputs:
      # Keep same-phase source proxies so affected selection sees upstream
      # changes before Moon expands executable dependencies.
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}

  wheel-previous:
    extends: wheel-current
    deps:
      - target: pathfinder:wheel-pure
        cacheStrategy: outputs
      - target: ~:fingerprint-package
        cacheStrategy: hash
      - target: test-helpers:fingerprint-python-build
        cacheStrategy: hash
      - target: test-helpers:fingerprint-native-context
        cacheStrategy: hash
    env:
      BUILD_PREV_CUDA_MAJOR: '${BUILD_PREV_CUDA_MAJOR}'
      CIBW_BUILD: '${CIBW_BUILD}'
      CUDA_PATH: '${CUDA_PATH}'
      CUDA_PYTHON_WHEEL_VARIANT: previous
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    inputs:
      - '@group(package)'
      # Dependency wheels are staged by different toolkit phases, so source
      # groups remain the affected-selection edges.
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_bindings/.moon-out/wheel-previous/*.whl'
      - '/ci/build-constraints.txt'
      - '/ci/tools/env-vars'
      - '/ci/versions.yml'
      - '/ci/build-matrix.yml'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/wheel-previous'
    options:
      mergeDeps: replace
      mergeEnv: replace
      mergeInputs: replace
      mergeOutputs: replace

  wheel-merge:
    command: python
    args:
      - ci/tools/merge_cuda_core_wheels.py
      - --wheel-dir
      - cuda_core/.moon-out/wheel-current
      - --wheel-dir
      - cuda_core/.moon-out/wheel-previous
      - --output-dir
      - cuda_core/.moon-out/wheel-merged
      - --clean-output
    # The current CUDA wheel is staged by an earlier toolkit phase. The
    # previous wheel is an executable dependency in this stable toolkit phase.
    deps:
      - target: test-helpers:fingerprint-python-build
        cacheStrategy: hash
      - target: ~:wheel-previous
        cacheStrategy: outputs
    inputs:
      - '@group(package)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_core/.moon-out/wheel-current/*.whl'
      - '/ci/tools/merge_cuda_core_wheels.py'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/wheel-merged'
    tags: [ci-build-native]
    type: build
    options:
      cache: true
      runInCI: true

  sdist:
    command: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        CUDA_MAJOR=$(printenv BUILD_CUDA_MAJOR || true)
        if [[ -z "$CUDA_MAJOR" ]]; then
          CUDA_VERSION=$(printenv BUILD_CUDA_VER || true)
          if [[ -z "$CUDA_VERSION" ]]; then
            CUDA_VERSION=$(printenv CUDA_VER || true)
          fi
          CUDA_MAJOR=$(cut -d . -f 1 <<< "$CUDA_VERSION")
        fi
        if [[ -z "$CUDA_MAJOR" ]] && command -v nvcc >/dev/null; then
          CUDA_MAJOR=$(nvcc --version | sed -n 's/.*release \([0-9][0-9]*\).*/\1/p' | head -n 1)
        fi
        [[ "$CUDA_MAJOR" =~ ^[0-9]+$ ]] || {
          echo "set BUILD_CUDA_MAJOR/BUILD_CUDA_VER or activate a toolkit with nvcc" >&2
          exit 1
        }
        if [[ -L cuda_core/.moon-out || ( -e cuda_core/.moon-out && ! -d cuda_core/.moon-out ) ]]; then
          echo "refusing to use non-directory output root: cuda_core/.moon-out" >&2
          exit 1
        fi
        if [[ -L cuda_core/.moon-out/sdist || ( -e cuda_core/.moon-out/sdist && ! -d cuda_core/.moon-out/sdist ) ]]; then
          echo "refusing to replace non-directory output: cuda_core/.moon-out/sdist" >&2
          exit 1
        fi
        mkdir -p cuda_core/.moon-out
        rm -rf -- cuda_core/.moon-out/sdist
        mkdir -p cuda_core/.moon-out/sdist

        shopt -s nullglob
        set -- cuda_pathfinder/.moon-out/sdist/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.pathfinder sdist wheel, found $#" >&2
          exit 1
        }
        PATHFINDER_WHEEL=$1
        set -- cuda_bindings/.moon-out/sdist/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.bindings sdist wheel, found $#" >&2
          exit 1
        }
        BINDINGS_WHEEL=$1
        SOURCE_DATE_EPOCH=$(printenv SOURCE_DATE_EPOCH || true)
        export SOURCE_DATE_EPOCH
        [[ -n "$SOURCE_DATE_EPOCH" ]] || SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
        CONSTRAINT_FILE=$(mktemp)
        trap 'rm -f "$CONSTRAINT_FILE"' EXIT
        cp ci/build-constraints.txt "$CONSTRAINT_FILE"
        HOST_PLATFORM_RESOLVED=$(printenv HOST_PLATFORM || true)
        if [[ -z "$HOST_PLATFORM_RESOLVED" ]]; then
          HOST_PLATFORM_RESOLVED=$(python -c "import platform; print('win-64' if platform.system() == 'Windows' else 'linux-' + platform.machine())")
        fi
        if [[ "$HOST_PLATFORM_RESOLVED" == win* ]]; then
          PATHFINDER_URI=$(python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())" "$PATHFINDER_WHEEL")
          BINDINGS_URI=$(python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())" "$BINDINGS_WHEEL")
          CONSTRAINT_HOST=$(cygpath -w "$CONSTRAINT_FILE")
        else
          PATHFINDER_URI=$(python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())" "$PATHFINDER_WHEEL")
          BINDINGS_URI=$(python -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())" "$BINDINGS_WHEEL")
          CONSTRAINT_HOST=$(realpath "$CONSTRAINT_FILE")
        fi
        {
          printf 'cuda-pathfinder @ %s\n' "$PATHFINDER_URI"
          printf 'cuda-bindings @ %s\n' "$BINDINGS_URI"
        } >> "$CONSTRAINT_FILE"
        export PIP_BUILD_CONSTRAINT="$CONSTRAINT_HOST"
        export PIP_CONSTRAINT="$CONSTRAINT_HOST"
        export CUDA_CORE_BUILD_MAJOR="$CUDA_MAJOR"

        python -m build --sdist --outdir cuda_core/.moon-out/sdist cuda_core
        set -- cuda_core/.moon-out/sdist/*.tar.gz
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.core source distribution, found $#" >&2
          exit 1
        }
        ARCHIVE=$1
        python -m pip wheel --no-deps \
          --wheel-dir cuda_core/.moon-out/sdist "$ARCHIVE"
        set -- cuda_core/.moon-out/sdist/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one cuda.core wheel from source distribution, found $#" >&2
          exit 1
        }
    deps:
      - target: pathfinder:sdist
        cacheStrategy: outputs
      - target: bindings:sdist
        cacheStrategy: outputs
    env:
      BUILD_CUDA_MAJOR: '${BUILD_CUDA_MAJOR}'
      BUILD_CUDA_VER: '${BUILD_CUDA_VER}'
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    inputs:
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}

  cython-test-assets:
    command: python
    args:
      - cuda_core/tests/cython/build_tests.py
      - --output-dir
      - cuda_core/.moon-out/cython-tests
    env:
      PYTHONPATH: cuda_python_test_helpers
    inputs:
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_pathfinder/.moon-out/wheel-pure/*.whl'
      - '/cuda_bindings/.moon-out/wheel-current/*.whl'
      - '/cuda_core/.moon-out/wheel-current/*.whl'
      - '/cuda_python_test_helpers/cuda_python_test_helpers/cython_test_builder.py'

  test-binaries:
    command: python
    args:
      - cuda_core/tests/test_binaries/build_test_binaries.py
      - --output-dir
      - cuda_core/.moon-out/test-binaries
    env:
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
    deps:
      - target: test-helpers:fingerprint-native-context
        cacheStrategy: hash
    inputs:
      - 'tests/test_binaries/build_test_binaries.py'
      - 'tests/test_binaries/saxpy.cu'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/test-binaries'
    tags: [ci-build-native]
    type: build
    options:
      cache: true
      os: [linux, windows]
      runInCI: true

  test:
    inputs:
      - '/cuda_pathfinder/**/*'
      - '/cuda_bindings/**/*'
      - '/cuda_python_test_helpers/**/*'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/tests/**/*'

  test-installed-linux:
    inputs:
      - '@group(tests)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_python_test_helpers/**/*'
      - '/ci/tools/merge_cuda_core_wheels.py'
      - '/ci/tools/setup-sanitizer'

  test-installed-windows:
    inputs:
      - '@group(tests)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_python_test_helpers/**/*'
      - '/ci/tools/merge_cuda_core_wheels.py'

  docs:
    args: [docs-build]
    inputs:
      - {project: pathfinder, group: package}
      - {project: pathfinder, group: docs}
      - {project: bindings, group: package}
      - {project: bindings, group: docs}

  docs-ci:
    inputs:
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}

  quality-api-release:
    command: uvx
    args:
      - --no-managed-python
      - --no-python-downloads
      - griffe
      - check
      - cuda.core
      - --search
      - cuda_core
      - --find-stubs-packages
      - --against
      - '${CUDA_CORE_API_RELEASE_BASE}'
      - --format
      - github
    env:
      CUDA_CORE_API_RELEASE_BASE: '${CUDA_CORE_API_RELEASE_BASE}'
    inputs:
      - 'cuda/core/**/*'
      - '/.github/actions/griffe-api-check/action.yml'
    tags: [ci-quality]
    type: test
    options:
      os: linux
      runInCI: true

  quality-api-base:
    command: uvx
    args:
      - --no-managed-python
      - --no-python-downloads
      - griffe
      - check
      - cuda.core
      - --search
      - cuda_core
      - --find-stubs-packages
      - --against
      - '${CUDA_CORE_API_MERGE_BASE}'
      - --format
      - github
    env:
      CUDA_CORE_API_MERGE_BASE: '${CUDA_CORE_API_MERGE_BASE}'
    inputs:
      - 'cuda/core/**/*'
      - '/.github/actions/griffe-api-check/action.yml'
    tags: [ci-quality]
    type: test
    options:
      os: linux
      runInCI: true
