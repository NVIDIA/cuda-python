$schema: https://moonrepo.dev/schemas/v2/project.json

language: unknown
layer: library
dependsOn:
  - id: pathfinder
    scope: production
  - id: bindings
    scope: production
  - id: test-helpers
    scope: development
toolchains:
  default: system

taskOptions:
  cache: false
  runFromWorkspaceRoot: true
  runInCI: false

fileGroups:
  package:
    - '.git_archival.txt'
    - 'cuda/**/*'
    - 'build_hooks.py'
    - 'DESCRIPTION.rst'
    - 'LICENSE'
    - 'MANIFEST.in'
    - 'NOTICE'
    - 'pyproject.toml'
    - 'setup.py'
  tests:
    - 'examples/**/*'
    - 'tests/**/*'
    - 'pixi.toml'
    - 'pixi.lock'
    - 'pytest.ini'
  docs:
    - 'docs/**/*'
    - 'pixi.toml'
    - 'pixi.lock'

tasks:
  wheel-current:
    command: python
    args: [ci/tools/moon_ci.py, native-wheel, core, --lane, current]
    deps:
      - target: bindings:wheel-current
        cacheStrategy: outputs
    env:
      BUILD_CUDA_MAJOR: '${BUILD_CUDA_MAJOR}'
      BUILD_CUDA_VER: '${BUILD_CUDA_VER}'
      CIBW_BUILD: '${CIBW_BUILD}'
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    inputs:
      - '@group(package)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_pathfinder/.moon-out/wheel-pure/*.whl'
      - '/cuda_bindings/.moon-out/wheel-current/*.whl'
      - '/ci/tools/moon_ci.py'
      - '/ci/tools/moon_fingerprint.py'
      - '/ci/tools/env-vars'
      - '/ci/tools/merge_cuda_core_wheels.py'
      - '/ci/versions.yml'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/wheel-current'
    checks:
      - check: fingerprint
        script: python ci/tools/moon_fingerprint.py core native
        hash: stdout
    tags:
      - ci-wheel-current
      - runner-build-linux-64
      - runner-build-linux-aarch64
      - runner-build-windows
    type: build
    options:
      cache: true
      cacheKey: wheel-current-v2
      priority: critical
      runInCI: true

  wheel-previous:
    command: python
    args: [ci/tools/moon_ci.py, native-wheel, core, --lane, previous]
    env:
      BUILD_PREV_CUDA_MAJOR: '${BUILD_PREV_CUDA_MAJOR}'
      CIBW_BUILD: '${CIBW_BUILD}'
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    inputs:
      - '@group(package)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_pathfinder/.moon-out/wheel-pure/*.whl'
      - '/cuda_bindings/.moon-out/wheel-previous/*.whl'
      - '/ci/tools/moon_ci.py'
      - '/ci/tools/moon_fingerprint.py'
      - '/ci/tools/env-vars'
      - '/ci/versions.yml'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/wheel-previous'
    checks:
      - check: fingerprint
        script: python ci/tools/moon_fingerprint.py core previous
        hash: stdout
    tags:
      - runner-build-linux-64
      - runner-build-linux-aarch64
      - runner-build-windows
    type: build
    options:
      cache: true
      cacheKey: wheel-previous-v2
      priority: critical
      runInCI: true

  wheel-merge:
    command: python
    args: [ci/tools/moon_ci.py, merge-core-wheels]
    # Current and previous CUDA toolkits are provisioned outside Moon, so the
    # two input wheels are deliberately staged in separate invocations before
    # this task merges their declared outputs.
    inputs:
      - '@group(package)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_core/.moon-out/wheel-current/*.whl'
      - '/cuda_core/.moon-out/wheel-previous/*.whl'
      - '/ci/tools/moon_ci.py'
      - '/ci/tools/moon_fingerprint.py'
      - '/ci/tools/merge_cuda_core_wheels.py'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/wheel-merged'
    checks:
      - check: fingerprint
        script: python ci/tools/moon_fingerprint.py core native
        hash: stdout
    tags:
      - runner-build-linux-64
      - runner-build-linux-aarch64
      - runner-build-windows
    type: build
    options:
      cache: true
      cacheKey: wheel-merge-v2
      runInCI: true

  sdist:
    command: python
    args: [ci/tools/moon_ci.py, sdist, core]
    deps:
      - target: pathfinder:sdist
        cacheStrategy: outputs
      - target: bindings:sdist
        cacheStrategy: outputs
    env:
      BUILD_CUDA_MAJOR: '${BUILD_CUDA_MAJOR}'
      BUILD_CUDA_VER: '${BUILD_CUDA_VER}'
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
      PY_VER: '${PY_VER}'
    inputs:
      - '@group(package)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/ci/tools/moon_ci.py'
      - '/ci/tools/moon_fingerprint.py'
      - '/.github/workflows/test-sdist-linux.yml'
      - '/.github/workflows/test-sdist-windows.yml'
    outputs:
      - '.moon-out/sdist'
    checks:
      - check: fingerprint
        script: python ci/tools/moon_fingerprint.py core sdist
        hash: stdout
    tags: [ci-sdist, runner-sdist-linux, runner-sdist-windows]
    type: build
    options:
      cache: true
      cacheKey: sdist-v2
      runInCI: true

  cython-test-assets:
    command: python
    args: [ci/tools/moon_ci.py, cython-test-assets, core]
    deps:
      - test-helpers:prepare-test-assets
    inputs:
      - '@group(package)'
      - 'tests/cython/**/*'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_pathfinder/.moon-out/wheel-pure/*.whl'
      - '/cuda_bindings/.moon-out/wheel-current/*.whl'
      - '/cuda_core/.moon-out/wheel-current/*.whl'
      - '/ci/tools/moon_ci.py'
      - '/ci/tools/moon_fingerprint.py'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/cython-tests'
    checks:
      - check: fingerprint
        script: python ci/tools/moon_fingerprint.py core test-assets
        hash: stdout
    tags:
      - ci-build-cython-assets
      - runner-build-linux-64
      - runner-build-linux-aarch64
      - runner-build-windows
    type: build
    options:
      cache: true
      cacheKey: cython-test-assets-v2
      os: [linux, windows]
      runInCI: true

  test-binaries:
    command: python
    args: [ci/tools/moon_ci.py, core-test-binaries]
    env:
      CUDA_PATH: '${CUDA_PATH}'
      HOST_PLATFORM: '${HOST_PLATFORM}'
    inputs:
      - '@group(package)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - 'tests/test_binaries/build_test_binaries.py'
      - 'tests/test_binaries/saxpy.cu'
      - '/ci/tools/moon_ci.py'
      - '/ci/tools/moon_fingerprint.py'
      - '/.github/workflows/build-wheel.yml'
    outputs:
      - '.moon-out/test-binaries'
    checks:
      - check: fingerprint
        script: python ci/tools/moon_fingerprint.py core test-assets
        hash: stdout
    tags:
      - runner-build-linux-64
      - runner-build-linux-aarch64
      - runner-build-windows
    type: build
    options:
      cache: true
      cacheKey: test-binaries-v2
      os: [linux, windows]
      runInCI: true

  test:
    command: python
    args: [ci/tools/moon_ci.py, pixi-test, core]
    inputs:
      - '@group(package)'
      - '@group(tests)'
      - '/cuda_pathfinder/**/*'
      - '/cuda_bindings/**/*'
      - '/cuda_python_test_helpers/**/*'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/tests/**/*'
      - '/ci/tools/moon_ci.py'
    type: test

  test-installed-linux:
    command: python
    args: [ci/tools/moon_ci.py, installed-test, core]
    inputs:
      - '@group(package)'
      - '@group(tests)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_python_test_helpers/**/*'
      - '/ci/tools/moon_ci.py'
      - '/ci/tools/run-tests'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/tests/**/*'
      - '/ci/tools/merge_cuda_core_wheels.py'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
      - '/ci/tools/guess_latest.sh'
      - '/ci/tools/install_gpu_driver.sh'
      - '/ci/tools/setup-sanitizer'
      - '/.github/workflows/test-wheel-linux.yml'
    tags: [ci-test-linux, runner-test-linux]
    type: test
    options:
      mutex: ci-python-gpu
      os: linux
      runInCI: true

  test-installed-windows:
    command: python
    args: [ci/tools/moon_ci.py, installed-test, core]
    inputs:
      - '@group(package)'
      - '@group(tests)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_python_test_helpers/**/*'
      - '/ci/tools/moon_ci.py'
      - '/ci/tools/run-tests'
      - '/ci/test-matrix.yml'
      - '/ci/tools/env-vars'
      - '/tests/**/*'
      - '/ci/tools/merge_cuda_core_wheels.py'
      - '/.github/workflows/build-pure-wheel.yml'
      - '/.github/workflows/build-wheel.yml'
      - '/ci/tools/configure_driver_mode.ps1'
      - '/ci/tools/install_gpu_driver.ps1'
      - '/.github/workflows/test-wheel-windows.yml'
    tags: [ci-test-windows, runner-test-windows]
    type: test
    options:
      mutex: ci-python-gpu
      os: windows
      runInCI: true

  docs:
    command: pixi
    args: [run, --manifest-path, cuda_core/pixi.toml, --environment, docs, docs-build]
    inputs:
      - '@group(package)'
      - '@group(docs)'
      - {project: pathfinder, group: package}
      - {project: pathfinder, group: docs}
      - {project: bindings, group: package}
      - {project: bindings, group: docs}
      - '/.github/workflows/build-docs.yml'

  docs-ci:
    command: python
    args: [ci/tools/moon_ci.py, docs-component, core]
    env:
      CUDA_PYTHON_DOCS_LATEST_ONLY: '${CUDA_PYTHON_DOCS_LATEST_ONLY}'
    inputs:
      - '@group(package)'
      - '@group(docs)'
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_python/docs/environment-docs.yml'
      - '/ci/tools/moon_ci.py'
      - '/.github/workflows/build-docs.yml'
    outputs:
      - '.moon-out/docs-ci'
    tags: [ci-docs, runner-docs]
    type: build
    options:
      os: linux
      runInCI: true

  quality-api-release:
    command: uvx
    args:
      - --no-managed-python
      - --no-python-downloads
      - griffe
      - check
      - cuda.core
      - --search
      - cuda_core
      - --find-stubs-packages
      - --against
      - '${CUDA_CORE_API_RELEASE_BASE}'
      - --format
      - github
    env:
      CUDA_CORE_API_RELEASE_BASE: '${CUDA_CORE_API_RELEASE_BASE}'
    inputs:
      - 'cuda/core/**/*'
      - '/.github/actions/griffe-api-check/action.yml'
    tags: [ci-quality, runner-quality]
    type: test
    options:
      os: linux
      runInCI: true

  quality-api-base:
    command: uvx
    args:
      - --no-managed-python
      - --no-python-downloads
      - griffe
      - check
      - cuda.core
      - --search
      - cuda_core
      - --find-stubs-packages
      - --against
      - '${CUDA_CORE_API_MERGE_BASE}'
      - --format
      - github
    env:
      CUDA_CORE_API_MERGE_BASE: '${CUDA_CORE_API_MERGE_BASE}'
    inputs:
      - 'cuda/core/**/*'
      - '/.github/actions/griffe-api-check/action.yml'
    tags: [ci-quality, runner-quality]
    type: test
    options:
      os: linux
      runInCI: true
