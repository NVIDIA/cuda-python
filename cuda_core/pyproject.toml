[build-system]
requires = [
    "scikit-build-core>=1.0",
    "setuptools-scm>=8,!=10.1",
    "Cython>=3.2.5,<3.3",
    "cython-cmake>=0.2.2,<0.4",
]
build-backend = "build_hooks"
backend-path = ["."]


[project]
name = "cuda-core"
dynamic = [
    "version",
]
readme = { file = "DESCRIPTION.rst", content-type = "text/x-rst" }
requires-python = '>=3.10'
description = "cuda.core: pythonic CUDA module"
authors = [
    { name = "NVIDIA Corporation" }
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
]
dependencies = [
    "cuda-pathfinder >=1.4.2",
    "numpy",
    "backports.strenum; python_version < '3.11'",
]

[project.optional-dependencies]
cu12 = ["cuda-bindings[all]==12.*", "cuda-toolkit==12.*"]
cu13 = ["cuda-bindings[all]==13.*", "cuda-toolkit==13.*"]

[dependency-groups]
test = [
    "cython>=3.2.5,<3.3",
    "scikit-build-core>=1.0",
    "setuptools>=80",
    "pytest==9.1.0",
    "pytest-benchmark==5.2.3",
    "pytest-randomly==4.1.0",
    "pytest-repeat==0.9.4",
    "pytest-rerunfailures==16.3",
    "pytest-timeout==2.4.0",
    "cloudpickle==3.1.2",
    "psutil==7.2.2",
    "docutils==0.23",
    # TODO: remove the Python 3.15 guard once 3.15 is officially supported
    "cffi==2.0.0; python_version < '3.15'",
]
# TODO: drop the Windows 3.15 guard once ml-dtypes publishes cp315 Windows wheels
ml-dtypes = ["ml-dtypes>=0.5.4,<0.6.0; sys_platform != 'win32' or python_version < '3.15'"]
test-cu12 = [ {include-group = "ml-dtypes" }, {include-group = "test" }, "cupy-cuda12x; python_version < '3.14'", "cuda-toolkit[cudart]==12.*"]  # runtime headers needed by CuPy
test-cu13 = [ {include-group = "ml-dtypes" }, {include-group = "test" }, "cupy-cuda13x; python_version < '3.14'", "cuda-toolkit[cudart]==13.*"]  # runtime headers needed by CuPy
# free threaded build, cupy doesn't support free-threaded builds yet, so avoid installing it for now
# TODO: cupy should support free threaded builds
test-cu12-ft = [ {include-group = "ml-dtypes" }, {include-group = "test" }, "cuda-toolkit[cudart]==12.*"]
test-cu13-ft = [ {include-group = "ml-dtypes" }, {include-group = "test" }, "cuda-toolkit[cudart]==13.*"]

[tool.uv]
conflicts = [
    [
        { extra = "cu12" },
        { extra = "cu13" },
    ],
    [
        { group = "test-cu12" },
        { group = "test-cu13" },
        { group = "test-cu12-ft" },
        { group = "test-cu13-ft" },
    ],
]

[project.urls]
homepage = "https://nvidia.github.io/cuda-python/"
documentation = "https://nvidia.github.io/cuda-python/cuda-core/"
repository = "https://github.com/NVIDIA/cuda-python/tree/main/cuda_core"
issues = "https://github.com/NVIDIA/cuda-python/issues/"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["cuda"]
wheel.reproducible = true
wheel.exclude = [
    "**/*.cpp",
    "**/*.def",
    "**/*.md",
    "**/*.pxi",
    "**/*.pyx",
]
sdist.include = [
    "cuda/core/_cpp/*.cpp",
    "cuda/core/_version.py",
]
sdist.exclude = [
    "**/*.cpp",
    "**/*.dll",
    "**/*.dylib",
    "**/*.o",
    "**/*.pyd",
    "**/*.so",
    "cython_debug/**",
    "tests/cython/build/**",
]

[tool.scikit-build.cmake.define]
CUDA_PYTHON_COVERAGE = { env = "CUDA_PYTHON_COVERAGE", default = "0" }

[tool.scikit-build.env]
CMAKE_BUILD_PARALLEL_LEVEL = { env = "CUDA_PYTHON_PARALLEL_LEVEL" }

[[tool.scikit-build.overrides]]
if.env.CUDA_PYTHON_COVERAGE = true
wheel.exclude = [
    "**/*.def",
    "**/*.md",
]

[[tool.scikit-build.overrides]]
if.state = "editable"
cmake.build-type = "Debug"

[[tool.scikit-build.overrides]]
if.state = "editable"
if.platform-system = "^win32"
cmake.build-type = "Release"

[tool.setuptools_scm]
root = ".."
version_file = "cuda/core/_version.py"
# Preserve a/b pre-release suffixes, but intentionally strip rc suffixes.
tag_regex = "^cuda-core-(?P<version>v\\d+\\.\\d+\\.\\d+(?:[ab]\\d+)?)"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "cuda-core-v*[0-9]*"]

[tool.mypy]
# Try to keep the mypy configuration similar between the subprojects

# Basic settings
python_version = "3.10"
namespace_packages = true
mypy_path = "cuda_core"

explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true

# Start strict, but allow some flexibility
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Allow some common patterns to keep it simple
allow_redefinition = true
implicit_reexport = true

# Ignore missing imports for now (you can tighten this later)
ignore_missing_imports = true

[[tool.mypy.overrides]]
# cpdef functions with Cython-native tuple return types can't carry type args
# through stubgen-pyx; suppress the resulting type-arg error for this module.
module = "cuda.core._utils.cuda_utils"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
# stubgen-pyx can't resolve DLPackExchangeAPI's C function-pointer typedef
# fields and emits bare "..." as their annotation, which is invalid outside
# a Callable[...] context. Suppress until upstream is fixed:
# https://github.com/jon-edward/stubgen-pyx/issues (report pending)
module = "cuda.core._dlpack"
disable_error_code = ["misc"]

[tool.cibuildwheel]
skip = "*-musllinux_*"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = "native"

[tool.cibuildwheel.windows]
archs = "AMD64"
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --namespace-pkg cuda --exclude \"torch_cpu.dll;torch_python.dll\" -w {dest_dir} {wheel}"
