[pytest]
addopts = --showlocals --durations=20
pythonpath = tests
norecursedirs = cython
filterwarnings =
    # A test left a memory resource alive; see "Release resources at test boundaries" in tests/AGENTS.md.
    # conftest.py makes helpers importable, which happens after pytest first
    # applies these filters (and warns); the filter is applied again per test.
    # The message regex below is pinned to pytest's wording (as of pytest 9.x);
    # if a pytest upgrade rewords "Failed to import filter module" this stops
    # suppressing the config warning (noisy, not fatal) and must be updated.
    ignore:Failed to import filter module.*UnreleasedMemoryResourceWarning:pytest.PytestConfigWarning
    error::helpers.memory.UnreleasedMemoryResourceWarning
markers =
    samples: tests for cuda.core standalone samples
    # Keep this authorship marker registry in sync across all pytest config roots.
    # Search for "agent_authored(model)" before editing.
    agent_authored(model): agent-authored test not yet materially human-reviewed
    human_reviewed: agent-authored test materially reviewed or rewritten by a human
    human_authored: test authored primarily by a human
    thread_unsafe(reason): test is not safe to run concurrently with other tests (e.g. uses mocks, patches globals, or mutates shared CUDA state)
    parallel_threads_limit(n): cap the number of parallel threads pytest-run-parallel uses for this test or module
