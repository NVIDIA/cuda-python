name: cuda-python-docs
channels:
  - conda-forge
dependencies:
  # ATTENTION: This dependency list is duplicated in
  #            toolshed/setup-docs-env.sh. Please KEEP THEM IN SYNC!
  - cython >=3.2.5,<3.3
  - myst-parser
  - numpy
  - numpydoc
  - pip
  - pydata-sphinx-theme
  - pytest
  - scipy
  - sphinx >=9,<10
  - sphinx-copybutton
  - myst-nb
  - enum_tools
  - pyclibrary
  - pip:
    - nvidia-sphinx-theme
    - sphinx-toolbox>=4.2.0
