$schema: https://moonrepo.dev/schemas/v2/project.json

language: unknown
layer: library
tags: [docs-package, installed-test-package, pure-wheel-package, python-package]
dependsOn:
  - pathfinder
  - bindings
  - core
  - id: test-helpers
    scope: development
fileGroups:
  package:
    - 'DESCRIPTION.rst'
    - 'LICENSE'
    - 'pyproject.toml'
    - 'setup.py'
  docs:
    - 'docs/**/*'

tasks:
  wheel-pure:
    command: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        if [[ -L cuda_python/.moon-out || ( -e cuda_python/.moon-out && ! -d cuda_python/.moon-out ) ]]; then
          echo "refusing to use non-directory output root: cuda_python/.moon-out" >&2
          exit 1
        fi
        if [[ -L cuda_python/.moon-out/wheel-pure || ( -e cuda_python/.moon-out/wheel-pure && ! -d cuda_python/.moon-out/wheel-pure ) ]]; then
          echo "refusing to replace non-directory output: cuda_python/.moon-out/wheel-pure" >&2
          exit 1
        fi
        mkdir -p cuda_python/.moon-out
        rm -rf -- cuda_python/.moon-out/wheel-pure
        mkdir -p cuda_python/.moon-out/wheel-pure

        # CI explicitly opts into the bindings version from its trusted staged
        # wheel. Ordinary local builds always use the checkout's SCM version,
        # even when an output from an earlier build is still present.
        USE_STAGED_BINDINGS_VERSION=$(printenv CUDA_PYTHON_USE_STAGED_BINDINGS_VERSION || true)
        if [[ -n "$USE_STAGED_BINDINGS_VERSION" && "$USE_STAGED_BINDINGS_VERSION" != "1" ]]; then
          echo "CUDA_PYTHON_USE_STAGED_BINDINGS_VERSION must be unset or 1" >&2
          exit 1
        fi
        if [[ "$USE_STAGED_BINDINGS_VERSION" == "1" ]]; then
          shopt -s nullglob
          set -- cuda_bindings/.moon-out/wheel-current/*.whl
          [[ $# -eq 1 ]] || {
            echo "expected one staged cuda.bindings wheel, found $#" >&2
            exit 1
          }
          BINDINGS_VERSION=$(python -c "import email, sys, zipfile; archive = zipfile.ZipFile(sys.argv[1]); names = [name for name in archive.namelist() if name.endswith('.dist-info/METADATA')]; assert len(names) == 1, names; print(email.message_from_bytes(archive.read(names[0]))['Version'])" "$1")
          export SETUPTOOLS_SCM_PRETEND_VERSION="$BINDINGS_VERSION"
          export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CUDA_PYTHON="$BINDINGS_VERSION"
        fi
        SOURCE_DATE_EPOCH=$(printenv SOURCE_DATE_EPOCH || true)
        export SOURCE_DATE_EPOCH
        [[ -n "$SOURCE_DATE_EPOCH" ]] || SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
        BUILD_CONSTRAINTS=$(realpath ci/build-constraints.txt)
        case "$(uname -s)" in
          CYGWIN*|MINGW*|MSYS*) BUILD_CONSTRAINTS=$(cygpath -w "$BUILD_CONSTRAINTS") ;;
        esac
        export PIP_BUILD_CONSTRAINT="$BUILD_CONSTRAINTS"
        export PIP_CONSTRAINT="$BUILD_CONSTRAINTS"
        python -m pip wheel --verbose --no-deps \
          --wheel-dir cuda_python/.moon-out/wheel-pure ./cuda_python
        shopt -s nullglob
        set -- cuda_python/.moon-out/wheel-pure/*.whl
        [[ $# -eq 1 ]] || {
          echo "expected one cuda-python metapackage wheel, found $#" >&2
          exit 1
        }
    env:
      CUDA_PYTHON_USE_STAGED_BINDINGS_VERSION: '${CUDA_PYTHON_USE_STAGED_BINDINGS_VERSION}'
    inputs:
      # CI opts into the staged bindings version. Source proxies select this
      # task before the staged dependency wheels are materialized.
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - '/cuda_bindings/.moon-out/wheel-current/*.whl'

  sdist:
    inputs:
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}

  test-installed-linux:
    deps:
      - target: metapackage:wheel-pure
        cacheStrategy: outputs
    inputs:
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - {project: core, group: package}
      - '/cuda_core/.moon-out/wheel-merged/*.whl'
      - '/cuda_python/.moon-out/wheel-pure/*.whl'
      - '/ci/tools/merge_cuda_core_wheels.py'

  test-installed-windows:
    deps:
      - target: metapackage:wheel-pure
        cacheStrategy: outputs
    inputs:
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - {project: core, group: package}
      - '/cuda_core/.moon-out/wheel-merged/*.whl'
      - '/cuda_python/.moon-out/wheel-pure/*.whl'
      - '/ci/tools/merge_cuda_core_wheels.py'

  docs-ci:
    inputs:
      - {project: pathfinder, group: package}
      - {project: bindings, group: package}
      - {project: core, group: package}
