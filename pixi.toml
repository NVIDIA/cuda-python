[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]

[feature.cu12.dependencies]
[feature.cu13.dependencies]

[environments]
cu12 = { features = ["cu12"] }
cu13 = { features = ["cu13"] }
docs = { features = [], solve-group = "docs" }
lint = { features = ["lint"], no-default-feature = true }

[activation.env]
PIXI_ENVIRONMENT_NAME = "${PIXI_ENVIRONMENT_NAME/default/cu13}"

# Test Tasks
# Runs tests across all sub-packages: pathfinder → bindings → core (dependency order).
#
# Each sub-package has its own pixi.toml. We wrap each task in `bash -c '...'`
# (single-quoted in TOML, double-quoted inside) because pixi `cmd` arrays do
# not expand shell variables -- without this, the inner `pixi run` would drop
# into the sub-package's `default` environment, which lacks a cuda-version
# pin, causing the conda solver to pick a mismatched CUDA toolkit. Forwarding
# `-e "$PIXI_ENVIRONMENT_NAME"` keeps the active environment consistent end
# to end.
#
# Linux-only for now; Windows/macOS root test-task parity is tracked
# separately.
#
# Usage: pixi run test | pixi run -e cu12 test | pixi run -e cu13 test
[target.linux.tasks.test-pathfinder]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_pathfinder" -e "$PIXI_ENVIRONMENT_NAME" test',
]

[target.linux.tasks.test-bindings]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_bindings" -e "$PIXI_ENVIRONMENT_NAME" test',
]

[target.linux.tasks.test-core]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_core" -e "$PIXI_ENVIRONMENT_NAME" test',
]

[target.linux.tasks.test]
depends-on = [
    { task = "test-pathfinder" },
    { task = "test-bindings" },
    { task = "test-core" },
]

[target.linux.tasks.docs-pathfinder]
cmd = [
    "pixi",
    "run",
    "--manifest-path",
    "$PIXI_PROJECT_ROOT/cuda_pathfinder",
    "-e",
    "docs",
    "build-docs",
]

[target.linux.tasks.docs-bindings]
cmd = [
    "pixi",
    "run",
    "--manifest-path",
    "$PIXI_PROJECT_ROOT/cuda_bindings",
    "-e",
    "docs",
    "build-docs",
]

[target.linux.tasks.docs-core]
cmd = ["pixi", "run", "--manifest-path", "$PIXI_PROJECT_ROOT/cuda_core", "-e", "docs", "docs-build"]

[target.linux.tasks.docs]
depends-on = [
    { task = "docs-pathfinder" },
    { task = "docs-bindings" },
    { task = "docs-core" },
]

# Lint tasks.
#
# Every task routes through pre-commit rather than invoking ruff directly. That
# is deliberate: `.pre-commit-config.yaml` applies per-hook `exclude` patterns
# (generated `*.pyi` files, `_fast_enum.py`), so a bare `ruff check .` would
# reformat files that CI intentionally leaves alone. Going through pre-commit
# keeps `pixi run lint` and pre-commit.ci in agreement by construction.
#
# `ruff` is still available in this environment for ad-hoc one-off invocations
# (`pixi run -e lint ruff format <file>`).
#
# These live in their own feature + environment (with `no-default-feature`) so
# the linters are not solved into the cu12/cu13/docs environments, which would
# make those solves larger for no benefit.
[feature.lint.dependencies]
ruff = ">=0.15.3,<0.16"
pre-commit = ">=4,<5"

# Lint the whole tree -- the pre-commit.ci equivalent.
[feature.lint.tasks.lint]
cmd = ["pre-commit", "run", "--all-files"]

# Lint only what is staged -- the fast inner-loop check before committing.
[feature.lint.tasks.lint-staged]
cmd = ["pre-commit", "run"]

# Install the git hook so the above runs automatically on `git commit`.
# See toolshed/check_precommit_installed.py, which warns when it is missing.
[feature.lint.tasks.lint-install]
cmd = ["pre-commit", "install"]
