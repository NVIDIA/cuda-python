[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]

[feature.cu12.dependencies]
[feature.cu13.dependencies]

[environments]
cu12 = { features = ["cu12"] }
cu13 = { features = ["cu13"] }
docs = { features = [], solve-group = "docs" }
clean = { features = ["clean"], no-default-feature = true }

[activation.env]
PIXI_ENVIRONMENT_NAME = "${PIXI_ENVIRONMENT_NAME/default/cu13}"

# Test Tasks
# Runs tests across all sub-packages: pathfinder → bindings → core (dependency order).
#
# Each sub-package has its own pixi.toml. We wrap each task in `bash -c '...'`
# (single-quoted in TOML, double-quoted inside) because pixi `cmd` arrays do
# not expand shell variables -- without this, the inner `pixi run` would drop
# into the sub-package's `default` environment, which lacks a cuda-version
# pin, causing the conda solver to pick a mismatched CUDA toolkit. Forwarding
# `-e "$PIXI_ENVIRONMENT_NAME"` keeps the active environment consistent end
# to end.
#
# Linux-only for now; Windows/macOS root test-task parity is tracked
# separately.
#
# Usage: pixi run test | pixi run -e cu12 test | pixi run -e cu13 test
[target.linux.tasks.test-pathfinder]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_pathfinder" -e "$PIXI_ENVIRONMENT_NAME" test',
]

[target.linux.tasks.test-bindings]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_bindings" -e "$PIXI_ENVIRONMENT_NAME" test',
]

[target.linux.tasks.test-core]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_core" -e "$PIXI_ENVIRONMENT_NAME" test',
]

[target.linux.tasks.test]
depends-on = [
    { task = "test-pathfinder" },
    { task = "test-bindings" },
    { task = "test-core" },
]

[target.linux.tasks.docs-pathfinder]
cmd = [
    "pixi",
    "run",
    "--manifest-path",
    "$PIXI_PROJECT_ROOT/cuda_pathfinder",
    "-e",
    "docs",
    "build-docs",
]

[target.linux.tasks.docs-bindings]
cmd = [
    "pixi",
    "run",
    "--manifest-path",
    "$PIXI_PROJECT_ROOT/cuda_bindings",
    "-e",
    "docs",
    "build-docs",
]

[target.linux.tasks.docs-core]
cmd = ["pixi", "run", "--manifest-path", "$PIXI_PROJECT_ROOT/cuda_core", "-e", "docs", "docs-build"]

[target.linux.tasks.docs]
depends-on = [
    { task = "docs-pathfinder" },
    { task = "docs-bindings" },
    { task = "docs-core" },
]

[dependencies]
ruff = ">=0.15.3,<0.16"

# Remove stale build artifacts (compiled Cython extensions, generated .pyx/.cpp,
# the cache_driver/cache_runtime/cache_nvrtc parser caches). Needed when moving a
# checkout between the cu12 and cu13 environments, where leftovers from the
# previous CUDA major make the next build fail with errors that point at code
# which is fine.
#
#   pixi run clean-dry-run   # show what would be removed
#   pixi run clean           # remove it
#
# Lives in its own environment (with `no-default-feature`) so that the Python
# needed to run the script is not solved into the cu12/cu13/docs environments.
[feature.clean.dependencies]
python = ">=3.10"

[feature.clean.tasks.clean]
cmd = ["python", "toolshed/clean.py"]

[feature.clean.tasks.clean-dry-run]
cmd = ["python", "toolshed/clean.py", "--dry-run"]
