[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]

[feature.cu12.dependencies]
[feature.cu13.dependencies]

[environments]
cu12 = { features = ["cu12"] }
cu13 = { features = ["cu13"] }
docs = { features = [], solve-group = "docs" }

[activation.env]
PIXI_ENVIRONMENT_NAME = "${PIXI_ENVIRONMENT_NAME/default/cu13}"

# Test Tasks
# Runs tests across all sub-packages: pathfinder → bindings → core (dependency order).
#
# Each sub-package has its own pixi.toml. Forward `-e "$PIXI_ENVIRONMENT_NAME"`
# so nested tasks keep the selected CUDA environment. Pixi expands variables
# while rendering these command arrays, before Bash runs: use existing
# environment variables, not variables assigned inside the Bash command.
#
# Linux-only for now; Windows/macOS root test-task parity is tracked
# separately.
#
# Usage: pixi run test | pixi run -e cu12 test | pixi run -e cu13 test
[target.linux.tasks.test-pathfinder]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_pathfinder" -e "$PIXI_ENVIRONMENT_NAME" test',
]

[target.linux.tasks.test-bindings]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_bindings_${PIXI_ENVIRONMENT_NAME#cu}" -e "$PIXI_ENVIRONMENT_NAME" test',
]

[target.linux.tasks.test-core]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_core" -e "$PIXI_ENVIRONMENT_NAME" test',
]

[target.linux.tasks.test-samples-bindings]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_bindings_13" test-samples',
]

[target.linux.tasks.test-samples-core]
cmd = [
    "bash",
    "-c",
    'pixi run --manifest-path "$PIXI_PROJECT_ROOT/cuda_core" test-samples',
]

[target.linux.tasks.test-samples]
depends-on = [
    { task = "test-samples-bindings" },
    { task = "test-samples-core" },
]

[target.linux.tasks.test]
depends-on = [
    { task = "test-pathfinder" },
    { task = "test-bindings" },
    { task = "test-core" },
]

[target.linux.tasks.docs-pathfinder]
cmd = [
    "pixi",
    "run",
    "--manifest-path",
    "$PIXI_PROJECT_ROOT/cuda_pathfinder",
    "-e",
    "docs",
    "build-docs",
]

[target.linux.tasks.docs-bindings]
cmd = [
    "pixi",
    "run",
    "--manifest-path",
    "$PIXI_PROJECT_ROOT/cuda_bindings_13",
    "-e",
    "docs",
    "build-docs",
]

[target.linux.tasks.docs-core]
cmd = ["pixi", "run", "--manifest-path", "$PIXI_PROJECT_ROOT/cuda_core", "-e", "docs", "docs-build"]

[target.linux.tasks.docs]
depends-on = [
    { task = "docs-pathfinder" },
    { task = "docs-bindings" },
    { task = "docs-core" },
]

[dependencies]
ruff = ">=0.15.3,<0.16"
