# Configuration for lychee, the doc link-checker invoked from
# .github/actions/check-doc-links. See https://lychee.cli.rs/usage/config/.

exclude = [
    # PR previews are not published yet during link checking.
    '^https://nvidia\.github\.io/cuda-python/pr-preview/pr-[0-9]+/',
    # The cuda-bindings #id links are docutils "problematic" anchors from generated API docs.
    # TODO: Remove this exclusion after cybind stops emitting those problematic anchors.
    '^file://.*/cuda-bindings/latest/module/(driver|runtime)\.html#id[0-9]+$',
    # Preferred Networks rejects hosted-runner GETs, but the URL is browser reachable.
    '^https://www\.preferred\.jp/en/?$',
]
