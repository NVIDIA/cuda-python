$schema: https://moonrepo.dev/schemas/v2/tasks.json

inheritedBy:
  tag: python-package

fileGroups:
  # setuptools-scm's file finder includes every tracked project file in an
  # sdist, not only the files that affect an installed wheel. Moon applies the
  # workspace VCS ignore rules while expanding this glob, so generated build
  # and .moon-out directories remain outside the hash.
  sdist:
    - '**/*'
    - '.git_archival.txt'
    - '!{.cache,.moon-out,.mypy_cache,.nox,.pixi,.pytest_cache,.ruff_cache,.tox,.venv,build,dist,htmlcov}/**/*'
    - '!**/{__pycache__,*.egg-info,cython_debug}/**/*'
    - '!**/*.{a,lib,o,pyc,pyo,so}'
    - '!**/_version.py'
    - '!docs/{build,source/generated}/**/*'

taskOptions:
  cache: false
  runFromWorkspaceRoot: true
  runInCI: false
  shell: false

tasks:
  fingerprint-package:
    inputs: []
    checks:
      - check: fingerprint
        script: >-
          python -c "import subprocess;
          subprocess.run(['git', 'describe', '--always', '--dirty', '--tags', '--long',
          '--match', 'v*[0-9]*'], check=True)"
        hash: stdout
    type: build
    options:
      internal: true
      runInCI: true

  sdist:
    deps:
      - target: ~:fingerprint-package
        cacheStrategy: hash
    inputs:
      - '@group(sdist)'
      - '/ci/build-constraints.txt'
      - '/.github/workflows/test-sdist-linux.yml'
      - '/.github/workflows/test-sdist-windows.yml'
    outputs:
      - '.moon-out/sdist'
    tags: [ci-sdist]
    type: build
    options:
      cache: true
      runInCI: true
